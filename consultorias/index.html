     <p class="mut" style="font-size:12.5px;margin:0 0 8px">Escolha pela origem. Prometa que é rápido e <b>já emende</b> na pergunta — não fique perguntando "pode falar?".</p>
     <div class="script"><b>🤝 Indicação (a mais quente):</b><br>"Oi <b>[nome]</b>! Aqui é o/a [SDR] do Líderes do Brasil. Quem me falou de você foi o <b>[indicador]</b> — disse que você manda muito bem no <b>[ramo]</b>. Prometo ser rápido, nem um cafezinho de tempo. Deixa eu já te entender melhor…"</div>
     <div class="script"><b>📩 Inbound:</b><br>"Oi <b>[nome]</b>, aqui é o/a [SDR] do Líderes do Brasil. Vi que você [baixou X / se inscreveu no encontro] — então já aproveito e te explico rapidinho, sem enrolação. Me conta uma coisa…"</div>
     <div class="script"><b>❄️ Outbound frio:</b><br>"Oi <b>[nome]</b>, aqui é o/a [SDR] do Líderes do Brasil, a maior comunidade de empresários de Brasília. Vou ser bem direto pra respeitar seu tempo — deixa eu te fazer uma pergunta…"</div>
     <span class="go">↓ EMENDE DIRETO NO PASSO 2 (não espere "pode falar?")</span></div>

function scSDR_B2(){return `
 <div class="card" style="border-left:3px solid var(--brand-primary-2)"><div class="flex between wrap"><h2 style="margin:0;font-size:15px">🎯 ROTEIRO DO SDR — siga de cima para baixo</h2><span class="pill pri">Qualificar & agendar a Sessão Estratégica — NÃO fechar</span></div>
   <p style="font-size:13px;margin:10px 0 0;line-height:1.6">Você <b>conduz com perguntas</b> (fale 30%, ouça 70%), vende a <b>SESSÃO ESTRATÉGICA gratuita</b> (nunca o plano/preço) e <b>anota tudo no CRM</b>. É um fluxo só: cada passo emenda no próximo.</p>
   <div class="flex wrap mt" style="gap:20px"><div><div style="font-size:19px;font-weight:800">40-60</div><div class="eyebrow mut">tentativas/dia</div></div><div><div style="font-size:19px;font-weight:800">8-12</div><div class="eyebrow mut">conexões/dia</div></div><div><div style="font-size:19px;font-weight:800">2-3</div><div class="eyebrow mut">sessões agendadas/dia</div></div><div><div style="font-size:19px;font-weight:800">≤20%</div><div class="eyebrow mut">no-show alvo</div></div></div></div>

 <div class="card mt"><div class="rot">
   <div class="step" data-n="1"><h3>Abertura (leve, sem pedir permissão)</h3>
     <p class="mut" style="font-size:12.5px;margin:0 0 8px">Escolha pela origem. Prometa que é rápido e <b>já emende</b> na pergunta.</p>
     <div class="script"><b>🤝 Indicação:</b><br>"Oi <b>[nome]</b>! Aqui é o/a [SDR] da B2 Inteligência Financeira. Quem me passou seu contato foi o <b>[indicador]</b> — falou que você ia curtir organizar melhor a vida financeira. Prometo ser rápido. Deixa eu te entender…"</div>
     <div class="script"><b>📩 Inbound:</b><br>"Oi <b>[nome]</b>, aqui é o/a [SDR] da B2. Vi que você [baixou X / respondeu nosso quiz financeiro] — então já aproveito e te explico rapidinho como a gente pode te dar um norte. Me conta uma coisa…"</div>
     <div class="script"><b>❄️ Outbound frio:</b><br>"Oi <b>[nome]</b>, aqui é o/a [SDR] da B2 Inteligência Financeira. A gente ajuda pessoas a saírem do aperto e construírem liberdade financeira com método. Vou ser bem direto pra respeitar seu tempo…"</div>
     <span class="go">↓ EMENDE DIRETO NO PASSO 2</span></div>

   <div class="step" data-n="2"><h3>Pré-qualificação (perguntas encadeadas)</h3>
     <p class="mut" style="font-size:12.5px;margin:0 0 8px">Vá perguntando de leve, uma emendando na outra:</p>
     <div class="script">"Só pra eu te situar: hoje sua vida financeira tá mais <b>no aperto, equilibrada ou já sobrando pra investir</b>?" → "Você já tem uma <b>reserva</b> guardada?" → "E o que você <b>mais queria resolver</b> — sair de dívida, organizar e guardar, ou investir melhor?"</div>
     <p class="mut" style="font-size:12.5px;margin:6px 0 0">💡 <b>Renda exata NÃO se pergunta agora</b> — ele nem te conhece. A dimensão do dinheiro aparece sozinha na Implicação (passo 3).</p>
     <span class="go">↓ Tem renda e um objetivo real? Vá pro passo 3.</span></div>

   <div class="step" data-n="3"><h3>Diagnóstico com SPIN (conversa, não interrogatório)</h3>
     <p class="mut" style="font-size:12.5px;margin:0 0 8px"><b>Reaja</b> ao que ele disser, com as palavras dele:</p>
     <div class="script"><b>Situação:</b> "Como você se organiza hoje — tem planilha, app, ou é mais no automático?"</div>
     <div class="script"><b>Problema:</b> "E o que mais te incomoda no seu dinheiro hoje? O que tira seu sono?" … "Sente que ganha bem mas não sobra?"</div>
     <div class="script"><b>Implicação:</b> "E isso te custa o quê — juros do rotativo, oportunidade de investir, aquele sonho adiado?" <i>(aqui ele mesmo costuma soltar valores/renda)</i></div>
     <div class="script"><b>Necessidade:</b> "Se você tivesse um guia e um método pra colocar isso nos trilhos, o que mudaria pra você e pra sua família?"</div>
     <span class="go">↓ Ele reconheceu a dor e quer mudar? Confirme o PDMAF (passo 4).</span></div>

   <div class="step" data-n="4"><h3>Confirme o PDMAF (na cabeça, enquanto conversa)</h3>
     <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px">
       ${[["P","Perfil","renda p/ acompanhamento"],["D","Dor","dor financeira real"],["M","Momento","aberto a mudar agora"],["A","Autoridade","decide (ou traz cônjuge)"],["F","Fit","quer método/guia"]].map(([l,h,p])=>`<div class="card" style="padding:10px;text-align:center"><div class="stat-big" style="font-size:20px">${l}</div><b style="font-size:12px">${h}</b><p class="mut" style="font-size:11px;margin:4px 0 0">${p}</p></div>`).join("")}</div>
     <span class="go">↓ Só agende com os 5 ok. Vá pro passo 5.</span></div>

   <div class="step" data-n="5"><h3>Ponte + Agendamento da Sessão Estratégica (retome tudo)</h3>
     <div class="script">"<b>[nome]</b>, deixa eu te falar por que faz TANTO sentido: você me disse que sofre com <b>[dor]</b> <i>(D)</i>, que quer <b>[objetivo]</b> e que agora é a hora <i>(M)</i>. É exatamente pra isso que a B2 existe <i>(F)</i> — a gente te dá um norte e um método. Vou te reservar uma <b>Sessão Estratégica gratuita de ~1h com o [Planejador]</b>, que faz um raio-x da sua vida financeira e te mostra o caminho. <b>Prefere amanhã 10h ou 16h?</b>"</div>
     <p class="mut" style="font-size:12.5px;margin:6px 0 0">✅ Sempre <b>2 opções de horário</b>. Ao mover o lead para <b>"Sessão Estratégica Agendada"</b> no CRM, o sistema cria as tarefas anti-no-show (confirmar hoje + lembrar antes).</p>
     <span class="go">↓ Feche o loop no WhatsApp (passo 6).</span></div>

   <div class="step" data-n="6"><h3>Feche o loop no WhatsApp (objetivo do handoff)</h3>
     <p class="mut" style="font-size:12.5px;margin:0 0 8px">Manda na hora: (1) confirmação com dia/hora + nome do Planejador; (2) o que é a Sessão + 1 prova social. Peça pra ele vir com noção dos gastos do mês.</p>
     <div class="script">"Fechado, <b>[nome]</b>! Tá confirmado <b>[data] às [hora]</b> com o [Planejador] 🧭. Na Sessão a gente faz um raio-x gratuito da sua vida financeira e já te mostra um norte. Se puder, chega com uma noção dos seus gastos do mês — deixa mais preciso. Qualquer coisa, é só chamar!"</div>
     <span class="go">↓ Se surgir objeção em qualquer passo, use o passo 7.</span></div>

   <div class="step" data-n="7"><h3>Quebra de objeções (acolhe → reformula → devolve pergunta)</h3>
     ${[["“Me manda por WhatsApp”","“Mando sim! Mas a Sessão é gratuita e em ~1h o planejador te mostra um raio-x que nenhum texto mostra. Posso reservar seu horário?”"],
        ["“Não tenho interesse”","“Tranquilo. Só pra eu não te incomodar à toa: é o tema (organizar o dinheiro / investir melhor) que não faz sentido, ou é o momento?”"],
        ["“Não tenho dinheiro sobrando pra isso”","“É exatamente por isso que a Sessão é gratuita — ela existe pra achar dinheiro que hoje está escorrendo. Muita gente sai da Sessão já sabendo onde economizar. Bora fazer?”"],
        ["“Eu mesmo consigo organizar / faço sozinho”","“Ótimo que você se cuida! Nosso papel é ser o guia e a disciplina que fazem você chegar mais rápido e sem erro. Na Sessão você já leva valor, decide depois. Amanhã 10h ou 16h?”"],
        ["“Já tenho gerente/assessor no banco”","“Faz sentido. A diferença é que gerente ganha te vendendo produto; a B2 é <b>fee-based</b> e planeja sua vida financeira inteira, sem conflito de interesse. Vale comparar numa Sessão gratuita.”"],
        ["“Tô sem tempo agora”","“Justamente por isso: a Sessão organiza e economiza seu tempo depois. Te ligo [hoje 17h / amanhã 9h] pra marcar?”"],
        ["“Quanto custa?”","“A Sessão é gratuita. O acompanhamento tem caminhos pra momentos diferentes, e quem te mostra o que encaixa é o planejador — depende do seu objetivo. O que eu preciso agora é reservar seu horário. Pode ser?”"],
        ["“Isso é venda de investimento/seguro?”","“Não 😄 — a gente é planejamento, fee-based. Ninguém te empurra produto. Na Sessão você vê como funciona, sem compromisso.”"],
        ["“Vou pensar / depois eu vejo”","“Fechado. Deixa eu garantir seu diagnóstico gratuito essa semana — se não fizer sentido, você me fala lá mesmo. Amanhã 10h ou 16h?”"]
       ].map(([o,r])=>`<div class="script"><b>${o}</b><br>${r}</div>`).join("")}</div>

   <div class="step" data-n="8"><h3>Se NÃO atendeu → cadência</h3>
     <p class="mut" style="font-size:13px;margin:0">Siga a <b>cadência do SDR</b> (aba Prospecção & Cadências): no mesmo D0 — ligou/não atendeu → WhatsApp com áudio (diagnóstico gratuito) → liga de novo à tarde. Até o break-up no D12. Nunca desista antes de 7-12 toques.</p>
     <span class="go">Abra: Prospecção & Cadências →</span></div>
 </div></div>

 <div class="card mt" style="border-left:3px solid var(--brand-ok)"><h2 style="margin:0 0 6px;font-size:15px">✅ Checklist de handoff pro Planejador (para a Sessão R0)</h2>
   <p class="mut" style="font-size:13px;margin:0">[ ] dor/objetivo anotados no CRM · [ ] momento da jornada (dívida/organização/investir) · [ ] faixa de renda percebida · [ ] tem reserva? · [ ] quem decide (traz cônjuge?) · [ ] data/hora confirmada + WhatsApp enviado · [ ] rotina anti-no-show criada · [ ] temperatura e score preenchidos.</p></div>`;

function scCLO_B2(){return `
 <div class="card" style="border-left:3px solid var(--brand-primary-2)"><div class="flex between wrap"><h2 style="margin:0;font-size:15px">🤝 ROTEIRO DO PLANEJADOR — Sessão Estratégica (R0)</h2><span class="pill pri">Diagnosticar, mostrar o Norte & FECHAR o plano</span></div>
   <p style="font-size:13px;margin:10px 0 0;line-height:1.6">O SDR te entrega o lead aquecido. Você conduz a <b>R0</b>: escuta, monta o <b>mapa de necessidades</b>, mostra a <b>jornada</b>, apresenta por valor, ancora o plano e <b>fecha</b> — com elegância, colocando o cliente na parede na hora certa. Você é o GUIA.</p></div>

 <div class="card mt"><div class="rot">
   <div class="step" data-n="0"><h3>Preparação (antes da Sessão)</h3>
     <ul class="mut" style="font-size:13px;line-height:1.8;padding-left:18px;margin:0"><li>Leia as <b>notas do SDR</b>: dor, objetivo, momento da jornada, se tem reserva, quem decide.</li><li>Tenha sua <b>hipótese de valor</b>: qual pilar do Banco de Soluções resolve a dor dele.</li><li>Se possível, peça os gastos do mês antecipados (deixa o diagnóstico mais preciso).</li></ul>
     <span class="go">↓ Comece a Sessão (passo 1).</span></div>

   <div class="step" data-n="1"><h3>Rapport + combinar a agenda (2–3 min)</h3>
     <div class="script">"<b>[nome]</b>, prazer! Ó, pra gente aproveitar bem essa hora: eu vou te <b>entender a fundo</b>, montar um <b>raio-x</b> da sua situação e te mostrar um <b>norte</b> — o caminho. Se fizer sentido pros dois, a gente já acerta como começar. Pode ser?"</div>
     <span class="go">↓ Escuta ativa (passo 2).</span></div>

   <div class="step" data-n="2"><h3>Escuta & Mapa de Necessidades (o coração da R0)</h3>
     <p class="mut" style="font-size:12.5px;margin:0 0 8px">Deixe ele falar. Mapeie <b>passado, presente e futuro</b> + objetivos, metas e propósito.</p>
     <div class="script">"Me conta sua história com dinheiro — como foi criado com isso?" · "Hoje, quanto entra e pra onde vai?" · "Tem dívidas? Reserva?" · "E daqui a 5, 10, 20 anos — o que você quer que seja verdade?" · "Por que isso é importante pra você?"</div>
     <span class="go">↓ Aprofunde a dor e o custo dela (passo 3).</span></div>

   <div class="step" data-n="3"><h3>Diagnóstico ao vivo (SPIN — ache o gatilho)</h3>
     <div class="script">"Isso hoje te custa o quê — em juros, em noites mal dormidas, em sonho adiado?" · "Se resolvesse, o que mudaria pra você e pra sua família?" · "Por que resolver isso <b>agora</b>, e não daqui a um ano?"</div>
     <p class="mut" style="font-size:12.5px;margin:6px 0 0">🎯 Ancore a dor certa: <b>a Armadilha da Expectativa</b> — mostre que 'dica de investimento' sem organização e comportamento não resolve. O que ele precisa é do <b>método</b>.</p>
     <span class="go">↓ Só agora mostre a solução (passo 4).</span></div>

   <div class="step" data-n="4"><h3>Apresentação por VALOR (conecte o Banco de Soluções à dor)</h3>
     ${[["Onde você está na jornada","“Hoje você está aqui: <b>[endividamento/organização]</b>. Meu trabalho é te levar pra <b>[organização/investimentos]</b> — nessa ordem, sem pular etapa.”"],
        ["O Dia a Dia (fluxo + dívidas)","“Vamos organizar seu fluxo, montar sua reserva e quitar dívida com estratégia (Avalanche/Bola de Neve). Você para de perder dinheiro pro juro.”"],
        ["A Multiplicação (investimentos)","“Com a casa em ordem, montamos sua Política de Investimentos e a carteira certa pro seu objetivo — sem achismo.”"],
        ["O Futuro + Proteção","“Calculamos seu número da independência e protegemos o caminho (seguros, tributário, sucessão) pra nada te tirar da rota.”"]].map(([h,p])=>`<div class="script"><b>${h}</b><br>${p}</div>`).join("")}
     <span class="go">↓ Ancore o plano (passo 5).</span></div>

   <div class="step" data-n="5"><h3>Ancoragem de preço (Wealth primeiro → Essencial)</h3>
     <div class="script">"[nome], temos dois caminhos de acompanhamento. O <b>Plano Bússola (Wealth) — R$ 697/mês</b> é o completo: organização + investimentos + aposentadoria + seguros + tributário + sucessório, com revisões trimestrais. E o <b>Plano Norte (Essencial) — R$ 297/mês</b>: organização, fluxo, reserva, quitação de dívidas e acompanhamento mensal. <b>Pra onde você quer ir: já no Bússola, ou começamos firme no Norte?</b>"</div>
     <p class="mut" style="font-size:12.5px;margin:6px 0 0">🔑 Sempre <b>Wealth primeiro</b> (âncora). Fale <b>valor → preço</b>. Divida por dia se ajudar ("R$ 297 ≈ R$ 10/dia pra colocar sua vida financeira nos trilhos").</p>

   <div class="step" data-n="6"><h3>Quebra de objeções (acolhe → reformula → devolve pergunta)</h3>

        ["“Vou começar mês que vem”","“Cada mês parado é dinheiro deixado na mesa (juros correndo, aporte não feito). Posso garantir sua vaga de planejamento agora? Elas são limitadas por mês.”"]
       ].map(([o,r])=>`<div class="script"><b>${o}</b><br>${r}</div>`).join("")}
     <span class="go">↓ Objeção tratada → feche (passo 7).</span></div>

function isFriday(){return new Date().getDay()===5;}
function pickQuestions(n){const bank=DB.getObj(T(),"quizBank",quizBank()).slice();
  for(let i=bank.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bank[i],bank[j]]=[bank[j],bank[i]];}
  return bank.slice(0,n);}

function startQuiz(){quizState={idx:0,answers:[],set:pickQuestions(isFriday()?10:4),sel:null};renderQuiz();}
function renderQuiz(){
  const q=quizState.set[quizState.idx],i=quizState.idx,n=quizState.set.length;const c=document.getElementById("quizCard");
  c.innerHTML=`<div class="flex between"><b>Pergunta ${i+1} de ${n}</b><span class="pill">${q.tag}</span></div>
   <div class="bar mt8" style="margin-bottom:16px"><i style="width:${i/n*100}%"></i></div>
   <h2 style="font-size:16px;margin:0 0 12px">${q.q}</h2>
   ${q.a.map((opt,j)=>`<div class="quiz-opt" data-j="${j}" onclick="pickQuiz(${j})">${String.fromCharCode(65+j)}. ${opt}</div>`).join("")}
   <div class="flex between mt"><small class="mut">Selecione uma alternativa</small><button class="btn sm" id="qNext" onclick="confirmQuiz()" disabled>Confirmar</button></div>`;
}
function pickQuiz(j){quizState.sel=j;document.querySelectorAll(".quiz-opt").forEach(e=>e.classList.toggle("sel",+e.dataset.j===j));document.getElementById("qNext").disabled=false;}
function confirmQuiz(){
  if(quizState.sel==null)return;const q=quizState.set[quizState.idx];
  document.querySelectorAll(".quiz-opt").forEach(e=>{const j=+e.dataset.j;if(j===q.c)e.classList.add("ok");else if(j===quizState.sel)e.classList.add("no");e.onclick=null;});
  quizState.answers.push(quizState.sel===q.c);
  document.getElementById("qNext").outerHTML=`<button class="btn sm" onclick="afterQuiz()">${quizState.idx+1<quizState.set.length?'Próxima →':'Ver resultado'}</button>`;
  quizState.sel=null;
}
function afterQuiz(){
  if(quizState.idx+1<quizState.set.length){quizState.idx++;renderQuiz();return;}
  const acertos=quizState.answers.filter(Boolean).length,total=quizState.set.length,pct=Math.round(acertos/total*100),ok=pct>=80;
  const tipo=isFriday()?"semanal":"diario";
  const hist=DB.getObj(T(),"quizHistory",{});(hist[SESSION.name]=hist[SESSION.name]||[]).unshift({data:new Date().toLocaleDateString("pt-BR"),pct,tipo});DB.set(T(),"quizHistory",hist);
  if(ok){const rec=DB.getObj(T(),"quizPass",{});rec[SESSION.name]=new Date().toDateString();DB.set(T(),"quizPass",rec);}
  else{DB.push(T(),"alerts",{id:DB.uid(),tipo:"treino",colaborador:SESSION.name,pct,ts:Date.now(),txt:`${SESSION.name} reprovou na prova ${tipo} (${pct}%) e precisa refazer o treinamento.`});updateBell();}
  document.getElementById("quizCard").innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:46px">${ok?'🎉':'😕'}</div>
    <h2 style="margin:8px 0">${acertos}/${total} — ${pct}%</h2>
    <p class="mut">${ok?'Aprovado! Acesso liberado por hoje.':'Você precisa de 80%. Estude o playbook e refaça — o gestor foi avisado.'}</p>
    <div class="flex" style="justify-content:center"><button class="btn ghost sm" onclick="go('scripts')">Estudar</button>
      ${ok?`<button class="btn sm" onclick="renderSidebar();go('painel')">Começar a operar →</button>`:`<button class="btn sm" onclick="vTreino()">Refazer prova</button>`}</div></div>`;
  renderSidebar();
}
function updateBell(){const n=DB.get(T(),"alerts").length;const dot=document.getElementById("bellDot");if(!dot)return;dot.textContent=n;dot.classList.toggle("hidden",n===0);}
function showAlerts(){const a=DB.get(T(),"alerts");
  openModal(`<h3>🔔 Alertas do gestor</h3>${a.length?a.map(x=>`<div class="script" style="border-left-color:var(--brand-warn)"><b>⚠️ Treinamento</b><br>${x.txt}<br><small class="mut">${relTime(x.ts)} atrás</small></div>`).join(""):'<p class="mut">Nenhum alerta. 🎉</p>'}

         .map(([d,c,t])=>`<div class="foco"><b style="min-width:48px;color:var(--brand-accent)">${d}</b><div style="flex:1"><b style="font-size:13px">${c}</b><p class="mut" style="font-size:12.5px;margin:3px 0 0">${t}</p></div></div>`).join("")}</div>
     <div>
       <div class="card"><h2 style="margin:0 0 8px;font-size:15px">Cupons</h2>
         ${coupons.map(c=>`<div class="flex between" style="margin:8px 0"><div><b>${c.codigo}</b><br><small class="mut">${c.tipo==='%'?c.valor+'% desc':c.tipo} · ${c.uso}x</small></div><span class="pill ${c.ativo?'ok':''}">${c.ativo?'ativo':'inativo'}</span></div>`).join("")}
         <button class="btn ghost sm mt" onclick="couponModal()">+ Novo cupom</button></div>
       <div class="card mt"><h2 style="margin:0 0 8px;font-size:15px">${lx('Clientes')} em risco</h2>
         ${[...inad,...churn].map(m=>`<div class="flex between" style="font-size:12.5px;margin:7px 0;cursor:pointer" onclick="memberEditModal('${m.id}')"><span>${m.nome} <small class="mut">(${m.empresa})</small></span><span class="pill ${m.status==='churn'?'bad':'warn'}">${m.status}</span></div>`).join("")||'<small class="mut">Ninguém em risco 🎉</small>'}</div>
     </div></div>`;
}
function couponModal(){openModal(`<h3>Novo cupom</h3><label class="fl mt">Código</label><input class="in" id="c_cod" placeholder="LIDER15">
  <div class="row mt"><div><label class="fl">Tipo</label><select class="in" id="c_tipo"><option value="%">% desconto</option><option value="mês grátis">mês grátis</option></select></div><div><label class="fl">Valor</label><input class="in" id="c_val" type="number" value="10"></div></div>
  <div class="flex mt" style="justify-content:flex-end"><button class="btn ghost sm" onclick="closeModal()">Cancelar</button><button class="btn sm" onclick="saveCoupon()">Criar</button></div>`);}
function saveCoupon(){const cod=c_cod.value.trim();if(!cod)return;DB.push(T(),"coupons",{id:DB.uid(),codigo:cod,tipo:c_tipo.value,valor:+c_val.value,uso:0,ativo:true});closeModal();toast("Cupom criado");vFidelidade();}
function vRecorrencia(){
  const members=DB.get(T(),"members");const ativos=members.filter(m=>m.status!=="churn");
  const mrr=ativos.reduce((s,m)=>s+(m.mrr||0),0),arr=mrr*12,churnRate=Math.round(members.filter(m=>m.status==="churn").length/members.length*100);
  M().innerHTML=`
   <div class="view-title"><h1>Recompra & Recorrência</h1></div>
   <p class="view-sub">MRR, ARR, renovações e movimento da base recorrente.</p>
   <div class="grid kpis">
     ${kpi("🔁","MRR",money(mrr),"recorrente/mês","up")}${kpi("📅","ARR",money(arr),"projeção 12m","up")}
     ${kpi("📉","Churn",churnRate+"%",churnRate<=5?"saudável":"atenção",churnRate<=5?"up":"down")}
     ${kpi("⬆️","Upgrade potencial",members.filter(m=>m.plano===basePlanId()&&m.status==="ativo").length,planShort(basePlanId())+"→"+planShort(topPlanId()),"up")}
   </div>
   <div class="card mt"><div class="flex between wrap"><h2 style="margin:0;font-size:15px">Base recorrente <small class="mut">· clique para ver/editar o ${lx('cliente')}</small></h2>
     <div class="flex"><input class="in" id="memSearch" placeholder="🔎 buscar ${lx('cliente')}…" style="width:200px" oninput="vRecRows()"><button class="btn sm" onclick="memberModal()">+ Novo ${lx('cliente')}</button></div></div>
     <div style="overflow:auto;margin-top:12px"><table><thead><tr><th>${lx('Cliente')}</th><th>Empresa/Perfil</th><th>Plano</th><th>MRR</th><th>Último pgto</th><th>NPS</th><th>Status</th><th>Ação</th></tr></thead><tbody id="recRows"></tbody></table></div></div>`;
  vRecRows();
}
const PLAN_SHORT={master:"Master",premium:"Premium",essencial:"Norte",wealth:"Bússola"};
function prodsT(){return DB.get(T(),"products");}
function planName(id){const p=prodsT().find(x=>x.id===id);return p?p.nome:id;}
function planShort(id){return PLAN_SHORT[id]||planName(id);}
function planMrr(id){const p=prodsT().find(x=>x.id===id);return p?p.recorrencia:0;}
function topPlanId(){const a=prodsT();return a[1]?a[1].id:"premium";}
function basePlanId(){const a=prodsT();return a[0]?a[0].id:"master";}
function vRecRows(){
  const q=(document.getElementById("memSearch")?.value||"").toLowerCase();
  let members=DB.get(T(),"members");
  if(q)members=members.filter(m=>(m.nome+m.empresa).toLowerCase().includes(q));
  document.getElementById("recRows").innerHTML=members.map(m=>{const dias=Math.floor((Date.now()-m.ultimoPgto)/864e5);
    return `<tr style="cursor:pointer" onclick="memberEditModal('${m.id}')"><td><b>${m.nome}</b></td><td>${m.empresa}</td>
      <td><span class="pill ${m.plano===topPlanId()?'':'pri'}" ${m.plano===topPlanId()?'style="background:color-mix(in srgb,var(--brand-accent) 25%,transparent);color:var(--brand-accent)"':''}>${planShort(m.plano)}</span></td>
      <td><b>${money(m.mrr)}</b></td><td class="mut">${dias}d atrás</td><td>${m.nps??'—'}</td>
      <td><span class="pill ${m.status==='ativo'?'ok':m.status==='inadimplente'?'warn':'bad'}">${m.status}</span></td>
      <td onclick="event.stopPropagation()">${m.plano===basePlanId()&&m.status==='ativo'?`<button class="btn xs gold" onclick="upgradeMember('${m.id}')">Upgrade</button> `:''}<button class="btn xs ghost" onclick="memberEditModal('${m.id}')">✎ editar</button></td></tr>`;}).join("")||`<tr><td colspan="8"><small class="mut">Nenhum ${lx('cliente')}.</small></td></tr>`;
}
function memberEditModal(id){
  const m=DB.get(T(),"members").find(x=>x.id===id);if(!m)return;
  const dias=Math.floor((Date.now()-m.ultimoPgto)/864e5);
  openModal(`<h3>${m.nome}</h3><small class="mut">${m.empresa} · ${lx('cliente')} desde ${new Date(m.desde).toLocaleDateString("pt-BR")}</small>
   <div class="row mt"><div><label class="fl">Nome</label><input class="in" id="me_nome" value="${m.nome}"></div><div><label class="fl">Empresa/Perfil</label><input class="in" id="me_emp" value="${m.empresa}"></div></div>
   <div class="row mt"><div><label class="fl">Plano</label><select class="in" id="me_plano">${prodsT().map(p=>`<option value="${p.id}" ${m.plano===p.id?'selected':''}>${planShort(p.id)} (${money(p.recorrencia)})</option>`).join("")}</select></div>
     <div><label class="fl">Status</label><select class="in" id="me_status">${["ativo","inadimplente","churn"].map(s=>`<option ${m.status===s?'selected':''}>${s}</option>`).join("")}</select></div></div>
   <div class="row mt"><div><label class="fl">MRR (R$)</label><input class="in" id="me_mrr" type="number" value="${m.mrr}"></div>
     <div><label class="fl">Cashback (R$)</label><input class="in" id="me_cash" type="number" value="${m.cashback||0}"></div>
     <div><label class="fl">NPS (0-10)</label><input class="in" id="me_nps" type="number" value="${m.nps??''}"></div></div>
   <div class="mt"><label class="fl">Último pagamento (dias atrás)</label><input class="in" id="me_dias" type="number" value="${dias}"></div>
   <div class="script mt" style="border-left-color:var(--brand-accent)"><b>Proximidade:</b> ${m.status==='ativo'?'Em dia. Agende o próximo ponto de valor.':m.status==='inadimplente'?'⚠️ Acionar régua de recuperação (Fidelidade).':'Churn — candidato a win-back.'}</div>
   <div class="flex between mt"><button class="btn ghost sm" onclick="delMember('${m.id}')">Excluir</button>
     <div class="flex"><button class="btn ghost sm" onclick="closeModal()">Cancelar</button><button class="btn sm" onclick="saveMemberEdit('${m.id}')">Salvar</button></div></div>`,true);
}
function saveMemberEdit(id){const g=x=>document.getElementById(x).value;
  DB.update(T(),"members",id,{nome:g("me_nome"),empresa:g("me_emp"),plano:g("me_plano"),status:g("me_status"),
    mrr:+g("me_mrr"),cashback:+g("me_cash"),nps:g("me_nps")===''?null:+g("me_nps"),ultimoPgto:Date.now()-(+g("me_dias"))*864e5});
  closeModal();toast(lx('Cliente')+" atualizado");vRecorrencia();}
function delMember(id){if(!confirm("Excluir este "+lx('cliente')+" da base?"))return;DB.remove(T(),"members",id);closeModal();toast(lx('Cliente')+" excluído");vRecorrencia();}
function upgradeMember(id){DB.update(T(),"members",id,{plano:topPlanId(),mrr:planMrr(topPlanId())});toast("Upgrade p/ "+planShort(topPlanId())+" 🎉");vRecorrencia();}
function memberModal(){openModal(`<h3>Novo ${lx('cliente')}</h3>
  <div class="row mt"><div><label class="fl">Nome</label><input class="in" id="m_nome"></div><div><label class="fl">Empresa/Perfil</label><input class="in" id="m_emp"></div></div>
  <div><label class="fl mt8">Plano</label><select class="in" id="m_plano">${prodsT().map(p=>`<option value="${p.id}">${planShort(p.id)} (${money(p.recorrencia)})</option>`).join("")}</select></div>
  <div class="flex mt" style="justify-content:flex-end"><button class="btn ghost sm" onclick="closeModal()">Cancelar</button><button class="btn sm" onclick="saveMember()">Adicionar</button></div>`);}
function saveMember(){const nome=m_nome.value.trim();if(!nome)return;const plano=m_plano.value;
  DB.push(T(),"members",{id:DB.uid(),nome,empresa:m_emp.value,plano,mrr:planMrr(plano),status:"ativo",desde:Date.now(),ultimoPgto:Date.now(),cashback:0,nps:null});closeModal();toast(lx('Cliente')+" adicionado");vRecorrencia();}

function globalSearch(q){
  if(!CURRENT_TENANT)return;q=q.trim().toLowerCase();if(!q)return;
  const leads=DB.get(T(),"leads").filter(l=>(l.nome+(l.fantasia||"")+(l.razaoSocial||"")+((l.contato||{}).email||"")+((l.contato||{}).tel||"")).toLowerCase().includes(q));
  const members=DB.get(T(),"members").filter(m=>(m.nome+m.empresa).toLowerCase().includes(q));
  const products=DB.get(T(),"products").filter(p=>p.nome.toLowerCase().includes(q));
  openModal(`<h3>Resultados para "${q}"</h3>
   ${sec("Leads / Clientes",leads.map(l=>`<div class="flex between" style="margin:6px 0;cursor:pointer" onclick="closeModal();go('crm');setTimeout(()=>leadDetail('${l.id}'),150)"><span><b>${l.nome}</b> <small class="mut">${l.fantasia||""}</small></span><span class="pill">${stageName(l.estagio)}</span></div>`))}
   ${sec(lx('Clientes'),members.map(m=>`<div class="flex between" style="margin:6px 0"><span><b>${m.nome}</b> <small class="mut">${m.empresa}</small></span><span class="pill">${planShort(m.plano)}</span></div>`))}
   ${sec("Produtos",products.map(p=>`<div class="flex between" style="margin:6px 0"><span><b>${p.nome}</b></span><span class="pill">${money(p.preco)}</span></div>`))}
   ${leads.length+members.length+products.length===0?'<p class="mut">Nada encontrado.</p>':''}`);
}
function sec(t,arr){return arr.length?`<div class="section-h"><h2>${t}</h2><div class="line"></div></div>${arr.join("")}`:"";}
function openModal(html,wide){document.getElementById("modalRoot").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal ${wide?'wide':''}"><button class="x" onclick="closeModal()">×</button>${html}</div></div>`;}
function closeModal(){document.getElementById("modalRoot").innerHTML="";}
let toastT;
function toast(msg,type){const t=document.getElementById("toast");t.textContent=msg;t.style.borderLeftColor=type==="bad"?"var(--brand-bad)":type==="warn"?"var(--brand-warn)":"var(--brand-ok)";t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600);}

initCloud();seed();seedB2();document.getElementById("loginFelipe").src=FELIPE_BIG;setLoginBrand("protocolo");startBgFx();rotatePhrases();
document.getElementById("lgPass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
document.getElementById("lgUser").addEventListener("input",e=>{const v=e.target.value.trim().toLowerCase();const acc=USERS[v];const b=acc&&acc.tenant&&acc.tenant!=="all"?acc.tenant:"protocolo";setLoginBrand(BRANDS[b]?b:"protocolo");});
/* Login único (SSO): se já entrou antes, restaura sozinho sem pedir senha de novo */
(function restoreSSO(){try{if(localStorage.getItem('pc_sso')==='1'){const u=localStorage.getItem('pc_sso_user');const acc=USERS[u];if(acc){document.getElementById('lgUser').value=u;document.getElementById('lgPass').value=acc.pass;doLogin();}}}catch(e){}})();
</script>
</body>
</html>
