<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Protocolo Comercial</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand-bg:#0C0C0C; --brand-panel:#1E1E1E; --brand-panel2:#161513;
  --brand-line:#39352f;
  --brand-primary:#FF6B2B; --brand-primary-2:#ff8a52; --brand-accent:#FF6B2B;
  --brand-text:#F0EDE8; --brand-muted:#8f897d; --brand-ok:#37c98a; --brand-warn:#f0a32a; --brand-bad:#f0596b;
  --radius:6px; --radius-sm:4px; --shadow:0 18px 50px rgba(0,0,0,.6);
  --font: "Segoe UI", Roboto, Arial, Helvetica, sans-serif;
  --mono: ui-monospace,SFMono-Regular,Menlo,"Cascadia Mono",Consolas,monospace;
}
[data-brand="lideres"]{
  --brand-bg:#0a1330; --brand-panel:#0f1c44; --brand-panel2:#0c1738;
  --brand-line:rgba(120,150,235,.16);
  --brand-primary:#354B9C; --brand-primary-2:#5470d6; --brand-accent:#e7b53c;
  --brand-text:#eef2ff; --brand-muted:#9fb0e0; --brand-ok:#3fcf8e; --brand-warn:#f0b429; --brand-bad:#ff5d73;
  --radius:14px; --radius-sm:10px;
}
[data-brand="b2if"]{
  --brand-bg:#002333; --brand-panel:#02384c; --brand-panel2:#022e3f;
  --brand-line:rgba(21,154,156,.20);
  --brand-primary:#159a9c; --brand-primary-2:#1fc8ca; --brand-accent:#1fc8ca;
  --brand-text:#eafcff; --brand-muted:#7fb2ba; --brand-ok:#37c98a; --brand-warn:#f0b429; --brand-bad:#ff6b81;
  --radius:8px; --radius-sm:5px;
  --font:"Kanit","Segoe UI",Roboto,Arial,Helvetica,sans-serif;
}
[data-brand="b2if"] .eyebrow{letter-spacing:3px}
[data-brand="b2if"] h1,[data-brand="b2if"] h2,[data-brand="b2if"] h3,[data-brand="b2if"] .name{font-weight:600;letter-spacing:.3px}
[data-brand="b2if"] .btn{font-weight:600;letter-spacing:.4px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--brand-primary)}
.eyebrow.mut{color:var(--brand-muted)}
.brk{position:relative}
.brk::before,.brk::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--brand-primary);opacity:.85;pointer-events:none;z-index:2}
.brk::before{top:9px;left:9px;border-right:0;border-bottom:0}
.brk::after{bottom:9px;right:9px;border-left:0;border-top:0}
.gridbg{background-image:linear-gradient(var(--brand-line) 1px,transparent 1px),linear-gradient(90deg,var(--brand-line) 1px,transparent 1px);background-size:44px 44px}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.anim{opacity:0;animation:fadeUp .6s cubic-bezier(.2,.7,.3,1) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.13s}.d3{animation-delay:.21s}.d4{animation-delay:.30s}.d5{animation-delay:.40s}.d6{animation-delay:.5s}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,107,43,.45)}50%{box-shadow:0 0 32px 5px rgba(255,107,43,.5)}}
.glow{animation:pulseGlow 2.4s infinite}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--brand-bg);color:var(--brand-text);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 600px at 82% -10%, color-mix(in srgb,var(--brand-primary) 20%, transparent), transparent 60%),
   radial-gradient(900px 500px at -5% 110%, color-mix(in srgb,var(--brand-primary-2) 12%, transparent), transparent 55%);}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:20px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}
#bgfx{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
#watermark{position:fixed;inset:0;z-index:0;pointer-events:none;display:none;opacity:.22;background-repeat:no-repeat;background-position:center 48%;background-size:min(86vh,82vw)}
[data-brand="lideres"] .card{background:linear-gradient(180deg,rgba(15,28,68,.86),rgba(12,23,56,.86))}
[data-brand="lideres"] .kcol{background:rgba(15,28,68,.55)}
[data-brand="lideres"] .sidebar{background:rgba(12,20,52,.55)}
[data-brand="lideres"] .topbar{background:rgba(12,20,52,.72)}
[data-brand="b2if"] .card{background:linear-gradient(180deg,color-mix(in srgb,var(--brand-panel) 86%,transparent),color-mix(in srgb,var(--brand-panel2) 86%,transparent))}
[data-brand="b2if"] .kcol{background:color-mix(in srgb,var(--brand-panel) 55%,transparent)}
[data-brand="b2if"] .sidebar{background:color-mix(in srgb,var(--brand-panel2) 55%,transparent)}
[data-brand="b2if"] .topbar{background:color-mix(in srgb,var(--brand-panel2) 72%,transparent)}
#login{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
#lgPhrase{position:absolute;z-index:3;pointer-events:none;max-width:300px;font-size:21px;font-weight:800;line-height:1.3;
  color:var(--brand-primary);opacity:0;transition:opacity .6s ease;text-shadow:0 2px 18px rgba(0,0,0,.9);letter-spacing:.2px}
@media(max-width:1000px){#lgPhrase{display:none}}
.login-photo .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 18px;background:linear-gradient(0deg,rgba(10,10,10,.95),transparent)}
.login-wrap{display:flex;width:min(860px,95vw);border:1px solid var(--brand-line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);background:var(--brand-panel)}
.login-photo{position:relative;width:44%;min-width:280px;background:#000}
.login-photo img{width:100%;height:100%;object-fit:cover;object-position:center 12%;display:block;filter:grayscale(.08) contrast(1.05)}
.login-photo .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 18px;background:linear-gradient(0deg,rgba(10,10,10,.95),transparent)}
.login-panel{flex:1;min-width:300px;background:linear-gradient(180deg,var(--brand-panel),var(--brand-panel2));padding:36px 34px;position:relative;overflow:hidden}
.login-panel::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,transparent 0 38px, color-mix(in srgb,var(--brand-primary) 6%,transparent) 38px 39px);opacity:.4;pointer-events:none}
@media(max-width:700px){.login-photo{display:none}}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:22px;position:relative;z-index:1}
.login-logo .name{font-weight:800;letter-spacing:.5px;font-size:20px;text-align:center}
.login-logo .sub{font-size:11px;letter-spacing:2.5px;color:var(--brand-muted);text-transform:uppercase;text-align:center;font-family:var(--mono)}
.field{margin-bottom:14px;position:relative;z-index:1}
.field label{display:block;font-size:12px;color:var(--brand-muted);margin-bottom:6px;letter-spacing:.3px}
.field input{width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--brand-line);background:rgba(0,0,0,.25);color:var(--brand-text);font-size:14px;outline:none}
.field input:focus{border-color:var(--brand-primary-2)}
.btn{border:none;border-radius:11px;padding:12px 16px;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--brand-primary),var(--brand-primary-2));transition:.15s;letter-spacing:.3px}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--brand-line);color:var(--brand-text)}
.btn.gold{background:linear-gradient(135deg,var(--brand-accent),#f4cf6b);color:#20160a}
.btn.ok{background:linear-gradient(135deg,var(--brand-ok),#54e0a3);color:#06301f}
.btn.bad{background:linear-gradient(135deg,var(--brand-bad),#ff8090);color:#3a0710}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:9px}
.btn.xs{padding:5px 9px;font-size:11.5px;border-radius:8px}
.hint{margin-top:16px;font-size:11.5px;color:var(--brand-muted);text-align:center;line-height:1.7;position:relative;z-index:1}
.hint code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px;color:var(--brand-text)}
#app{position:absolute;inset:0;z-index:1;display:grid;grid-template-columns:250px 1fr;grid-template-rows:60px 1fr}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--brand-line);background:color-mix(in srgb,var(--brand-panel) 75%, transparent);backdrop-filter:blur(10px);z-index:5}
.topbar .brandmark{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.4px}
.topbar .spacer{flex:1}
.crumbs{font-size:12.5px;color:var(--brand-muted)}
.crumbs b{color:var(--brand-text)}
.searchbox{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border:1px solid var(--brand-line);border-radius:11px;padding:7px 12px;width:min(340px,30vw)}
.searchbox input{background:transparent;border:none;outline:none;color:var(--brand-text);width:100%;font-size:13px}
.iconbtn{position:relative;background:rgba(0,0,0,.25);border:1px solid var(--brand-line);border-radius:10px;width:38px;height:38px;font-size:16px}
.iconbtn .dot{position:absolute;top:-4px;right:-4px;background:var(--brand-bad);color:#fff;font-size:10px;font-weight:800;border-radius:20px;padding:0 5px;min-width:16px}
.userchip{display:flex;align-items:center;gap:9px;background:rgba(0,0,0,.25);border:1px solid var(--brand-line);border-radius:30px;padding:5px 6px 5px 12px;font-size:12.5px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;background:linear-gradient(135deg,var(--brand-primary),var(--brand-primary-2))}
.sidebar{border-right:1px solid var(--brand-line);background:color-mix(in srgb,var(--brand-panel) 55%, transparent);padding:14px 10px;overflow:auto}
.sb-group{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--brand-muted);margin:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--brand-muted);font-size:13.5px;font-weight:600;margin:2px 0;transition:.12s;user-select:none;cursor:pointer}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--brand-text)}
.nav-item.active{background:linear-gradient(135deg,color-mix(in srgb,var(--brand-primary) 40%,transparent),color-mix(in srgb,var(--brand-primary-2) 22%,transparent));color:#fff}
.nav-item .ic{width:20px;text-align:center;font-size:15px}
.nav-item .badge{margin-left:auto;background:var(--brand-accent);color:#241a06;font-size:10.5px;font-weight:800;border-radius:20px;padding:1px 7px}
.main{overflow:auto;padding:22px 26px 60px;position:relative}
.view-title{display:flex;align-items:center;gap:12px;margin:0 0 4px;flex-wrap:wrap}
.view-title h1{font-size:22px;margin:0;letter-spacing:.2px}
.view-sub{color:var(--brand-muted);font-size:13px;margin:0 0 20px}
.card{background:linear-gradient(180deg,var(--brand-panel),var(--brand-panel2));border:1px solid var(--brand-line);border-radius:var(--radius);padding:18px;box-shadow:0 8px 26px rgba(0,0,0,.22)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpi .lab{font-size:12px;color:var(--brand-muted);display:flex;align-items:center;gap:7px}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:.3px}
.kpi .delta{font-size:11.5px;margin-top:4px}
.up{color:var(--brand-ok)} .down{color:var(--brand-bad)}
.section-h{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.section-h h2{font-size:16px;margin:0}
.section-h .line{flex:1;height:1px;background:var(--brand-line)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.07);color:var(--brand-muted)}
.pill.ok{background:color-mix(in srgb,var(--brand-ok) 20%,transparent);color:var(--brand-ok)}
.pill.warn{background:color-mix(in srgb,var(--brand-warn) 22%,transparent);color:var(--brand-warn)}
.pill.bad{background:color-mix(in srgb,var(--brand-bad) 20%,transparent);color:var(--brand-bad)}
.pill.pri{background:color-mix(in srgb,var(--brand-primary) 28%,transparent);color:#ffd9c4}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--brand-muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;padding:10px 12px;border-bottom:1px solid var(--brand-line)}
td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.05)}
tr:hover td{background:rgba(255,255,255,.03)}
input.in,select.in,textarea.in{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--brand-line);background:rgba(0,0,0,.25);color:var(--brand-text);font-size:13.5px;outline:none}
input.in::placeholder,textarea.in::placeholder{color:var(--brand-muted)}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--brand-primary-2)}
select.in option{background:var(--brand-panel);color:var(--brand-text)}
label.fl{font-size:12px;color:var(--brand-muted);display:block;margin:0 0 5px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
.flex{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.mt{margin-top:16px}.mt8{margin-top:8px}
small.mut{color:var(--brand-muted)}
.chip{font-size:11.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--brand-line);background:rgba(255,255,255,.04);cursor:pointer;color:var(--brand-text)}
.chip.on{background:var(--brand-primary);border-color:var(--brand-primary);color:#fff}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;display:inline-block}
.bar{height:8px;border-radius:20px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--brand-primary),var(--brand-primary-2))}
.bar.gold>i{background:linear-gradient(90deg,var(--brand-accent),#f4cf6b)}
.ring{--p:0;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--brand-primary) calc(var(--p)*1%), rgba(255,255,255,.08) 0)}
.ring i{width:74px;height:74px;border-radius:50%;background:var(--brand-panel);display:grid;place-items:center;font-weight:800;font-size:19px;font-style:normal}
.temp{width:8px;height:8px;border-radius:50%;display:inline-block}
.temp.q{background:var(--brand-bad)} .temp.m{background:var(--brand-warn)} .temp.f{background:#5aa0ff}
.card-hover{transition:.18s}.card-hover:hover{transform:translateY(-4px);border-color:var(--brand-primary)}
.funsel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px}
.kcol{min-width:250px;width:250px;background:color-mix(in srgb,var(--brand-panel) 60%,transparent);border:1px solid var(--brand-line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 250px)}
.kcol h4{margin:0;padding:12px 13px;font-size:12.5px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--brand-line)}
.kcol h4 .cnt{margin-left:auto;font-size:11px;color:var(--brand-muted)}
.kcol .drop{padding:9px;display:flex;flex-direction:column;gap:9px;overflow:auto;flex:1;min-height:60px}
.kcard{background:linear-gradient(180deg,var(--brand-panel),var(--brand-panel2));border:1px solid var(--brand-line);border-radius:10px;padding:11px 12px;cursor:grab;font-size:13px;position:relative}
.kcard:active{cursor:grabbing}
.kcard.drag{opacity:.4}
.kcard .nm{font-weight:700}
.kcard .co{color:var(--brand-muted);font-size:11.5px;margin-top:2px}
.kcard .ft{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.kcard .val{margin-left:auto;font-weight:800;font-size:12px;color:var(--brand-accent)}
.kcol.over{outline:2px dashed var(--brand-primary-2);outline-offset:-4px}
.kcard.late{border-color:var(--brand-bad);animation:blinkRed 1.1s infinite}
.kcard.noact{border-color:var(--brand-warn);animation:blinkYellow 1.4s infinite}
.kcard.today{border-color:var(--brand-ok)}
.kcard.future{border-color:#5f6b8f}
@keyframes blinkRed{0%,100%{box-shadow:0 0 0 0 rgba(255,93,115,0)}50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-bad) 55%,transparent)}}
@keyframes blinkYellow{0%,100%{box-shadow:0 0 0 0 rgba(240,180,41,0)}50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-warn) 55%,transparent)}}
.actdot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%}
.actdot.late{background:var(--brand-bad)} .actdot.today{background:var(--brand-ok)} .actdot.future{background:#7f93c9} .actdot.none{background:var(--brand-warn)}
.ld-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ld-stages{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.ld-stage{white-space:nowrap;padding:9px 14px;border-radius:9px;font-size:12px;font-weight:700;background:rgba(255,255,255,.05);border:1px solid var(--brand-line);color:var(--brand-muted);cursor:pointer}
.ld-stage.done{background:color-mix(in srgb,var(--brand-primary) 25%,transparent);color:#ffe4d3}
.ld-stage.cur{background:linear-gradient(135deg,var(--brand-primary),var(--brand-primary-2));color:#fff;border-color:transparent}
.ld-grid{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.atypes{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.atype{width:38px;height:34px;border-radius:9px;border:1px solid var(--brand-line);background:rgba(0,0,0,.2);display:grid;place-items:center;font-size:15px;cursor:pointer}
.atype.on{background:var(--brand-primary);border-color:var(--brand-primary)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--brand-line);margin-bottom:14px}
.tab{padding:9px 14px;font-size:13px;font-weight:700;color:var(--brand-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--brand-text);border-bottom-color:var(--brand-primary-2)}
.tl-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.tl-item .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;background:rgba(255,255,255,.06);flex-shrink:0}
.foco{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.fdot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.fdot.today{background:var(--brand-ok)} .fdot.future{background:#7f93c9} .fdot.late{background:var(--brand-bad)} .fdot.none{background:var(--brand-warn)}
.cad-day-hd{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.cad-day-hd .d{font-size:15px;font-weight:800;color:var(--brand-accent);background:color-mix(in srgb,var(--brand-accent) 15%,transparent);padding:3px 12px;border-radius:20px}
.touch{display:flex;gap:12px;padding:11px 12px;border:1px solid var(--brand-line);border-radius:10px;margin:7px 0;background:rgba(0,0,0,.15)}
.touch .h{min-width:64px;font-weight:800;font-size:13px;color:var(--brand-primary-2)}
.chan{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.chan.wa{background:#1f6b45;color:#c6ffdf} .chan.call{background:#2a3f8f;color:#cdd8ff}
.chan.email{background:#5a2f8f;color:#e6d3ff} .chan.insta{background:#8f2f6b;color:#ffd3ec} .chan.visita{background:#7a5a1e;color:#ffe6ad} .chan.msg{background:#25506b;color:#c5e8ff}
.script{background:rgba(0,0,0,.22);border:1px solid var(--brand-line);border-left:3px solid var(--brand-primary-2);border-radius:10px;padding:14px 16px;margin:10px 0;font-size:13.5px;line-height:1.65}
.script b{color:var(--brand-accent)}
.spin{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.spin .card{border-top:3px solid var(--brand-primary-2)}
.persona{border-left:3px solid var(--brand-accent)}
.rot .step{position:relative;padding:2px 0 6px 44px;margin:0 0 6px}
.rot .step::before{content:attr(data-n);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--brand-primary);color:#fff;font-weight:800;display:grid;place-items:center;font-size:12.5px}
.rot .step::after{content:"";position:absolute;left:14px;top:34px;bottom:-6px;width:2px;background:var(--brand-line)}
.rot .step:last-child::after{display:none}
.rot .step h3{margin:3px 0 8px;font-size:15px}
.rot .step .go{color:var(--brand-primary);font-family:var(--mono);font-size:11px;letter-spacing:.8px;margin-top:6px;display:block}
.dor{display:flex;gap:12px;align-items:flex-start}
.quiz-opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--brand-line);border-radius:11px;margin:8px 0;cursor:pointer;font-size:13.5px;transition:.12s}
.quiz-opt:hover{background:rgba(255,255,255,.04)}
.quiz-opt.sel{border-color:var(--brand-primary-2);background:color-mix(in srgb,var(--brand-primary) 16%,transparent)}
.quiz-opt.ok{border-color:var(--brand-ok);background:color-mix(in srgb,var(--brand-ok) 15%,transparent)}
.quiz-opt.no{border-color:var(--brand-bad);background:color-mix(in srgb,var(--brand-bad) 15%,transparent)}
.lock-screen{display:grid;place-items:center;min-height:60vh;text-align:center}
.stat-big{font-size:34px;font-weight:800;letter-spacing:-1px;color:var(--brand-primary);font-variant-numeric:tabular-nums}
.modal-bg{position:fixed;inset:0;background:rgba(4,8,20,.72);backdrop-filter:blur(4px);z-index:40;display:grid;place-items:center;padding:20px}
.modal{width:min(560px,96vw);max-height:90vh;overflow:auto;background:linear-gradient(180deg,var(--brand-panel),var(--brand-panel2));border:1px solid var(--brand-line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.modal.wide{width:min(760px,96vw)}
.modal h3{margin:0 0 4px}
.modal .x{float:right;background:transparent;border:none;color:var(--brand-muted);font-size:20px;cursor:pointer}
.co-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.co-card{cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.co-card:hover{transform:translateY(-3px);border-color:var(--brand-primary-2)}
.co-card .logo{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;margin-bottom:12px}
.co-card .st{display:flex;gap:14px;margin-top:14px;font-size:11.5px;color:var(--brand-muted)}
.co-card .st b{display:block;color:var(--brand-text);font-size:16px}
.locked{opacity:.5;filter:grayscale(.4)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:60;background:var(--brand-panel);border:1px solid var(--brand-line);border-left:4px solid var(--brand-ok);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);font-size:13.5px;opacity:0;transition:.25s}
.toast.show{opacity:1;bottom:34px}
@media(max-width:900px){#app{grid-template-columns:1fr}.sidebar{display:none}.searchbox{display:none}.ld-grid{grid-template-columns:1fr}}

/* ===== APRESENTAÇÃO (deck) ===== */
#deck{position:fixed;inset:0;z-index:9999;background:#0a0f22;display:none;flex-direction:column;font-family:var(--font)}
#deck *{box-sizing:border-box}
.dk-top{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.08)}
.dk-prog{height:100%;background:linear-gradient(90deg,var(--brand-accent),#8aa0e8);transition:width .25s}
.dk-bar-top{display:flex;align-items:center;gap:8px;padding:12px 20px 8px;flex-wrap:wrap}
.dk-chip{font-size:11.5px;font-family:var(--mono);color:#93a3c9;background:rgba(255,255,255,.06);padding:5px 10px;border-radius:20px}
.dk-chip.dk-time{color:#e7b53c}.dk-chip.dk-run{color:#3fcf8e}
.dk-btn{font-size:11.5px;color:#93a3c9;background:rgba(255,255,255,.06);border:0;padding:6px 11px;border-radius:20px;cursor:pointer;font-family:inherit}
.dk-btn:hover{background:rgba(255,255,255,.13);color:#fff}.dk-btn b{opacity:.5;font-weight:600}
.dk-btn.dk-x:hover{background:#ff5d73;color:#fff}
.dk-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 48px;overflow-y:auto}
.dk-slide{width:100%;max-width:1180px;color:#eaf0ff}
.dk-notes{background:#141b35;border-top:2px solid var(--brand-accent);padding:13px 24px;font-size:14px;line-height:1.6;color:#c3cfeb}
.dk-notes b{color:var(--brand-accent)}
.dk-nav{display:flex;align-items:center;justify-content:center;gap:20px;padding:10px 0 16px}
.dk-arrow{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#fff;font-size:20px;cursor:pointer}
.dk-arrow:hover:not(:disabled){background:var(--brand-accent);color:#0a0f22}
.dk-arrow:disabled{opacity:.2;cursor:default}
.dk-mut{color:#7d8bb0;font-size:12px}
/* tipografia dos slides */
.dk-h1{font-size:clamp(30px,4.4vw,56px);line-height:1.12;margin:0 0 16px;font-weight:800;letter-spacing:-.5px}
.dk-h2{font-size:clamp(22px,2.8vw,36px);margin:0 0 18px;font-weight:800;letter-spacing:-.3px}
.dk-lead{font-size:clamp(16px,1.7vw,22px);color:#b9c6e6;margin:0 0 18px;line-height:1.5}
.dk-sub{font-size:15.5px;color:#93a3c9;margin:0 0 18px;line-height:1.6}
.dk-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--brand-accent);margin-bottom:14px}
.dk-hero,.dk-ask,.dk-dyn{text-align:center;padding:20px 0}
.dk-dyn{text-align:left}.dk-dyn .dk-h1{text-align:center}.dk-dyn .dk-lead{text-align:center}
.dk-badges{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.dk-badges span{background:rgba(255,255,255,.07);padding:8px 16px;border-radius:24px;font-size:13.5px;color:#c3cfeb}
.dk-punch{background:linear-gradient(90deg,rgba(231,181,60,.14),rgba(231,181,60,.03));border-left:4px solid var(--brand-accent);padding:15px 20px;border-radius:8px;font-size:clamp(15px,1.6vw,19px);line-height:1.55;margin-top:20px}
.dk-alert{background:rgba(255,93,115,.11);border-left:4px solid #ff5d73;padding:13px 18px;border-radius:8px;margin-top:16px;font-size:14.5px;line-height:1.55}
.dk-alert b{color:#ff8a9b}
.dk-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0}
.dk-two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}
.dk-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}
.dk-grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 20px;margin:18px 0}
.dk-card{background:rgba(255,255,255,.055);border-radius:12px;padding:18px;border:1px solid rgba(255,255,255,.07)}
.dk-card>b{font-size:16px;display:block;margin-bottom:6px}
.dk-card p{font-size:14px;color:#b9c6e6;margin:0;line-height:1.5}
.dk-card.dk-warn{background:rgba(255,93,115,.08);border-color:rgba(255,93,115,.2)}
.dk-card.dk-ok{background:rgba(63,207,142,.09);border-color:rgba(63,207,142,.22)}
.dk-ic{font-size:26px;margin-bottom:8px}
.dk-tag{display:inline-block;margin-top:9px;font-size:12px;color:var(--brand-accent);background:rgba(231,181,60,.12);padding:4px 10px;border-radius:14px}
.dk-good,.dk-bad{border-radius:12px;padding:18px}
.dk-good{background:rgba(63,207,142,.1);border:1px solid rgba(63,207,142,.25)}
.dk-bad{background:rgba(255,93,115,.09);border:1px solid rgba(255,93,115,.22)}
.dk-good>b,.dk-bad>b{font-size:16px;display:block;margin-bottom:8px}
.dk-good ul,.dk-bad ul{margin:0;padding-left:18px;font-size:14px;color:#b9c6e6;line-height:1.75}
.dk-good p,.dk-bad p{font-size:14.5px;color:#c3cfeb;margin:0;line-height:1.6}
.dk-good span,.dk-bad span{display:block;margin-top:9px;font-size:12.5px;color:#93a3c9;font-style:italic}
.dk-grid6>div>b{font-size:15px;display:block;margin-bottom:4px}
.dk-grid6 div p,.dk-grid4 div p{font-size:13.5px;color:#b9c6e6;margin:0;line-height:1.5}
.dk-grid4>div>b{font-size:15px;display:block;margin-bottom:5px}
.dk-list{font-size:clamp(14.5px,1.5vw,17px);line-height:1.85;padding-left:24px;margin:16px 0}
.dk-list li{margin-bottom:9px}
.dk-list b{color:#fff}.dk-list u{text-decoration-color:var(--brand-accent)}
.dk-timeline{display:flex;flex-direction:column;gap:0;margin-top:16px}
.dk-timeline>div{display:flex;gap:16px;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.dk-timeline span{font-family:var(--mono);font-size:13px;color:var(--brand-accent);min-width:56px}
.dk-timeline>div>b{font-size:16px;min-width:230px}
.dk-timeline p{font-size:14px;color:#93a3c9;margin:0}
.dk-cycle{display:flex;align-items:center;justify-content:center;gap:10px;margin:26px 0;flex-wrap:wrap}
.dk-step{background:rgba(255,255,255,.06);border-radius:12px;padding:16px 20px;text-align:center;min-width:150px}
.dk-step.dk-hl{background:rgba(231,181,60,.16);border:1px solid rgba(231,181,60,.4)}
.dk-step span{display:block;font-family:var(--mono);font-size:12px;color:var(--brand-accent)}
.dk-step>b{display:block;font-size:17px;margin:4px 0 2px}
.dk-step p{font-size:13px;color:#93a3c9;margin:0}
.dk-arrow-i,.dk-cycle .dk-arrow{background:none;width:auto;height:auto}
.dk-cycle .dk-arrow{font-size:22px;color:#5b6a92}
.dk-spin{display:flex;gap:14px;justify-content:center;margin:24px 0}
.dk-spin span{width:74px;height:74px;border-radius:16px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:var(--brand-accent)}
.dk-letter{width:76px;height:76px;border-radius:18px;background:rgba(231,181,60,.15);color:var(--brand-accent);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;margin-bottom:14px}
.dk-letter.dk-hot{background:rgba(255,93,115,.18);color:#ff8a9b}
.dk-say{background:rgba(255,255,255,.055);border-radius:12px;padding:18px 22px;margin:14px 0}
.dk-say b{font-size:13px;color:var(--brand-accent);display:block;margin-bottom:8px;font-family:var(--mono);letter-spacing:1px}
.dk-say p{font-size:clamp(15px,1.6vw,19px);line-height:1.85;margin:0;color:#eaf0ff}
.dk-pdmaf{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}
.dk-pdmaf div{background:rgba(255,255,255,.06);border-radius:12px;padding:16px;text-align:center}
.dk-pdmaf span{display:block;font-size:30px;font-weight:800;color:var(--brand-accent)}
.dk-pdmaf>div>b{display:block;font-size:15px;margin:5px 0 3px}
.dk-pdmaf p{font-size:12.5px;color:#93a3c9;margin:0;line-height:1.45}
.dk-bar{display:flex;height:52px;border-radius:10px;overflow:hidden;margin:18px 0;font-size:15px;font-weight:700}
.dk-bar-a{flex:7;background:rgba(63,207,142,.28);display:flex;align-items:center;justify-content:center}
.dk-bar-b{flex:3;background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center}
.dk-quote{background:rgba(255,255,255,.06);border-left:4px solid var(--brand-accent);padding:18px 22px;border-radius:8px;font-size:clamp(16px,1.8vw,21px);line-height:1.6;margin:18px 0;text-align:center;font-style:italic}
.dk-dialog{display:flex;flex-direction:column;gap:11px;margin:18px 0}
.dk-cli{background:rgba(255,93,115,.11);padding:14px 18px;border-radius:12px 12px 12px 3px;font-size:16px;max-width:76%}
.dk-you{background:rgba(63,207,142,.11);padding:14px 18px;border-radius:12px 12px 3px 12px;font-size:15.5px;max-width:82%;align-self:flex-end;line-height:1.55}
.dk-you>span:first-child{background:var(--brand-accent);color:#0a0f22;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-right:10px;vertical-align:-6px}
.dk-check{display:grid;grid-template-columns:1fr 1fr;gap:9px 26px;font-size:15px;margin:18px 0;line-height:1.6}
.dk-nums{display:flex;gap:20px;justify-content:center;margin:26px 0;flex-wrap:wrap}
.dk-nums div{text-align:center;background:rgba(255,255,255,.06);border-radius:14px;padding:22px 34px}
.dk-nums>div>b{display:block;font-size:44px;color:var(--brand-accent);line-height:1}
.dk-nums span{font-size:13.5px;color:#93a3c9}
@media(max-width:900px){.dk-cols,.dk-grid4,.dk-grid6,.dk-pdmaf,.dk-two,.dk-check{grid-template-columns:1fr}.dk-stage{padding:10px 18px}}


/* ===== TEMAS DE COR POR SLIDE ===== */
#deck{transition:background .55s ease}
#deck[data-tema="escuro"]{background:radial-gradient(1200px 700px at 15% -10%,#16224a,#080d1c 60%)}
#deck[data-tema="azul"]{background:radial-gradient(1100px 800px at 80% 0%,#1d3a7a,#0d1b3d 62%)}
#deck[data-tema="claro"]{background:linear-gradient(160deg,#f4f7ff,#e2e9fb)}
#deck[data-tema="destaque"]{background:radial-gradient(1000px 700px at 50% -10%,#3a2f5e,#140f28 62%)}
#deck[data-tema="acao"]{background:linear-gradient(140deg,#0f2f3d,#0a1a2e 70%)}
/* tema claro: inverte as cores do conteúdo */
#deck[data-tema="claro"] .dk-slide{color:#0e1730}
#deck[data-tema="claro"] .dk-lead,#deck[data-tema="claro"] .dk-sub{color:#3d4c73}
#deck[data-tema="claro"] .dk-card,#deck[data-tema="claro"] .dk-say,#deck[data-tema="claro"] .dk-step,
#deck[data-tema="claro"] .dk-quote,#deck[data-tema="claro"] .dk-nums>div,#deck[data-tema="claro"] .dk-pdmaf>div{background:#fff;border-color:#d5deef;box-shadow:0 6px 20px rgba(20,35,80,.07)}
#deck[data-tema="claro"] .dk-card p,#deck[data-tema="claro"] .dk-grid4 div p,#deck[data-tema="claro"] .dk-grid6 div p,
#deck[data-tema="claro"] .dk-step p,#deck[data-tema="claro"] .dk-pdmaf p,#deck[data-tema="claro"] .dk-timeline p{color:#4a5878}
#deck[data-tema="claro"] .dk-say p,#deck[data-tema="claro"] .dk-list{color:#16233f}
#deck[data-tema="claro"] .dk-bar-top .dk-chip{background:rgba(20,35,80,.07);color:#4a5878}
#deck[data-tema="claro"] .dk-btn{background:rgba(20,35,80,.07);color:#4a5878}
#deck[data-tema="claro"] .dk-mut{color:#7a88a8}
#deck[data-tema="claro"] .dk-arrow{background:rgba(20,35,80,.09);color:#0e1730}
#deck[data-tema="claro"] .dk-check{color:#16233f}
#deck[data-tema="claro"] .dk-eyebrow{color:#b8860b}
#deck[data-tema="claro"] .dk-punch{background:linear-gradient(90deg,rgba(184,134,11,.13),transparent);border-left-color:#b8860b}
/* ===== ANIMAÇÃO DE ENTRADA ===== */
@keyframes dkUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes dkFade{from{opacity:0}to{opacity:1}}
@keyframes dkPop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
.dk-slide>*{animation:dkUp .5s cubic-bezier(.2,.7,.3,1) both}
.dk-slide>*:nth-child(2){animation-delay:.08s}
.dk-slide>*:nth-child(3){animation-delay:.16s}
.dk-slide>*:nth-child(4){animation-delay:.24s}
.dk-cols>*,.dk-grid4>*,.dk-grid6>*,.dk-two>*,.dk-pdmaf>*,.dk-step,.dk-nums>div,.dk-spin span{animation:dkPop .45s cubic-bezier(.2,.7,.3,1) both}
.dk-cols>*:nth-child(2),.dk-grid4>*:nth-child(2),.dk-two>*:nth-child(2),.dk-pdmaf>*:nth-child(2){animation-delay:.12s}
.dk-cols>*:nth-child(3),.dk-grid4>*:nth-child(3),.dk-pdmaf>*:nth-child(3){animation-delay:.22s}
.dk-grid4>*:nth-child(4),.dk-pdmaf>*:nth-child(4){animation-delay:.32s}
.dk-pdmaf>*:nth-child(5){animation-delay:.42s}
.dk-list li{animation:dkUp .45s both}
.dk-list li:nth-child(2){animation-delay:.1s}.dk-list li:nth-child(3){animation-delay:.2s}
.dk-list li:nth-child(4){animation-delay:.3s}.dk-list li:nth-child(5){animation-delay:.4s}
.dk-dialog>*{animation:dkUp .5s both}
.dk-dialog>*:nth-child(2){animation-delay:.5s}.dk-dialog>*:nth-child(3){animation-delay:1s}
.dk-dialog>*:nth-child(4){animation-delay:1.5s}.dk-dialog>*:nth-child(5){animation-delay:2s}
/* ===== ILUSTRAÇÕES ANIMADAS ===== */
.dk-art{display:flex;justify-content:center;margin:6px 0 14px}
.dk-art svg{max-width:100%;height:auto}
@keyframes ring{0%,100%{transform:rotate(0)}8%{transform:rotate(-14deg)}16%{transform:rotate(14deg)}24%{transform:rotate(-9deg)}32%{transform:rotate(9deg)}40%{transform:rotate(0)}}
.art-ring{animation:ring 2.2s ease-in-out infinite;transform-origin:50% 30%}
@keyframes wave{0%,100%{height:12px}50%{height:44px}}
.art-w{animation:wave 1.05s ease-in-out infinite}
.art-w:nth-child(2){animation-delay:.13s}.art-w:nth-child(3){animation-delay:.26s}
.art-w:nth-child(4){animation-delay:.39s}.art-w:nth-child(5){animation-delay:.52s}
.art-w:nth-child(6){animation-delay:.65s}.art-w:nth-child(7){animation-delay:.78s}
@keyframes drop{0%{transform:translateY(-14px);opacity:0}20%{opacity:1}100%{transform:translateY(96px);opacity:0}}
.art-d{animation:drop 2.4s linear infinite}
.art-d:nth-child(2){animation-delay:.8s}.art-d:nth-child(3){animation-delay:1.6s}
@keyframes grow{from{transform:scaleY(.12)}to{transform:scaleY(1)}}
.art-bar{transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.3,1) both}
.art-bar:nth-child(2){animation-delay:.15s}.art-bar:nth-child(3){animation-delay:.3s}
.art-bar:nth-child(4){animation-delay:.45s}.art-bar:nth-child(5){animation-delay:.6s}
@keyframes spin360{to{transform:rotate(360deg)}}
.art-spin{animation:spin360 14s linear infinite;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.25;r:26}50%{opacity:.05;r:40}}
.art-pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:0}}
.art-path{stroke-dasharray:300;stroke-dashoffset:300;animation:dash 1.6s ease-out both}

.dk-disp{display:flex;flex-direction:column;gap:9px;margin:14px 0}
.dk-disp>div{display:grid;grid-template-columns:.9fr 1.5fr auto;gap:14px;align-items:center;background:rgba(255,255,255,.05);border-radius:10px;padding:11px 15px;animation:dkUp .4s both}
.dk-disp>div:nth-child(2){animation-delay:.06s}.dk-disp>div:nth-child(3){animation-delay:.12s}
.dk-disp>div:nth-child(4){animation-delay:.18s}.dk-disp>div:nth-child(5){animation-delay:.24s}
.dk-disp>div:nth-child(6){animation-delay:.3s}.dk-disp>div:nth-child(7){animation-delay:.36s}
.dk-disp>div:nth-child(8){animation-delay:.42s}
.dk-d1{font-size:15px;font-weight:700;color:#ff8a9b}
.dk-d2{font-size:14.5px;line-height:1.5;color:#eaf0ff}
.dk-disp i{font-size:11px;color:#e7b53c;font-style:normal;font-family:var(--mono);text-align:right;min-width:150px}
#deck[data-tema="claro"] .dk-disp>div{background:#fff;box-shadow:0 4px 14px rgba(20,35,80,.07)}
#deck[data-tema="claro"] .dk-d2{color:#16233f}
@media(max-width:900px){.dk-disp>div{grid-template-columns:1fr}.dk-disp i{text-align:left}}


.dk-acrd{display:flex;flex-direction:column;gap:11px;margin:16px 0}
.dk-acrd>div{display:grid;grid-template-columns:52px 1fr;gap:14px;background:rgba(255,255,255,.05);border-radius:11px;padding:14px 17px;align-items:start;animation:dkUp .4s both}
.dk-acrd>div:nth-child(2){animation-delay:.1s}.dk-acrd>div:nth-child(3){animation-delay:.2s}.dk-acrd>div:nth-child(4){animation-delay:.3s}
.dk-acrd>div>span{width:42px;height:42px;border-radius:11px;background:var(--brand-accent);color:#0a0f22;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
.dk-acrd>div>b{font-size:17px;grid-column:2}
.dk-acrd>div>p{grid-column:2;font-size:14px;color:#b9c6e6;margin:4px 0 0;line-height:1.6}
.dk-script{display:flex;flex-direction:column;gap:9px;margin:14px 0}
.dk-script>div{display:grid;grid-template-columns:34px 1fr;gap:12px;background:rgba(255,255,255,.05);border-radius:10px;padding:11px 15px;align-items:start;animation:dkUp .35s both}
.dk-script>div:nth-child(2){animation-delay:.06s}.dk-script>div:nth-child(3){animation-delay:.12s}
.dk-script>div:nth-child(4){animation-delay:.18s}.dk-script>div:nth-child(5){animation-delay:.24s}.dk-script>div:nth-child(6){animation-delay:.3s}
.dk-script>div>span{width:26px;height:26px;border-radius:50%;background:var(--brand-accent);color:#0a0f22;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.dk-script>div>b{font-size:14px;grid-column:2;color:#e7b53c}
.dk-script>div>p{grid-column:2;font-size:14px;margin:4px 0 0;line-height:1.7;color:#eaf0ff}
.dk-obs{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:14px 0}
.dk-obs>div{background:rgba(255,255,255,.05);border-radius:10px;padding:12px 14px;animation:dkPop .4s both}
.dk-obs>div>b{display:block;font-size:11.5px;letter-spacing:1.5px;color:var(--brand-accent);margin-bottom:7px;font-family:var(--mono)}
.dk-obs>div>span{display:block;font-size:12.5px;line-height:1.55;color:#c3cfeb;margin-bottom:3px}
.dk-recap{display:flex;flex-direction:column;gap:7px;margin:14px 0}
.dk-recap>div{display:grid;grid-template-columns:32px 130px 1fr;gap:12px;align-items:center;background:rgba(255,255,255,.045);border-radius:9px;padding:9px 14px;animation:dkUp .35s both}
.dk-recap>div:nth-child(2){animation-delay:.06s}.dk-recap>div:nth-child(3){animation-delay:.12s}.dk-recap>div:nth-child(4){animation-delay:.18s}
.dk-recap>div:nth-child(5){animation-delay:.24s}.dk-recap>div:nth-child(6){animation-delay:.3s}.dk-recap>div:nth-child(7){animation-delay:.36s}
.dk-recap>div>span{width:26px;height:26px;border-radius:50%;background:var(--brand-accent);color:#0a0f22;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.dk-recap>div>b{font-size:14.5px}
.dk-recap>div>p{font-size:13px;color:#b9c6e6;margin:0;line-height:1.5}
#deck[data-tema="claro"] .dk-acrd>div,#deck[data-tema="claro"] .dk-script>div,#deck[data-tema="claro"] .dk-obs>div,#deck[data-tema="claro"] .dk-recap>div{background:#fff;box-shadow:0 4px 14px rgba(20,35,80,.07)}
#deck[data-tema="claro"] .dk-acrd>div>p,#deck[data-tema="claro"] .dk-script>div>p,#deck[data-tema="claro"] .dk-obs>div>span,#deck[data-tema="claro"] .dk-recap>div>p{color:#3d4c73}
@media(max-width:1000px){.dk-obs{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.dk-obs,.dk-acrd>div,.dk-script>div,.dk-recap>div{grid-template-columns:1fr}.dk-recap>div>span,.dk-acrd>div>span,.dk-script>div>span{display:none}}

const DB={
  key(t,c){return `pc.${t}.${c}`},
  get(t,c){try{return JSON.parse(localStorage.getItem(this.key(t,c)))??[]}catch(e){return []}},
  set(t,c,v){localStorage.setItem(this.key(t,c),JSON.stringify(v));if(window.__cloudPush)window.__cloudPush(t,c,v);},
  getObj(t,c,d){try{return JSON.parse(localStorage.getItem(this.key(t,c)))??d}catch(e){return d}},
  push(t,c,i){const a=this.get(t,c);a.unshift(i);this.set(t,c,a);return i;},
  update(t,c,id,p){const a=this.get(t,c);const i=a.findIndex(x=>x.id===id);if(i>=0){a[i]={...a[i],...p};this.set(t,c,a);}return a[i];},
  remove(t,c,id){this.set(t,c,this.get(t,c).filter(x=>x.id!==id));},
  uid(){return 'id'+Math.random().toString(36).slice(2,9)}
};

let sb=null,CLOUD_ON=false,CLOUD_SYNCED={};
function initCloud(){try{if(window.supabase){sb=window.supabase.createClient(SB_URL,SB_KEY);CLOUD_ON=true;}}catch(e){CLOUD_ON=false;console.warn("cloud off",e);}}
function cloudPush(t,c,v){if(!CLOUD_ON||!SYNC_COLS.includes(c))return;try{sb.from("pc_store").upsert({tenant:t,col:c,data:v,updated_at:new Date().toISOString()},{onConflict:"tenant,col"}).then(r=>{if(r&&r.error)console.warn("push",c,r.error.message);});}catch(e){}}
window.__cloudPush=cloudPush;
async function cloudPull(t){if(!CLOUD_ON)return false;try{const r=await sb.from("pc_store").select("col,data").eq("tenant",t);if(r.error)throw r.error;if(!r.data||!r.data.length)return "empty";r.data.forEach(row=>localStorage.setItem(DB.key(t,row.col),JSON.stringify(row.data)));return true;}catch(e){console.warn("pull",e.message);return false;}}
async function cloudPushAll(t){if(!CLOUD_ON)return;const rows=SYNC_COLS.map(c=>{const v=localStorage.getItem(DB.key(t,c));return v==null?null:{tenant:t,col:c,data:JSON.parse(v)};}).filter(Boolean);if(!rows.length)return;try{await sb.from("pc_store").upsert(rows,{onConflict:"tenant,col"});}catch(e){console.warn("pushAll",e.message);}}
async function syncTenant(t){
  if(!CLOUD_ON){setCloudBadge("off");return;}
  CLOUD_SYNCED[t]=true;setCloudBadge("sync");
  const res=await cloudPull(t);
  if(res==="empty"){await cloudPushAll(t);}
  setCloudBadge(res===false?"off":"on");
  if(SESSION){if(CURRENT_TENANT===t){renderSidebar();go(CURRENT_VIEW);}else if(!CURRENT_TENANT&&SESSION.tenant==="all"){openConsultoria();}}
}

/* ===== Fundo animado (matrix laranja) + frases de efeito ===== */
let bgReq;
function startBgFx(){
  const c=document.getElementById("bgfx");if(!c)return;const ctx=c.getContext("2d");
  const words=["VENDER","PROCESSO","FOLLOW-UP","ESCALA","MÉTODO","PROTOCOLO","FECHAMENTO","PREVISIBILIDADE","MENTORIA","RESULTADO","DISCIPLINA","CADÊNCIA","SCRIPT","FUNIL","META","CLOSER","PIPELINE","RECORRÊNCIA","SPIN","B2B"];
  const fs=15;let W,H,cols;
  function resize(){
    W=c.width=innerWidth||document.documentElement.clientWidth||1280;
    H=c.height=innerHeight||document.documentElement.clientHeight||800;
    const gap=175,n=Math.max(6,Math.floor(W/gap));
    cols=Array.from({length:n},(_,i)=>({x:Math.round((i+0.5)*W/n),y:Math.random()*-H,w:words[Math.floor(Math.random()*words.length)],sp:0.15+Math.random()*0.2,a:0.12+Math.random()*0.13}));
  }
  resize();addEventListener("resize",resize);setTimeout(resize,150);
  function draw(){
    if(!W||W<10||!cols){resize();if(!W){bgReq=requestAnimationFrame(draw);return;}}
    ctx.clearRect(0,0,W,H);
    ctx.font="700 "+fs+"px ui-monospace,SFMono-Regular,monospace";ctx.textAlign="center";
    cols.forEach(d=>{ctx.fillStyle="rgba(255,107,43,"+d.a+")";ctx.fillText(d.w,d.x,d.y);
      d.y+=d.sp;if(d.y>H+24){d.y=Math.random()*-60;d.w=words[Math.floor(Math.random()*words.length)];}});
    bgReq=requestAnimationFrame(draw);
  }
  draw();
}
function stopBgFx(){if(bgReq)cancelAnimationFrame(bgReq);const c=document.getElementById("bgfx");if(c)c.style.display="none";}

    setTimeout(()=>{
      lgQi=(lgQi+1)%LG_QUOTES.length;

  const p=document.getElementById("lgPass").value;const acc=USERS[u];
  if(!acc||acc.pass!==p){toast("Usuário ou senha inválidos","bad");return;}
  SESSION=acc;
  try{localStorage.setItem('pc_sso','1');localStorage.setItem('pc_sso_user',u);}catch(e){}
  stopBgFx();clearInterval(lgTimer);
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("uAv").textContent=acc.initials;
  document.getElementById("uName").textContent=acc.name;
  if(acc.tenant==="all"){openConsultoria();}else{openTenant(acc.tenant);}
}

function openTenant(tenant){
  CURRENT_TENANT=tenant;applyBrand(BRANDS[tenant].brand);
  document.getElementById("tbMark").innerHTML=BRANDS[tenant].mark(28);
  document.getElementById("tbName").textContent=BRANDS[tenant].name;
  document.getElementById("searchWrap").style.visibility="visible";
  document.getElementById("bellBtn").classList.toggle("hidden",!isAdmin());
  document.getElementById("backBtn").classList.toggle("hidden", SESSION.role!=="consultor");
  renderSidebar();updateBell();go(SESSION.role==="ceo"?"exec":(["sdr","closer","cs"].includes(SESSION.role)?"treino":"painel"));
  if(!CLOUD_SYNCED[tenant])syncTenant(tenant);

const canSee=i=>!i.roles||i.roles.includes(SESSION.role);
function renderSidebar(){
  let html="";
  if(SESSION.role==="consultor")html+=`<div class="nav-item" onclick="openConsultoria()"><span class="ic">←</span> Todas as empresas</div>`;
  activeNav().forEach(n=>{
    if(n.g){html+=`<div class="sb-group">${n.g}</div>`;return;}
    if(n.url){html+=`<div class="nav-item" onclick="window.open('${n.url}','_blank')"><span class="ic">${n.ic}</span> ${n.t}<span style="margin-left:auto;opacity:.45;font-size:11px">↗</span></div>`;return;}
    if(!canSee(n))return;
    let badge="";
    if(n.id==="crm")badge=`<span class="badge">${DB.get(CURRENT_TENANT,"leads").length}</span>`;
    if(n.id==="tarefas"){const c=taskCount();if(c)badge=`<span class="badge">${c}</span>`;}
    if(n.id==="treino"&&!quizPassedToday()&&["sdr","closer","cs"].includes(SESSION.role))badge=`<span class="badge">!</span>`;
    html+=`<div class="nav-item ${CURRENT_VIEW===n.id?'active':''}" data-view="${n.id}" onclick="go('${n.id}')"><span class="ic">${n.ic}</span> ${n.t} ${badge}</div>`;
  });
  document.getElementById("sidebar").innerHTML=html;
}
function go(view){
  CURRENT_VIEW=view;document.body.classList.remove("navon");
  document.querySelectorAll(".nav-item[data-view]").forEach(e=>e.classList.toggle("active",e.dataset.view===view));
  const nav=activeNav().find(n=>n.id===view);
  document.getElementById("crumbs").innerHTML=`<b>${BRANDS[CURRENT_TENANT].name}</b> · ${nav?nav.t:''}`;
  if(["sdr","closer","cs"].includes(SESSION.role)&&!quizPassedToday()&&!["treino","scripts","academy"].includes(view))return renderLockGate();
  ({painel:vPainel,exec:vExec,crm:vCRM,tarefas:vTarefas,base:vBase,funil:vFunil,prospec:vProspec,scripts:vScripts,
    treino:vTreino,academy:vAcademy,perf:vPerf,metas:vMetas,fidelidade:vFidelidade,recorrencia:vRecorrencia}[view]||vPainel)();
  document.getElementById("main").scrollTop=0;
}

  const ativos=members.filter(m=>m.status==="ativo").length;

       <div class="flex between" style="font-size:13px;margin:8px 0"><span>🎯 SDR — por reunião realizada</span><b>${money(g.comissaoSDR)}</b></div>
       <div class="flex between" style="font-size:13px;margin:8px 0"><span>🤝 ${lx('closerRole')} — sobre a ${lx('venda')}</span><b>${g.comissaoCloserPct}%</b></div>

function vExec(){

  const fatReal=g.fatReal||0,fatMeta=g.fatMeta||0,proj=g.projecao||0;
  const pctMeta=fatMeta?Math.round(fatReal/fatMeta*100):0,gap=Math.max(fatMeta-fatReal,0);
  const abertos=leads.filter(l=>!["ganho","perdido","churn"].includes(l.estagio));
  const pipeline=abertos.reduce((s,l)=>s+(l.valor||0),0);
  const ativos=members.filter(m=>m.status==="ativo"),inad=members.filter(m=>m.status==="inadimplente");
  const churnN=members.filter(m=>m.status==="churn").length;
  const churnRate=members.length?Math.round(churnN/members.length*100):0;
  const mrr=members.filter(m=>m.status!=="churn").reduce((s,m)=>s+(m.mrr||0),0),arr=mrr*12;
  const npsV=members.map(m=>m.nps).filter(n=>n!=null);
  const nps=npsV.length?Math.round(npsV.reduce((a,b)=>a+b,0)/npsV.length*10)/10:0;
  const ganhos=leads.filter(l=>l.estagio==="ganho").length,perdidos=leads.filter(l=>l.estagio==="perdido").length;
  const conv=(ganhos+perdidos)?Math.round(ganhos/(ganhos+perdidos)*100):0;
  const naMeta=sellers.filter(s=>s.realizado>=s.meta).length;
  const ring=Math.min(pctMeta,100);
  M().innerHTML=`

               <b style="font-size:22px">${pctMeta}%</b><small class="mut" style="font-size:10px">da meta</small></div></div>
           <div><div style="font-size:24px;font-weight:800">${money(fatReal)}</div><small class="mut">de ${money(fatMeta)} · faltam <b>${money(gap)}</b></small>

         </div>
       </div>
       <div class="flex wrap" style="gap:26px">
         <div><div style="font-size:22px;font-weight:800">${money(mrr)}</div><div class="eyebrow mut">MRR</div></div>
         <div><div style="font-size:22px;font-weight:800">${money(arr)}</div><div class="eyebrow mut">ARR (12m)</div></div>
         <div><div style="font-size:22px;font-weight:800;color:${churnRate<=5?'var(--brand-ok)':'var(--brand-bad)'}">${churnRate}%</div><div class="eyebrow mut">Churn</div></div>
         <div><div style="font-size:22px;font-weight:800">${nps||'—'}</div><div class="eyebrow mut">NPS médio</div></div>
       </div>
     </div>

function actStatus(leadId){
  const acts=DB.get(T(),"activities").filter(a=>a.leadId===leadId&&!a.done);
  if(!acts.length)return"none";
  const today=new Date().toISOString().slice(0,10);
  if(acts.some(a=>a.data<today))return"late";
  if(acts.some(a=>a.data===today))return"today";
  return"future";
}
function renderKanban(){
  const funnels=DB.getObj(T(),"funnels",FUNNELS);
  const funnel=funnels.find(f=>f.id===CRM_FUNNEL)||funnels[0];
  const q=(document.getElementById("crmSearch")?.value||"").toLowerCase();
  let leads=DB.get(T(),"leads").filter(l=>l.funnelId===funnel.id);
  if(CRM_SELLER!=="all")leads=leads.filter(l=>l.owner===CRM_SELLER);
  if(q)leads=leads.filter(l=>(l.nome+(l.fantasia||"")+(l.razaoSocial||"")+((l.contato||{}).email||"")).toLowerCase().includes(q));
  const now=Date.now();
  document.getElementById("kanban").innerHTML=funnel.stages.map(s=>{
    const ls=leads.filter(l=>l.estagio===s.id);const val=ls.reduce((a,l)=>a+(l.valor||0),0);
    return `<div class="kcol"><h4><span class="temp" style="background:${s.id==='ganho'?'var(--brand-ok)':(s.id==='perdido'||s.id==='churn')?'var(--brand-bad)':'var(--brand-primary-2)'}"></span>${s.name}<span class="cnt">${ls.length} · ${money(val)}</span></h4>
      <div class="drop" data-stage="${s.id}">
      ${ls.map(l=>{const slaLate=s.sla&&(now-(l.movedAt||l.criadoEm))>s.sla*36e5;const as=actStatus(l.id);
        const cls=as==="late"?"late":as==="none"?"noact":as==="today"?"today":"future";const tc=l.temp==="quente"?"q":l.temp==="morno"?"m":"f";
        return `<div class="kcard ${cls}" draggable="true" data-id="${l.id}" onclick="leadDetail('${l.id}')">
          <span class="actdot ${as}"></span><div class="nm">${l.nome}</div><div class="co">${l.fantasia||l.razaoSocial||""}</div>
          <div class="ft"><span class="temp ${tc}"></span><small class="mut" style="font-size:10.5px">★${l.score||0} · ${sellerName(l.owner)}</small>${slaLate?'<span class="pill bad" style="padding:1px 6px">SLA</span>':''}<span class="val">${money(l.valor)}</span></div></div>`;}).join("")||`<small class="mut" style="padding:8px">vazio</small>`}
      </div></div>`;}).join("");
  bindDrag();
}
function bindDrag(){
  let dragId=null;
  document.querySelectorAll(".kcard").forEach(c=>{
    c.addEventListener("dragstart",e=>{dragId=c.dataset.id;c.classList.add("drag");});
    c.addEventListener("dragend",()=>c.classList.remove("drag"));});
  document.querySelectorAll(".drop").forEach(d=>{
    d.addEventListener("dragover",e=>{e.preventDefault();d.parentElement.classList.add("over");});
    d.addEventListener("dragleave",()=>d.parentElement.classList.remove("over"));
    d.addEventListener("drop",e=>{e.preventDefault();d.parentElement.classList.remove("over");
      if(dragId){moveLeadStage(dragId,d.dataset.stage);renderKanban();}});});
}
function moveLeadStage(id,stage){

function ldHistory(l){

  let h=all;
  if(LD_HFILTER==="sist")h=all.filter(x=>["sistema","etapa"].includes(x.tipo));

function baseFiltered(){
  const q=(document.getElementById("bSearch")?.value||"").toLowerCase().trim();
  const org=document.getElementById("bOrigem")?.value||"",ram=document.getElementById("bRamo")?.value||"";
  const mem=document.getElementById("bMembro")?.value||"",crm=document.getElementById("bCrm")?.value||"";
  return DB.get(T(),"base").filter(b=>{
    if(q && !((b.nome||"")+" "+(b.empresa||"")+" "+(b.tel||"")+" "+(b.email||"")+" "+(b.cargo||"")).toLowerCase().includes(q))return false;
    if(org && !(b.origens||[]).includes(org))return false;
    if(ram && b.ramo!==ram)return false;
    if(mem==="sim" && b.membro!=="sim")return false;
    if(mem==="nao" && b.membro==="sim")return false;
    if(crm==="fora" && b.inCrm)return false;
    if(crm==="dentro" && !b.inCrm)return false;
    return true;});
}

function doneTask(aid){const a=DB.get(T(),"activities").find(x=>x.id===aid);DB.update(T(),"activities",aid,{done:true});if(a)DB.push(T(),"history",{id:DB.uid(),leadId:a.leadId,tipo:"atividade",txt:"Tarefa concluída: "+a.titulo,ts:Date.now()});toast("Tarefa concluída ✅");vTarefas();renderSidebar();}

function vProspec(){
  const cads=DB.getObj(T(),"cadences",defaultCadences());
  const allRoles=[["sdr","🎯 SDR"],["closer","🤝 "+lx('closerRole')],["cs","💚 CS"]];
  const roles=isAdmin()?allRoles:allRoles.filter(r=>r[0]===SESSION.role);
  if(!roles.find(r=>r[0]===CAD_ROLE))CAD_ROLE=roles[0][0];
  const cad=cads[CAD_ROLE]||[];
  M().innerHTML=`
   <div class="view-title"><h1>Prospecção & Cadências</h1>${isAdmin()?'':`<span class="pill pri">Sua cadência: ${roleLabel(SESSION.role)}</span>`}</div>
   <p class="view-sub">Régua de relacionamento por papel — com <b>vários toques no mesmo dia</b> (atendeu / não atendeu), do D0 ao D12.</p>
   <div class="flex between wrap" style="margin-bottom:12px">
     <div class="flex wrap">${roles.map(([id,t])=>`<span class="chip ${CAD_ROLE===id?'on':''}" onclick="CAD_ROLE='${id}';vProspec()">${t}</span>`).join("")}</div>
     ${isAdmin()?`<div class="flex"><button class="btn ghost sm" onclick="resetCad()">restaurar padrão</button><button class="btn sm" onclick="addCadDay()">+ Dia</button></div>`:""}</div>
   <div class="grid" style="grid-template-columns:1.5fr 1fr">
     <div class="card">
       <h2 style="margin:0 0 12px;font-size:15px">Roteiro de cadência do ${roles.find(r=>r[0]===CAD_ROLE)[1]} — siga do D0 ao D${cad.length?cad[cad.length-1].dia:12}</h2>
       <div class="rot">
       ${cad.map((day,di)=>`<div class="step" data-n="D${day.dia}">
         <div class="flex between" style="align-items:center"><h3 style="margin:0">Dia ${day.dia}${day.dia===0?" · primeiro contato":""}</h3>${isAdmin()?`<button class="btn xs ghost" onclick="addTouch(${di})">+ toque</button>`:""}</div>
         ${day.toques.map((tk,ti)=>`<div class="touch"><div class="h">${tk.h}</div>
           <div style="flex:1"><div class="flex wrap" style="gap:8px"><span class="chan ${tk.canal}">${chanLabel(tk.canal)}</span><b style="font-size:13px">${tk.cond}</b></div>
             <p class="mut" style="font-size:12.5px;margin:5px 0 0">${tk.texto}</p></div>
           ${isAdmin()?`<div><button class="btn xs ghost" onclick="editTouch(${di},${ti})">✎</button><button class="btn xs ghost" onclick="delTouch(${di},${ti})">✕</button></div>`:""}</div>`).join("")}
         ${di<cad.length-1?`<span class="go">↓ sem resposta? siga pro D${cad[di+1].dia}</span>`:`<span class="go">✔ fim da régua — break-up amigável / devolver pro fluxo</span>`}
       </div>`).join("")}
       </div>
     </div>
     <div>
       <div class="card"><h2 style="margin:0 0 8px;font-size:15px">Regras de ouro</h2>
         <ul class="mut" style="font-size:13px;line-height:1.8;padding-left:18px;margin:0">
           <li><b>7 a 12 toques</b> antes de desistir.</li><li>Vários toques <b>no mesmo dia</b>: ligou/não atendeu → WhatsApp → liga de novo.</li>
           <li>Varie <b>canal</b> e <b>horário</b>.</li><li>1º toque com <b>prova social</b>.</li><li>Nunca fale preço no 1º contato.</li><li><b>Break-up</b> reativa ~40%.</li></ul></div>
       <div class="card mt"><h2 style="margin:0 0 8px;font-size:15px">Canais</h2>
         <div class="flex wrap" style="gap:6px">${["call","wa","email","insta","visita","msg"].map(c=>`<span class="chan ${c}">${chanLabel(c)}</span>`).join("")}</div></div>
     </div></div>`;
}
function chanLabel(c){return {call:"📞 Ligação",wa:"🟢 WhatsApp",email:"✉️ E-mail",insta:"📸 Instagram",visita:"📍 Visita",msg:"💬 Mensagem"}[c]||c;}
function resetCad(){DB.set(T(),"cadences",defaultCadences());vProspec();toast("Cadências restauradas");}
function saveCads(c){DB.set(T(),"cadences",c);}
function addCadDay(){const c=DB.getObj(T(),"cadences",defaultCadences());const last=c[CAD_ROLE].length?c[CAD_ROLE][c[CAD_ROLE].length-1].dia:0;
  c[CAD_ROLE].push({dia:last+1,toques:[{h:"10:00",canal:"call",cond:"Novo toque",texto:"Descreva a ação."}]});saveCads(c);vProspec();}
function addTouch(di){const c=DB.getObj(T(),"cadences",defaultCadences());c[CAD_ROLE][di].toques.push({h:"+1h",canal:"wa",cond:"Não atendeu → ação",texto:"Descreva a ação."});saveCads(c);vProspec();}
function delTouch(di,ti){const c=DB.getObj(T(),"cadences",defaultCadences());c[CAD_ROLE][di].toques.splice(ti,1);if(!c[CAD_ROLE][di].toques.length)c[CAD_ROLE].splice(di,1);saveCads(c);vProspec();}
function editTouch(di,ti){const c=DB.getObj(T(),"cadences",defaultCadences());const tk=c[CAD_ROLE][di].toques[ti];
  openModal(`<h3>Editar toque (D${c[CAD_ROLE][di].dia})</h3>
   <div class="row mt"><div><label class="fl">Horário</label><input class="in" id="t_h" value="${tk.h}"></div>
     <div><label class="fl">Canal</label><select class="in" id="t_canal">${["call","wa","email","insta","visita","msg"].map(x=>`<option ${tk.canal===x?'selected':''}>${x}</option>`).join("")}</select></div></div>
   <label class="fl mt8">Condição / título</label><input class="in" id="t_cond" value="${tk.cond.replace(/"/g,'&quot;')}">
   <label class="fl mt8">Texto</label><textarea class="in" id="t_txt" rows="3">${tk.texto}</textarea>
   <div class="flex mt" style="justify-content:flex-end"><button class="btn ghost sm" onclick="closeModal()">Cancelar</button><button class="btn sm" onclick="saveTouch(${di},${ti})">Salvar</button></div>`);}
function saveTouch(di,ti){const c=DB.getObj(T(),"cadences",defaultCadences());c[CAD_ROLE][di].toques[ti]={h:t_h.value,canal:t_canal.value,cond:t_cond.value,texto:t_txt.value};saveCads(c);closeModal();vProspec();toast("Toque atualizado");}

/* ===== SCRIPTS (restrição por papel) ===== */
function scriptTabsFor(){
  const all=[["visao","🧭 ICP & Empresa"],["sdr","🎯 SDR — Qualificação"],["bot","🤖 Bot de Qualificação"],["closer","🤝 "+lx("closerRole")+" — Fechamento"],["cs","💚 CS — Pós-venda"]];
  if(isAdmin())return all;
  const map={sdr:["visao","sdr","bot"],closer:["visao","closer"],cs:["visao","cs"]};
  const perm=map[SESSION.role]||["visao"];
  return all.filter(t=>perm.includes(t[0]));
}

function deckKey(e){

 if(!PRES_WIN||PRES_WIN.closed)return;
 const el=PRES_WIN.document.getElementById("prClock");if(!el)return;
 const s=DECK_T0?Math.floor((Date.now()-DECK_T0)/1000):0;
 el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
 const prev=DECK[DECK_I].tempo.split(":");const prevSec=(+prev[0])*60+(+prev[1]);
 el.className="pr-clock"+(s>prevSec+240?" late":"");
}
function presRender(){
 if(!PRES_WIN||PRES_WIN.closed)return;
 const d=PRES_WIN.document,s=DECK[DECK_I],nx=DECK[DECK_I+1];
 const g=id=>d.getElementById(id); if(!g("prNote"))return;
 g("prBloco").textContent=s.bloco;
 g("prPrev").textContent="⏱ previsto "+s.tempo;
 g("prCount").textContent=(DECK_I+1)+" / "+DECK.length;
 g("prProg").style.width=((DECK_I+1)/DECK.length*100)+"%";
 g("prNote").textContent=s.nota;
 g("prTitle").textContent=s.titulo;
 const tmp=d.createElement("div");tmp.innerHTML=s.corpo;
 g("prMini").textContent=(tmp.textContent||"").replace(/\s+/g," ").trim().slice(0,320);
 g("prNext").innerHTML=nx?("<b>"+nx.titulo+"</b><br>"+nx.nota.slice(0,150)+"…"):"— fim da apresentação —";
 g("prBack").disabled=DECK_I===0; g("prFwd").disabled=DECK_I===DECK.length-1;
 presClock();
}

function acadConteudo(){
 return `
 <div class="card"><span class="pill pri">Módulo 1</span><h2 style="margin:8px 0 6px;font-size:16px">O jogo comercial</h2>
  <h3 style="font-size:14px;margin:14px 0 4px">Processo vence talento</h3>
  <p class="mut" style="font-size:13px;margin:0 0 8px">Todo time tem aquele vendedor "nato" que fecha sem saber explicar como. O problema é que ele não escala e não ensina. Processo é o contrário: é chato, é repetível — e é o que faz um time inteiro performar. Você não precisa ser o melhor falador da sala. Precisa <b>seguir o roteiro, fazer as perguntas e registrar</b>.</p>
  <p class="mut" style="font-size:13px;margin:0 0 8px">Um número para guardar: a maioria das vendas B2B não se perde na hora do preço — se perde antes, na <b>qualificação mal feita</b> (você foi para a reunião com quem não decide, não tem dor ou não tem momento) e no <b>follow-up que não aconteceu</b>. As duas coisas são processo, não talento.</p>
  <h3 style="font-size:14px;margin:16px 0 4px">Por que separamos SDR, Closer e CS</h3>
  <p class="mut" style="font-size:13px;margin:0 0 8px">Quando a mesma pessoa prospecta, apresenta e cuida do cliente, ela sempre escolhe a tarefa mais confortável — e prospectar é a mais desconfortável. Resultado: agenda vazia daqui a 30 dias. Separando:</p>
  <div class="grid3">
   <div class="card" style="margin:0"><b style="font-size:13px">🎯 SDR</b><p class="mut" style="font-size:12.5px;margin:4px 0 0">Encontra e qualifica. <b>Não vende</b> — vende a reunião. Sucesso dele = reunião acontecida com gente certa.</p></div>
   <div class="card" style="margin:0"><b style="font-size:13px">🤝 Closer</b><p class="mut" style="font-size:12.5px;margin:4px 0 0">Diagnostica e fecha. Recebe o lead já qualificado. Sucesso = adesão assinada.</p></div>
   <div class="card" style="margin:0"><b style="font-size:13px">💎 CS</b><p class="mut" style="font-size:12.5px;margin:4px 0 0">Faz o cliente ter resultado e ficar. Sucesso = renovação, upgrade e <b>indicação</b> — que volta para o SDR.</p></div>

  <p class="mut" style="font-size:13px;margin:10px 0 0">Repare que isso fecha um ciclo: o CS alimenta o SDR com indicações. Indicação é o lead mais barato e que mais converte que existe. Um time que não pede indicação está comprando lead caro à toa.</p>
  <h3 style="font-size:14px;margin:16px 0 4px">O que um bom comercial tem (e dá para treinar)</h3>
  <div class="grid2">
   <div><b style="font-size:13px">🔁 Consistência</b><p class="mut" style="font-size:12.5px;margin:3px 0 0">Faz o número de tentativas todo dia, inclusive no dia ruim. Vendas é lei dos grandes números aplicada à disciplina.</p></div>

   <div><b style="font-size:13px">🧠 Curiosidade real</b><p class="mut" style="font-size:12.5px;margin:3px 0 0">Quer mesmo saber do negócio do outro. Isso não se finge — e é o que gera as boas perguntas.</p></div>
   <div><b style="font-size:13px">🛡️ Resiliência</b><p class="mut" style="font-size:12.5px;margin:3px 0 0">Não leva o "não" para o pessoal. O não é sobre o momento dele, não sobre você.</p></div>
   <div><b style="font-size:13px">📝 Registro</b><p class="mut" style="font-size:12.5px;margin:3px 0 0">O que não está no CRM não existe. Sua memória não escala e some quando você tira férias.</p></div>
   <div><b style="font-size:13px">🎓 Domínio do produto</b><p class="mut" style="font-size:12.5px;margin:3px 0 0">Saber o que o Líderes entrega de cor. Insegurança na voz o cliente escuta na hora.</p></div>
  </div>
 </div>

 <div class="card"><span class="pill pri">Módulo 2</span><h2 style="margin:8px 0 6px;font-size:16px">Rapport: conexão em 30 segundos</h2>
  <p class="mut" style="font-size:13px;margin:0 0 8px">Rapport não é puxar o saco nem falar do tempo. É fazer a pessoa sentir, rápido, que <b>vale a pena continuar essa conversa</b>. Nos primeiros segundos o cliente decide inconscientemente se você é (a) mais um vendedor chato ou (b) alguém que pode ajudar. Três coisas decidem isso — e nenhuma delas é o seu argumento.</p>
  <h3 style="font-size:14px;margin:14px 0 4px">1. Tonalidade (o que mais pesa no telefone)</h3>
  <p class="mut" style="font-size:13px;margin:0 0 6px">No telefone ele não vê seu rosto. Sobra a voz. A mesma frase muda de sentido conforme o tom:</p>
  <ul class="mut" style="font-size:13px;margin:0 0 8px;padding-left:18px">
   <li><b>Tom de autoridade tranquila:</b> frase que <i>desce</i> no final. "Oi João, aqui é a Ana do Líderes do Brasil." — afirmação, não pergunta. Quem sobe o tom no final parece pedir licença para existir.</li>
   <li><b>Ritmo:</b> comece um pouco mais rápido (mostra que você respeita o tempo dele) e desacelere quando ele começar a se abrir.</li>
   <li><b>Pausa:</b> a arma mais subestimada. Fez a pergunta? Cale a boca. O silêncio incomoda você, não ele — e é nele que vem a resposta boa.</li>
   <li><b>Sorriso:</b> sorria de verdade enquanto fala. Muda a ressonância da voz e o outro percebe.</li>
  </ul>
  <h3 style="font-size:14px;margin:14px 0 4px">2. Espelhamento leve</h3>
  <p class="mut" style="font-size:13px;margin:0 0 8px">Se ele fala devagar e pausado, não atropele. Se ele é direto e seco, seja direto e seco. E use <b>as palavras dele</b>: se ele disse "tá osso segurar a equipe", você repete "esse osso de segurar a equipe" — não traduz para "gestão de pessoas". Repetir o vocabulário do cliente é a forma mais rápida de ele sentir que você entendeu.</p>
  <h3 style="font-size:14px;margin:14px 0 4px">3. A regra 70/30</h3>
  <p class="mut" style="font-size:13px;margin:0 0 8px">Ele fala 70% do tempo, você 30%. Se inverter, você está apresentando cedo demais. Vendedor que fala muito acha que está convencendo; na prática está entregando argumentos antes de saber quais importam — e cada argumento errado é uma objeção que você mesmo criou.</p>
  <div style="background:var(--brand-panel2);border-left:3px solid var(--brand-accent);padding:10px 14px;border-radius:6px;margin-top:10px">
   <b style="font-size:13px">O erro nº 1 do iniciante</b><p class="mut" style="font-size:13px;margin:4px 0 0">Perguntar "tem 2 minutinhos?" ou "é um bom momento?". Você acabou de entregar de bandeja a saída mais fácil. Não peça permissão: seja breve, útil e já emende na primeira pergunta.</p>
  </div>
 </div>

 <div class="card"><span class="pill pri">Módulo 3</span><h2 style="margin:8px 0 6px;font-size:16px">Perguntas que vendem: SPIN e BANT</h2>
  <p class="mut" style="font-size:13px;margin:0 0 10px">Existe uma diferença entre <b>interrogar</b> e <b>diagnosticar</b>. O médico não te vende remédio na porta do consultório — ele pergunta, examina, e aí receita. Se ele receitasse antes, você não confiaria. Venda é igual: <b>quem pergunta, conduz</b>.</p>

  <h3 style="font-size:14px;margin:16px 0 6px">🔵 SPIN Selling — o que é e por que funciona</h3>
  <p class="mut" style="font-size:13px;margin:0 0 8px">Criado por Neil Rackham nos anos 80 a partir da observação de <b>mais de 35 mil visitas de vendas reais</b>. Ele queria descobrir o que os melhores vendedores de vendas complexas faziam de diferente. Descobriu que não era fechar melhor — era <b>perguntar diferente</b>. São 4 tipos de pergunta, nesta ordem:</p>
  <div class="grid2">
   <div class="card" style="margin:0"><b style="font-size:13px">S — Situação</b><p class="mut" style="font-size:12.5px;margin:4px 0 6px">Entender o contexto. <i>"Como está o time comercial hoje?" · "Você costuma trocar ideia com outros donos?"</i></p><p style="font-size:12px;margin:0;color:var(--brand-accent)"><b>Cuidado:</b> é a mais fácil e a mais perigosa. Pergunta de situação demais cansa e faz você parecer um formulário. Pesquise antes o que der para pesquisar e faça só as que faltam.</p></div>
   <div class="card" style="margin:0"><b style="font-size:13px">P — Problema</b><p class="mut" style="font-size:12.5px;margin:4px 0 6px">Trazer a dor à tona. <i>"Qual seu maior desafio hoje?" · "O que mais te tira o sono?" · "Sente que decide muita coisa sozinho?"</i></p><p style="font-size:12px;margin:0;color:var(--brand-accent)"><b>Por quê:</b> ninguém compra solução para problema que não admitiu ter. Aqui ele admite.</p></div>
   <div class="card" style="margin:0"><b style="font-size:13px">I — Implicação</b><p class="mut" style="font-size:12.5px;margin:4px 0 6px">Mostrar o custo de não resolver. <i>"E isso te custa o quê — tempo, dinheiro, oportunidade?" · "Se seguir assim mais um ano, onde você chega?"</i></p><p style="font-size:12px;margin:0;color:var(--brand-accent)"><b>É a mais poderosa e a mais pulada.</b> Foi a que mais separou os campeões dos medianos na pesquisa. É aqui que a dor deixa de ser um incômodo e vira prioridade — e é aqui que o cliente solta números sozinho, inclusive faturamento.</p></div>
   <div class="card" style="margin:0"><b style="font-size:13px">N — Necessidade de solução</b><p class="mut" style="font-size:12.5px;margin:4px 0 6px">Fazer ele descrever o ganho. <i>"Se você tivesse ao lado um grupo de donos que já passou por isso, o que mudaria?"</i></p><p style="font-size:12px;margin:0;color:var(--brand-accent)"><b>Por quê:</b> quando ele diz o benefício com a própria boca, ele se convence. Argumento seu ele contesta; argumento dele, não.</p></div>
  </div>
  <div style="background:var(--brand-panel2);border-left:3px solid var(--brand-accent);padding:10px 14px;border-radius:6px;margin-top:10px">
   <b style="font-size:13px">A regra de ouro do SPIN</b><p class="mut" style="font-size:13px;margin:4px 0 0">É uma <b>conversa</b>, não um checklist. Reaja ao que ele diz, use as palavras dele, e só então avance. Se soar como formulário, você perdeu.</p>
  </div>

  <h3 style="font-size:14px;margin:18px 0 6px">🟡 BANT — a qualificação clássica</h3>
  <p class="mut" style="font-size:13px;margin:0 0 8px">Criado pela IBM. É um filtro rápido para responder "vale a pena investir tempo nesse lead?". Quatro caixas:</p>
  <div class="grid2">
   <div><b style="font-size:13px">B — Budget (orçamento)</b><p class="mut" style="font-size:12.5px;margin:3px 0 0">Tem capacidade de investir? No nosso caso não se pergunta "quanto você tem" — se percebe pelo porte e pelo que ele conta na Implicação.</p></div>
   <div><b style="font-size:13px">A — Authority (autoridade)</b><p class="mut" style="font-size:12.5px;margin:3px 0 0">É ele quem decide? Se tem sócio, o sócio precisa estar na reunião. Reunião com quem não decide é reunião perdida.</p></div>
   <div><b style="font-size:13px">N — Need (necessidade)</b><p class="mut" style="font-size:12.5px;margin:3px 0 0">Tem uma dor real que a gente resolve? Não invente dor — descubra.</p></div>
   <div><b style="font-size:13px">T — Timing (momento)</b><p class="mut" style="font-size:12.5px;margin:3px 0 0">É agora ou é "ano que vem"? Momento errado é o não mais comum disfarçado.</p></div>
  </div>
  <p class="mut" style="font-size:13px;margin:10px 0 0"><b>A crítica ao BANT:</b> ele é centrado em você, não no cliente — parece uma peneira de RH. Serve para decidir prioridade, não para conduzir a conversa. Por isso a gente usa BANT <b>na cabeça</b> e SPIN <b>na boca</b>.</p>

  <h3 style="font-size:14px;margin:18px 0 6px">🟢 PDMAF — a nossa versão</h3>
  <p class="mut" style="font-size:13px;margin:0 0 8px">No Líderes usamos os 5 selos abaixo. Só agende reunião com os cinco marcados:</p>
  <div class="grid3">
   <div><b style="font-size:13px">P — Perfil</b><p class="mut" style="font-size:12.5px;margin:2px 0 0">É dono ou sócio, dentro do ICP.</p></div>
   <div><b style="font-size:13px">D — Dor</b><p class="mut" style="font-size:12.5px;margin:2px 0 0">Reconheceu uma dor real, com as palavras dele.</p></div>
   <div><b style="font-size:13px">M — Momento</b><p class="mut" style="font-size:12.5px;margin:2px 0 0">Está aberto a resolver agora.</p></div>
   <div><b style="font-size:13px">A — Autoridade</b><p class="mut" style="font-size:12.5px;margin:2px 0 0">Decide sozinho ou traz o sócio junto.</p></div>
   <div><b style="font-size:13px">F — Fit</b><p class="mut" style="font-size:12.5px;margin:2px 0 0">Faz sentido para a comunidade e ela para ele.</p></div>
  </div>

  <h3 style="font-size:14px;margin:18px 0 6px">Outras técnicas que valem conhecer</h3>
  <div class="grid2">
   <div><b style="font-size:13px">GPCT</b><p class="mut" style="font-size:12.5px;margin:3px 0 0">Goals, Plans, Challenges, Timeline. Evolução do BANT focada no objetivo do cliente, não no seu. Útil quando o cliente já sabe o que quer.</p></div>
   <div><b style="font-size:13px">Escuta ativa</b><p class="mut" style="font-size:12.5px;margin:3px 0 0">Repetir em outras palavras o que ele disse: "Então, se entendi, o problema não é vender — é que trava tudo em você, é isso?" Ele confirma e se sente entendido.</p></div>
   <div><b style="font-size:13px">Prova social</b><p class="mut" style="font-size:12.5px;margin:3px 0 0">Gente decide olhando gente parecida. "Tem um dono de [ramo parecido] no grupo que chegou com esse mesmo problema." Vale mais que qualquer adjetivo.</p></div>
   <div><b style="font-size:13px">Ancoragem</b><p class="mut" style="font-size:12.5px;margin:3px 0 0">Apresente sempre o plano maior primeiro (Premium Board), depois o Master. O segundo número sempre parece menor depois de um maior.</p></div>
   <div><b style="font-size:13px">Escassez honesta</b><p class="mut" style="font-size:12.5px;margin:3px 0 0">Vagas e turmas são reais — use isso, nunca invente. Escassez falsa destrói confiança e a cidade é pequena.</p></div>
   <div><b style="font-size:13px">Duas opções (alternativa)</b><p class="mut" style="font-size:12.5px;margin:3px 0 0">Nunca pergunte "quer marcar?". Pergunte "prefere terça 9h ou quinta 16h?". Você tira o sim/não e deixa só o quando.</p></div>
  </div>
 </div>

 <div class="card"><span class="pill pri">Módulo 5</span><h2 style="margin:8px 0 6px;font-size:16px">Objeções: o não que não é não</h2>
  <p class="mut" style="font-size:13px;margin:0 0 8px">Quase toda objeção é uma de três coisas: <b>medo</b> (de errar, de gastar mal), <b>dúvida</b> (não entendeu o valor) ou <b>confusão</b> (não é o momento na cabeça dele). Nenhuma das três se resolve discutindo. Se resolve perguntando.</p>
  <h3 style="font-size:14px;margin:14px 0 6px">Método ACRD</h3>
  <div class="grid2">
   <div><b style="font-size:13px">A — Acolher</b><p class="mut" style="font-size:12.5px;margin:3px 0 0">"Entendo, faz sentido." Nunca "mas". O "mas" apaga tudo que veio antes e vira briga.</p></div>
   <div><b style="font-size:13px">C — Confirmar</b><p class="mut" style="font-size:12.5px;margin:3px 0 0">"Só pra eu entender: é o tema que não faz sentido ou é o momento?" Descobre a objeção real por trás da dita.</p></div>
   <div><b style="font-size:13px">R — Reformular</b><p class="mut" style="font-size:12.5px;margin:3px 0 0">Devolva o valor sob outro ângulo, curto. Nada de discurso de 2 minutos.</p></div>

function objMatrix(){return DB.getObj(T(),"objMatrix",OBJ_SEED);}
function saveObjMatrix(m){DB.set(T(),"objMatrix",m);}
function acadAddObj(){
 const o=(document.getElementById("mxObj").value||"").trim();
 if(!o)return alert("Escreva a objeção que você ouviu.");
 const m=objMatrix();
 m.push({id:DB.uid(),obj:o,tras:(document.getElementById("mxTras").value||"").trim(),
   resp:(document.getElementById("mxResp").value||"").trim(),cat:document.getElementById("mxCat").value,by:SESSION.name});
 saveObjMatrix(m);vAcademy();
}
function acadDelObj(id){
 if(!confirm("Remover esta objeção da matriz?"))return;
 saveObjMatrix(objMatrix().filter(x=>x.id!==id));vAcademy();
}
function acadEditObj(id,campo,el){
 const m=objMatrix();const i=m.findIndex(x=>x.id===id);
 if(i<0)return;m[i][campo]=el.innerText.trim();saveObjMatrix(m);
}

function vAcademy(){
 M().innerHTML=acadHeader()+({aula:acadSumario,agenda:acadAgenda,conteudo:acadConteudo,dinamicas:acadDinamicas,

}

function vScripts(){
  const tabs=scriptTabsFor();
  if(!tabs.find(t=>t[0]===SCRIPT_TAB))SCRIPT_TAB=(isAdmin()?"visao":SESSION.role);
  if(!tabs.find(t=>t[0]===SCRIPT_TAB))SCRIPT_TAB=tabs[0][0];
  const SC=T()==="b2if"?{visao:scICP_B2,sdr:scSDR_B2,bot:scBOT_B2,closer:scCLO_B2,cs:scCS_B2}:{visao:scICP,sdr:scSDR,bot:scBOT,closer:scCLO,cs:scCS};
  M().innerHTML=`
   <div class="view-title"><h1>Script de Vendas</h1>${isAdmin()?'':`<span class="pill pri">Playbook do seu papel: ${roleLabel(SESSION.role)}</span>`}</div>
   <p class="view-sub">${isAdmin()?`Playbook completo da ${BRANDS[T()].name}: ICP, produtos e como conduzir cada etapa.`:"Você acessa o conhecimento da empresa e o playbook do seu papel."}</p>
   <div class="flex wrap" style="margin-bottom:14px">${tabs.map(([id,t])=>`<span class="chip ${SCRIPT_TAB===id?'on':''}" onclick="SCRIPT_TAB='${id}';vScripts()">${t}</span>`).join("")}</div>
   <div>${(SC[SCRIPT_TAB]||SC.visao)()}</div>`;
}

function scSDR(){return `
 <div class="card" style="border-left:3px solid var(--brand-primary-2)"><div class="flex between wrap"><h2 style="margin:0;font-size:15px">🎯 ROTEIRO DO SDR — siga de cima para baixo</h2><span class="pill pri">Qualificar & agendar — NÃO fechar</span></div>

   <div class="flex wrap mt" style="gap:20px"><div><div style="font-size:19px;font-weight:800">40-60</div><div class="eyebrow mut">tentativas/dia</div></div><div><div style="font-size:19px;font-weight:800">8-12</div><div class="eyebrow mut">conexões/dia</div></div><div><div style="font-size:19px;font-weight:800">2-3</div><div class="eyebrow mut">reuniões/dia</div></div><div><div style="font-size:19px;font-weight:800">≤20%</div><div class="eyebrow mut">no-show alvo</div></div></div></div>

 <div class="card mt"><div class="rot">
