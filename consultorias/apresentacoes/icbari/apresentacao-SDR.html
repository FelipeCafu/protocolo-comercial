<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apresentação SDR · ICBARI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a171c;--bg2:#0e242a;--panel:#102a30;--panel2:#0d2329;
  --line:rgba(42,157,143,.20);--line2:rgba(42,157,143,.40);
  --ink:#eaf5f3;--mut:#8fb6b0;--dim:#5f807b;
  --gold:#2A9D8F;--gold2:#38c6b4;--champ:#7fe0d2;--warm:#f0a58e;--rose:#e08a86;--teal:#6fd0c4;
  --serif:"Poppins","Inter",sans-serif;--sans:"Inter",system-ui,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
#bgwrap{position:fixed;inset:0;z-index:0;overflow:hidden;background:
   radial-gradient(1200px 720px at 80% -10%, rgba(42,157,143,.20), transparent 60%),
   radial-gradient(900px 620px at 6% 110%, rgba(56,198,180,.10), transparent 55%),
   linear-gradient(160deg,#0a171c,#0e242a 60%,#08141a)}
#bgwrap::after{content:"";position:absolute;inset:0;opacity:.45;
   background-image:linear-gradient(rgba(42,157,143,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(42,157,143,.05) 1px,transparent 1px);
   background-size:56px 56px;-webkit-mask-image:radial-gradient(120% 120% at 50% 0%,#000 40%,transparent 78%)}
.orb{position:absolute;border-radius:50%;filter:blur(64px);opacity:.5;pointer-events:none}
.orb.a{width:500px;height:500px;top:-150px;right:-90px;background:radial-gradient(circle,rgba(42,157,143,.5),transparent 70%)}
.orb.b{width:420px;height:420px;bottom:-160px;left:-120px;background:radial-gradient(circle,rgba(56,198,180,.3),transparent 70%)}
#stage{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;padding:5.5vh 5.5vw}
.slide{display:none;width:min(1140px,94vw);max-height:90vh;overflow:auto;scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}
.slide.on{display:block}
.anim{opacity:0;transform:translateY(16px);animation:up .65s cubic-bezier(.2,.75,.25,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.d1{animation-delay:.05s}.d2{animation-delay:.13s}.d3{animation-delay:.22s}.d4{animation-delay:.32s}.d5{animation-delay:.43s}.d6{animation-delay:.55s}.d7{animation-delay:.67s}
.kick{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold2)}
.kick::before{content:"";width:26px;height:1.5px;background:linear-gradient(90deg,var(--gold),transparent)}
.gtag{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#06231f;background:linear-gradient(100deg,var(--gold2),var(--champ));padding:5px 12px;border-radius:30px}
h1.big{font-family:var(--serif);font-weight:600;font-size:clamp(32px,5.6vw,70px);line-height:1.03;letter-spacing:-.5px;margin:16px 0 0}
h2.t{font-family:var(--serif);font-weight:600;font-size:clamp(24px,3.9vw,46px);line-height:1.08;letter-spacing:-.3px;margin:12px 0 0}
.lead{font-size:clamp(15px,1.6vw,19px);line-height:1.6;color:var(--mut);max-width:62ch}
.grad{background:linear-gradient(100deg,var(--gold2),var(--champ) 55%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.warmx{color:var(--warm)}
.row{display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.col{flex:1;min-width:290px}
.center{text-align:center;display:flex;flex-direction:column;align-items:center}
.center .lead{margin-left:auto;margin-right:auto}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt30{margin-top:30px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-top:26px}
.card{position:relative;border:1px solid var(--line);border-radius:16px;padding:20px 18px;background:linear-gradient(180deg,rgba(16,42,48,.8),rgba(13,35,41,.6));overflow:hidden}
.card .ico{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(42,157,143,.24),rgba(56,198,180,.1));border:1px solid var(--line2);margin-bottom:12px}
.card h3{font-size:16px;font-weight:600;margin:0 0 6px}
.card p{font-size:13.5px;line-height:1.55;color:var(--mut);margin:0}
.card .edge{position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--gold),var(--champ))}
svg.i{width:22px;height:22px;stroke:var(--gold2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* flow (conduction) */
.flowhead{display:flex;align-items:center;gap:14px;margin-top:14px}
.fnum{font-family:var(--serif);font-size:40px;font-weight:600;color:var(--gold2);line-height:1;min-width:54px}
.obj{margin-top:12px;padding:12px 16px;border-left:3px solid var(--gold);background:rgba(42,157,143,.08);border-radius:0 10px 10px 0;font-size:14.5px}
.obj b{color:var(--gold2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.blk h4{margin:0 0 8px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
.say{border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14px;line-height:1.5;margin-bottom:8px;background:rgba(255,255,255,.02)}
.say b{color:var(--ink)}
.ask{list-style:none;margin:0;padding:0}
.ask li{position:relative;padding:8px 0 8px 22px;font-size:14px;line-height:1.5;color:var(--mut);border-top:1px solid var(--line)}
.ask li:first-child{border-top:0}
.ask li::before{content:"?";position:absolute;left:0;top:8px;color:var(--gold2);font-weight:700}
.chkrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip2{border:1px solid var(--line2);border-radius:30px;padding:6px 13px;font-size:12.5px;color:var(--mut)}
.chip2 b{color:var(--gold2)}
.prox{margin-top:16px;display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--gold2)}
/* spin / bant */
.quad{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
@media(max-width:760px){.quad{grid-template-columns:1fr}}
.qbox{border:1px solid var(--line);border-radius:16px;padding:18px;background:linear-gradient(180deg,rgba(16,42,48,.75),rgba(13,35,41,.55))}
.qbox .k{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:20px;color:#06231f;background:linear-gradient(135deg,var(--gold2),var(--champ));margin-bottom:10px}
.qbox h4{margin:0 0 6px;font-size:15px}
.qbox p{margin:0;font-size:13.5px;line-height:1.5;color:var(--mut)}
.qbox p.qq{color:var(--ink);margin-top:8px;font-style:italic}
/* journey */
.jrn{position:relative;margin-top:40px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.jrn::before{content:"";position:absolute;left:6%;right:6%;top:26px;height:2px;background:linear-gradient(90deg,var(--gold),var(--champ),var(--gold2))}
.jnode{position:relative;text-align:center;padding:0 4px}
.jdot{width:54px;height:54px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 30%,#123038,#0b2026);border:1.5px solid var(--line2);box-shadow:0 8px 26px rgba(0,0,0,.5),0 0 0 6px rgba(10,23,28,.92)}
.jdot svg{width:24px;height:24px;stroke:var(--gold2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.jnode b{display:block;margin-top:14px;font-size:14px;font-weight:600}
.jnode span{display:block;margin-top:4px;font-size:12px;color:var(--mut);line-height:1.45}
@media(max-width:820px){.jrn{grid-template-columns:1fr 1fr;gap:22px}.jrn::before{display:none}}
/* photo / authority */
.photo{border-radius:20px;overflow:hidden;position:relative;min-height:340px;border:1px solid var(--line2);box-shadow:0 30px 70px rgba(0,0,0,.5)}
.photo img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.photo .ov{position:absolute;inset:0;background:linear-gradient(120deg,rgba(10,23,28,.5),rgba(10,23,28,.05))}
.photo .cap{position:absolute;left:16px;bottom:14px;font-size:12px;color:#f5f1e9;background:rgba(10,23,28,.55);border:1px solid var(--line2);padding:5px 11px;border-radius:20px;backdrop-filter:blur(4px)}
.pcard{border-radius:20px;overflow:hidden;border:1px solid var(--line2);background:#0b2026}
.pcard img{width:100%;display:block}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.badge{border:1px solid var(--line2);border-radius:12px;padding:9px 14px;font-size:13px;color:var(--mut)}
.badge b{color:var(--gold2)}
.hosp{display:flex;gap:16px;flex-wrap:wrap;margin-top:28px}
.hosp .hc{background:#f4f2ee;border-radius:14px;padding:16px 22px;min-width:180px;flex:1;display:flex;align-items:center;justify-content:center;min-height:96px}
.hosp .hc img{max-width:100%;max-height:64px;display:block}
/* contrast / vstack / stats / system / offer / objections / proof */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
.cmp .side{border:1px solid var(--line);border-radius:16px;padding:20px}
.cmp .bad{background:linear-gradient(180deg,rgba(224,138,134,.08),transparent)}
.cmp .good{background:linear-gradient(180deg,rgba(42,157,143,.12),transparent);border-color:var(--line2)}
.cmp h4{margin:0 0 12px;font-size:13px;letter-spacing:.5px;text-transform:uppercase;font-weight:600}
.cmp .bad h4{color:var(--rose)}.cmp .good h4{color:var(--gold2)}
.cmp li{list-style:none;padding:8px 0 8px 26px;position:relative;font-size:13.5px;line-height:1.5;color:var(--mut);border-top:1px solid var(--line)}
.cmp li:first-child{border-top:0}
.cmp li::before{position:absolute;left:0;top:7px}
.cmp .bad li::before{content:"✕";color:var(--rose)}.cmp .good li::before{content:"✓";color:var(--gold2)}
@media(max-width:760px){.cmp{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px;margin-top:34px}
.stat b{font-family:var(--serif);font-size:clamp(36px,5vw,62px);font-weight:600;line-height:1;display:block}
.stat span{display:block;margin-top:9px;font-size:13px;color:var(--mut);line-height:1.4}
.vstack{margin-top:22px}
.vstack .vi{display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.vstack .vi:first-child{border-top:0}
.vstack .vi .ck{width:26px;height:26px;border-radius:8px;flex:none;background:linear-gradient(135deg,rgba(42,157,143,.25),rgba(56,198,180,.1));border:1px solid var(--line2);display:flex;align-items:center;justify-content:center}
.vstack .vi .ck svg{width:14px;height:14px;stroke:var(--gold2);stroke-width:2;fill:none}
.vstack .vi p{margin:0;font-size:14.5px;line-height:1.5}
.vstack .vi p b{color:var(--ink)}.vstack .vi p span{color:var(--mut)}
.sys{border:1px solid var(--line2);border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#0f272d,#0a1e23);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.sys .bar{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.sys .bar i{width:9px;height:9px;border-radius:50%;background:#3a3226;display:block}
.sys .bar b{margin-left:10px;font-size:12px;color:var(--mut);font-weight:500}
.sys .body{padding:16px 18px}
.chk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.chk:last-child{border-bottom:0}
.chk .bx{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:none}
.chk.on .bx{background:linear-gradient(135deg,var(--gold),var(--champ));border-color:transparent}
.chk.on .bx svg{width:11px;height:11px;stroke:#06231f;stroke-width:2.6;fill:none}
.chk .tag{margin-left:auto;font-size:10.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--mut)}
.chk.on .tag{color:var(--gold2);border-color:rgba(56,198,180,.5)}
.trig{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.trig div{border:1px solid var(--line);border-radius:12px;padding:12px 15px;font-size:13.5px;color:var(--mut);background:rgba(255,255,255,.02);flex:1;min-width:180px}
.trig div b{color:var(--ink);display:block;margin-bottom:3px}
.proof{border:1px dashed var(--line2);border-radius:16px;padding:26px;text-align:center;background:radial-gradient(500px 200px at 50% 0,rgba(42,157,143,.1),transparent)}
.proof .ph{font-size:13px;color:var(--dim)}
.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line2);border-radius:30px;padding:7px 15px;font-size:13px;color:var(--mut)}
#bar{position:fixed;left:0;top:0;height:3px;z-index:6;width:0;background:linear-gradient(90deg,var(--gold),var(--champ),var(--gold2));transition:width .45s cubic-bezier(.4,0,.2,1)}
#brand{position:fixed;top:14px;left:22px;z-index:6}#brand img{height:28px;display:block;opacity:.96}
#count{position:fixed;top:18px;right:22px;z-index:6;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:1px}
#nav{position:fixed;bottom:18px;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:center;gap:8px}
#dots{display:flex;gap:6px;margin:0 12px;flex-wrap:wrap;max-width:60vw;justify-content:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line2);cursor:pointer;transition:.3s}
.dot.on{background:var(--gold2);width:20px;border-radius:6px}
.navb{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:rgba(16,42,48,.7);color:var(--ink);font-size:16px;cursor:pointer;backdrop-filter:blur(6px)}
.navb:hover{border-color:var(--gold2);background:rgba(42,157,143,.2)}
</style>
</head>
<body>
<div id="bgwrap"><div class="orb a"></div><div class="orb b"></div></div>
<div id="bar"></div>
<div id="brand"><img src="icb-lockup.png" alt="ICBARI"></div>
<div id="count"></div>
<div id="stage"></div>
<div id="nav"><button class="navb" onclick="prev()">‹</button><div id="dots"></div><button class="navb" onclick="next()">›</button></div>

 robot:'<rect x="5" y="8" width="14" height="10" rx="2"/><path d="M12 8V4M9 4h6"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/><path d="M3 12v3M21 12v3"/>',
 cal:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 9h16M8 3v4M16 3v4"/><path d="M9 14l2 2 4-4"/>',

 team:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M15 20a5 5 0 0 1 6-4"/>',
 chat:'<path d="M4 5h16v11H9l-4 4z" transform="translate(0 -1)"/><path d="M8 9h8M8 12h5"/>',

};
function ic(n){return '<svg class="i" viewBox="0 0 24 24">'+(ICONS[n]||ICONS.check)+'</svg>';}
function icDot(n){return '<svg viewBox="0 0 24 24">'+(ICONS[n]||ICONS.check)+'</svg>';}
var JOURNEY=[
 {ic:'chat',label:'Contato',desc:'a pessoa chega com uma dúvida ou uma dor'},
 {ic:'steth',label:'Consulta',desc:'avaliação com o cirurgião, plano claro'},

 {ic:'robot',label:'Cirurgia',desc:'vídeo e robótica, hospital acreditado'},
 {ic:'heart',label:'Acompanhamento',desc:'nutri, psico e retornos no pós'}
];

var SDR_SLIDES=[
 {layout:'cover',kicker:'Guia de Condução · SDR',title:'A ligação que abre<br>uma <span class="grad">nova vida</span>.',sub:'Este é o seu guia durante a ligação ou o vídeo com o paciente. Siga os passos, use o que está escrito e conduza a pessoa até o próximo passo: a consulta de avaliação.',foot:'Setas ‹ › para navegar'},
 {layout:'flow',tag:'Condução · SDR',n:'1',title:'Abertura acolhedora',obj:'Criar conexão em segundos e ganhar permissão para conduzir. Tom sereno, sem pedir "2 minutinhos".',
   diga:['<b>Anúncio/Instagram:</b> "Oi [nome]! Aqui é o/a [você] da ICBARI. Vi que você buscou sobre [procedimento]. Posso te fazer duas perguntas rápidas pra te orientar do jeito certo?"','<b>Indicação:</b> "Quem me passou seu contato disse que você quer resolver [queixa]. Deixa eu te entender melhor pra já te direcionar."'],
   pergunte:['Você é aqui de Brasília mesmo?','Como prefere que eu te chame?'],
   prox:'Emende direto na próxima etapa, sem esperar "pode falar?".'},
 {layout:'photo',kicker:'O que mostrar no vídeo',title:'A clínica que caminha ao seu lado.',body:'Se estiver em vídeo, mostre isto ao paciente: a ICBARI transforma vidas com acompanhamento multidisciplinar (nutricionista, psicóloga e endocrinologista), além da balança. Aqui ninguém opera e abandona.',img:'img/consulta.webp',cap:'Dr. Wander Carvalho · avaliação na ICBARI'},
 {layout:'spin',tag:'Condução · SDR',title:'Diagnóstico com SPIN',sub:'Pergunte com empatia, sem diagnosticar. Reaja ao que a pessoa disser, usando as palavras dela.',items:[
   {k:'S',t:'Situação',q:'"Me conta com suas palavras: o que você está sentindo ou quer resolver?"'},
   {k:'P',t:'Problema',q:'"Há quanto tempo? O que mais te incomoda nisso hoje?"'},
   {k:'I',t:'Implicação',q:'"E deixar como está te custa o quê? Costuma melhorar sozinho esperando?"'},
   {k:'N',t:'Necessidade',q:'"Se um cirurgião avaliasse e a clínica cuidasse de tudo pra você, isso ajudaria?"'}]},
 {layout:'bant',tag:'Condução · SDR',title:'Alinhamento antes de agendar',sub:'Confirme na conversa (sem interrogatório) e anote no CRM. É o que o Closer vai receber.',items:[
   {k:'P',t:'Perfil',q:'Tem sobrepeso/obesidade ou queixa digestiva que atrapalha a rotina?'},
   {k:'D',t:'Dor / Momento',q:'Reconhece o problema e quer resolver agora, não daqui a um ano?'},
   {k:'A',t:'Autoridade',q:'É quem decide? Quer trazer alguém da família na consulta?'},
   {k:'$',t:'Convênio',q:'Vai ser por convênio ou particular? (sem prometer cobertura)'}]},
 {layout:'journey',kicker:'A jornada que você apresenta',title:'Do primeiro oi ao acompanhamento.',steps:JOURNEY},
 {layout:'authority',kicker:'Autoridade que gera confiança',title:'Dr. Wander Carvalho',body:'Cirurgião bariátrico e do aparelho digestivo. Emagrecimento com acompanhamento multidisciplinar e ganho de massa magra, com seguimento a longo prazo. Use isso pra dar segurança à pessoa.',img:'img/dr-wander.webp',badges:[{b:'200+',t:'vidas transformadas'},{b:'120+',t:'avaliações 5 estrelas'},{b:'Vídeo e robótica',t:'técnicas modernas'}]},
 {layout:'flow',tag:'Condução · SDR',n:'2',title:'Conversão para a consulta',obj:'Este é o objetivo do SDR. Não vender a cirurgia, e sim marcar a avaliação com o cirurgião.',
   diga:['"Pelo que você me contou, o passo certo é uma consulta de avaliação com o nosso cirurgião. É nela que ele te examina, tira suas dúvidas e, se for o caso, indica o procedimento. E a clínica marca todos os exames pra você."','<b>Preço:</b> "O valor da cirurgia o médico define na consulta, depende do seu caso. Muitos parcelam em até 12x."'],
   pergunte:['"Prefere amanhã 10h ou 16h?"'],
   checar:['2 opções de horário','confirmar e-mail e WhatsApp'],

var SLIDES=TRACK==='sdr'?SDR_SLIDES:CLOSER_SLIDES;

function R(s){var L=s.layout;
 if(L==='cover')return `<div class="center"><img src="icb-lockup.png" class="anim d1" style="height:72px;margin-bottom:6px" alt="ICBARI"><div class="anim d2 kick">${s.kicker}</div><h1 class="big anim d3">${s.title}</h1><p class="lead anim d4 mt24">${s.sub}</p><div class="anim d5 mt30 pill">${arrow()} ${s.foot}</div></div>`;
 if(L==='big')return `<div><div class="anim d1 kick">${s.kicker}</div><h1 class="big anim d2">${s.title}</h1><p class="lead anim d3 mt24">${s.sub}</p></div>`;
 if(L==='flow')return `<div><div class="anim d1"><span class="gtag">${s.tag}</span></div>
   <div class="flowhead anim d2"><div class="fnum">${s.n}</div><h2 class="t" style="margin:0">${s.title}</h2></div>
   <div class="obj anim d2"><b>Objetivo:</b> ${s.obj}</div>
   <div class="two">
     <div class="blk anim d3"><h4>Diga</h4>${s.diga.map(function(x){return `<div class="say">${x}</div>`;}).join('')}</div>
     <div class="blk anim d4">${s.pergunte?`<h4>Pergunte</h4><ul class="ask">${s.pergunte.map(function(x){return `<li>${x}</li>`;}).join('')}</ul>`:''}${s.checar?`<h4 style="margin-top:${s.pergunte?'16px':'0'}">Confira</h4><div class="chkrow">${s.checar.map(function(x){return `<span class="chip2">✓ ${x}</span>`;}).join('')}</div>`:''}</div>
   </div>
   ${s.prox?`<div class="prox anim d5">${arrow()} ${s.prox}</div>`:''}</div>`;
 if(L==='spin'||L==='bant')return `<div><div class="anim d1"><span class="gtag">${s.tag}</span></div><h2 class="t anim d2">${s.title}</h2><p class="lead anim d2 mt8">${s.sub}</p>
   <div class="quad">${s.items.map(function(q,i){return `<div class="qbox anim d${Math.min(i+3,6)}"><div class="k">${q.k}</div><h4>${q.t}</h4><p class="qq">${q.q}</p></div>`;}).join('')}</div></div>`;
 if(L==='photo')return `<div class="row"><div class="col anim d1"><div class="kick">${s.kicker}</div><h2 class="t">${s.title}</h2><p class="lead mt16">${s.body}</p></div>
   <div class="col anim d3"><div class="photo">${s.img?`<img src="${s.img}" alt="">`:''}<div class="ov"></div>${s.cap?`<div class="cap">${s.cap}</div>`:''}</div></div></div>`;
 if(L==='authority')return `<div class="row"><div class="col anim d2" style="max-width:320px;flex:0 0 300px"><div class="pcard"><img src="${s.img}" alt="Dr. Wander Carvalho"></div></div>
   <div class="col anim d1"><div class="kick">${s.kicker}</div><h2 class="t">${s.title}</h2><p class="lead mt16">${s.body}</p>
   <div class="badges">${s.badges.map(function(b){return `<div class="badge"><b>${b.b}</b> ${b.t}</div>`;}).join('')}</div></div></div>`;
 if(L==='hospitals')return `<div><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2><p class="lead anim d2 mt16">${s.body}</p>
   <div class="hosp">${s.logos.map(function(l,i){return `<div class="hc anim d${i+3}"><img src="${l.src}" alt="${l.alt}"></div>`;}).join('')}</div>
   <p class="anim d5" style="margin-top:14px;font-size:12px;color:var(--dim)">Confirme os hospitais/parcerias vigentes antes de apresentar ao paciente.</p></div>`;
 if(L==='journey')return `<div><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2>
   <div class="jrn anim d3">${s.steps.map(function(n,i){return `<div class="jnode"><div class="jdot">${icDot(n.ic)}</div><b>${i+1}. ${n.label}</b><span>${n.desc}</span></div>`;}).join('')}</div></div>`;
 if(L==='vstack')return `<div><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2>
   <div class="vstack">${s.items.map(function(v,i){return `<div class="vi anim d${Math.min(i+3,7)}"><span class="ck"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg></span><p><b>${v.b}</b> <span>${v.s}</span></p></div>`;}).join('')}</div></div>`;
 if(L==='system')return `<div class="row"><div class="col"><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2><p class="lead anim d3 mt16">${s.body}</p></div>
   <div class="col anim d4"><div class="sys"><div class="bar"><i></i><i></i><i></i><b>Jornada do Paciente · ICBARI</b></div><div class="body">${s.checklist.map(function(c){return `<div class="chk ${c.on?'on':''}"><span class="bx">${c.on?'<svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>':''}</span><span>${c.t}</span><span class="tag">${c.tag}</span></div>`;}).join('')}</div></div></div></div>`;
 if(L==='objections')return `<div><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2>
   <div class="cards" style="grid-template-columns:1fr">${s.items.map(function(it,i){return `<div class="card anim d${i+3}" style="padding:16px 18px"><h3 style="color:var(--gold2)">${it.o}</h3><p style="font-size:14.5px;color:var(--ink);opacity:.92">${it.r}</p></div>`;}).join('')}</div></div>`;
 if(L==='close')return `<div class="center"><img src="icb-lockup.png" class="anim d1" style="height:54px;margin-bottom:18px;opacity:.9" alt="ICBARI"><h1 class="big anim d2">${s.title}</h1><p class="lead anim d3 mt24">${s.sub}</p></div>`;
 return '<div><h2 class="t">'+(s.title||'')+'</h2></div>';
}
function arrow(){return '<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:var(--gold2);stroke-width:1.8;fill:none;vertical-align:middle"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';}
var i=0,dotsEl=document.getElementById('dots');
dotsEl.innerHTML=SLIDES.map(function(_,k){return '<span class="dot" onclick="goTo('+k+')"></span>';}).join('');
var dots=[].slice.call(document.querySelectorAll('.dot'));
function render(){document.getElementById('stage').innerHTML='<div class="slide on">'+R(SLIDES[i])+'</div>';
 document.getElementById('count').textContent=String(i+1).padStart(2,'0')+' / '+String(SLIDES.length).padStart(2,'0');
 document.getElementById('bar').style.width=(i/(SLIDES.length-1)*100)+'%';
 dots.forEach(function(d,k){d.classList.toggle('on',k===i);});}
function next(){if(i<SLIDES.length-1){i++;render();}}
function prev(){if(i>0){i--;render();}}
function goTo(k){i=k;render();}
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){next();e.preventDefault();}else if(e.key==='ArrowLeft'||e.key==='PageUp'){prev();e.preventDefault();}else if(e.key==='Home'){goTo(0);}else if(e.key==='End'){goTo(SLIDES.length-1);}});
document.getElementById('stage').addEventListener('click',function(e){if(e.target.closest('a,button'))return;var r=window.innerWidth;if(e.clientX<r*0.26)prev();else next();});
render();
</script>
