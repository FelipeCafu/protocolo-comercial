<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apresentação SDR · ICBARI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0d0b; --bg2:#141210; --panel:#1b1813; --panel2:#16130f;
  --line:rgba(201,168,100,.20); --line2:rgba(201,168,100,.38);
  --ink:#f5f1e9; --mut:#b7ac95; --dim:#8a7f6b;
  --gold:#c3a45e; --gold2:#e0c485; --champ:#efdcae; --warm:#e8a765; --rose:#e08a86;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
#bgwrap{position:fixed;inset:0;z-index:0;overflow:hidden;background:
   radial-gradient(1200px 720px at 80% -10%, rgba(195,164,94,.20), transparent 60%),
   radial-gradient(900px 620px at 6% 110%, rgba(224,196,133,.10), transparent 55%),
   linear-gradient(160deg,#0e0d0b,#141210 60%,#0d0c0a)}
#bgwrap::after{content:"";position:absolute;inset:0;opacity:.45;
   background-image:linear-gradient(rgba(201,168,100,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,100,.05) 1px,transparent 1px);
   background-size:56px 56px;-webkit-mask-image:radial-gradient(120% 120% at 50% 0%,#000 40%,transparent 78%)}
.orb{position:absolute;border-radius:50%;filter:blur(64px);opacity:.5;pointer-events:none}
.orb.a{width:500px;height:500px;top:-150px;right:-90px;background:radial-gradient(circle,rgba(195,164,94,.5),transparent 70%)}
.orb.b{width:420px;height:420px;bottom:-160px;left:-120px;background:radial-gradient(circle,rgba(224,196,133,.32),transparent 70%)}
#stage{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;padding:6vh 6vw}
.slide{display:none;width:min(1120px,94vw);max-height:90vh;overflow:auto;scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}
.slide.on{display:block}
.anim{opacity:0;transform:translateY(18px);animation:up .7s cubic-bezier(.2,.75,.25,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.d1{animation-delay:.06s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}.d4{animation-delay:.36s}.d5{animation-delay:.48s}.d6{animation-delay:.6s}.d7{animation-delay:.72s}
.kick{display:inline-flex;align-items:center;gap:10px;font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold2)}
.kick::before{content:"";width:26px;height:1.5px;background:linear-gradient(90deg,var(--gold),transparent)}
h1.big{font-family:var(--serif);font-weight:600;font-size:clamp(34px,6.2vw,78px);line-height:1.02;letter-spacing:-.5px;margin:18px 0 0}
h2.t{font-family:var(--serif);font-weight:600;font-size:clamp(26px,4.2vw,50px);line-height:1.08;letter-spacing:-.3px;margin:14px 0 0}
.lead{font-size:clamp(15px,1.7vw,20px);line-height:1.6;color:var(--mut);max-width:62ch}
.grad{background:linear-gradient(100deg,var(--gold2),var(--champ) 55%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.warmx{color:var(--warm)}
.row{display:flex;gap:34px;align-items:center;flex-wrap:wrap}
.col{flex:1;min-width:300px}
.center{text-align:center;display:flex;flex-direction:column;align-items:center}
.center .lead{margin-left:auto;margin-right:auto}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt34{margin-top:34px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:30px}
.card{position:relative;border:1px solid var(--line);border-radius:18px;padding:22px 20px;background:linear-gradient(180deg,rgba(27,24,19,.8),rgba(22,19,15,.6));backdrop-filter:blur(6px);overflow:hidden}
.card .ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(195,164,94,.24),rgba(224,196,133,.10));border:1px solid var(--line2);margin-bottom:14px}
.card h3{font-family:var(--sans);font-size:17px;font-weight:600;margin:0 0 6px}
.card p{font-size:13.5px;line-height:1.55;color:var(--mut);margin:0}
.card .edge{position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--gold),var(--champ))}
svg.i{width:24px;height:24px;stroke:var(--gold2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.jrn{position:relative;margin-top:44px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.jrn::before{content:"";position:absolute;left:6%;right:6%;top:26px;height:2px;background:linear-gradient(90deg,var(--gold),var(--champ),var(--gold2))}
.jnode{position:relative;text-align:center;padding:0 4px}
.jdot{width:54px;height:54px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 30%,#241f16,#14110c);border:1.5px solid var(--line2);box-shadow:0 8px 26px rgba(0,0,0,.5),0 0 0 6px rgba(14,13,11,.92)}
.jdot svg{width:24px;height:24px;stroke:var(--gold2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.jnode b{display:block;margin-top:14px;font-size:14px;font-weight:600}
.jnode span{display:block;margin-top:4px;font-size:12px;color:var(--mut);line-height:1.45}
@media(max-width:820px){.jrn{grid-template-columns:1fr 1fr;gap:22px}.jrn::before{display:none}}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px}
.cmp .side{border:1px solid var(--line);border-radius:18px;padding:22px}
.cmp .bad{background:linear-gradient(180deg,rgba(224,138,134,.08),transparent)}
.cmp .good{background:linear-gradient(180deg,rgba(195,164,94,.12),transparent);border-color:var(--line2)}
.cmp h4{margin:0 0 12px;font-size:14px;letter-spacing:.5px;text-transform:uppercase;font-weight:600}
.cmp .bad h4{color:var(--rose)}.cmp .good h4{color:var(--gold2)}
.cmp li{list-style:none;padding:8px 0 8px 28px;position:relative;font-size:14px;line-height:1.5;color:var(--mut);border-top:1px solid var(--line)}
.cmp li:first-child{border-top:0}
.cmp li::before{position:absolute;left:0;top:7px;font-size:14px}
.cmp .bad li::before{content:"✕";color:var(--rose)}
.cmp .good li::before{content:"✓";color:var(--gold2)}
@media(max-width:760px){.cmp,.jrn{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:22px;margin-top:38px}
.stat b{font-family:var(--serif);font-size:clamp(38px,5.4vw,66px);font-weight:600;line-height:1;display:block}
.stat span{display:block;margin-top:10px;font-size:13.5px;color:var(--mut);line-height:1.45}
.sys{border:1px solid var(--line2);border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#1a1712,#131009);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.sys .bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.sys .bar i{width:10px;height:10px;border-radius:50%;background:#3a3226;display:block}
.sys .bar b{margin-left:10px;font-size:12.5px;color:var(--mut);font-weight:500}
.sys .body{padding:18px 20px}
.chk{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.chk:last-child{border-bottom:0}
.chk .bx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:none}
.chk.on .bx{background:linear-gradient(135deg,var(--gold),var(--champ));border-color:transparent}
.chk.on .bx svg{width:12px;height:12px;stroke:#1a1305;stroke-width:2.6;fill:none}
.chk .tag{margin-left:auto;font-size:11px;padding:2px 10px;border-radius:20px;border:1px solid var(--line2);color:var(--mut)}
.chk.on .tag{color:var(--gold2);border-color:rgba(224,196,133,.5)}
.proof{border:1px dashed var(--line2);border-radius:18px;padding:30px;text-align:center;background:radial-gradient(500px 200px at 50% 0,rgba(195,164,94,.10),transparent)}
.proof .ph{font-size:13px;color:var(--dim);letter-spacing:.4px}
.qt{font-family:var(--serif);font-size:clamp(22px,3.4vw,40px);line-height:1.22;font-weight:500;max-width:24ch;margin:0 auto}
.trig{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.trig div{border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:13.5px;color:var(--mut);background:rgba(255,255,255,.02);flex:1;min-width:180px}
.trig div b{color:var(--ink);display:block;margin-bottom:3px;font-size:13.5px}
.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line2);border-radius:30px;padding:7px 15px;font-size:13px;color:var(--mut)}
.vstack{margin-top:26px}
.vstack .vi{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.vstack .vi:first-child{border-top:0}
.vstack .vi .ck{width:26px;height:26px;border-radius:8px;flex:none;background:linear-gradient(135deg,rgba(195,164,94,.25),rgba(224,196,133,.1));border:1px solid var(--line2);display:flex;align-items:center;justify-content:center}
.vstack .vi .ck svg{width:14px;height:14px;stroke:var(--gold2);stroke-width:2;fill:none}
.vstack .vi p{margin:0;font-size:14.5px;line-height:1.5}
.vstack .vi p b{color:var(--ink)}.vstack .vi p span{color:var(--mut)}
#bar{position:fixed;left:0;top:0;height:3px;z-index:6;width:0;background:linear-gradient(90deg,var(--gold),var(--champ),var(--gold2));transition:width .45s cubic-bezier(.4,0,.2,1)}
#brand{position:fixed;top:14px;left:22px;z-index:6}
#brand img{height:30px;width:auto;display:block;opacity:.96}
#count{position:fixed;top:18px;right:22px;z-index:6;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:1px}
#nav{position:fixed;bottom:20px;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:center;gap:8px}
#dots{display:flex;gap:7px;margin:0 12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line2);cursor:pointer;transition:.3s}
.dot.on{background:var(--gold2);width:22px;border-radius:6px}
.navb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:rgba(27,24,19,.7);color:var(--ink);font-size:17px;cursor:pointer;backdrop-filter:blur(6px);transition:.2s}
.navb:hover{border-color:var(--gold2);background:rgba(195,164,94,.2)}
@media(max-width:640px){.trig div{min-width:140px}}
</style>
</head>
<body>
<div id="bgwrap"><div class="orb a"></div><div class="orb b"></div></div>
<div id="bar"></div>
<div id="brand"><img src="icb-lockup.png" alt="ICBARI"></div>
<div id="count"></div>
<div id="stage"></div>
<div id="nav"><button class="navb" onclick="prev()">‹</button><div id="dots"></div><button class="navb" onclick="next()">›</button></div>

   {t:'Avaliação com anestesista',on:false,tag:'próximo'},
   {t:'Marcar a cirurgia no hospital',on:false,tag:'a seguir'}]},
 {layout:'offer',kicker:'A hora da decisão',title:'O próximo passo concreto:<br><span class="grad">começar os exames</span>.',sub:'Você não pede uma assinatura no escuro. Você convida o paciente a dar o primeiro passo do tratamento, e a clínica cuida do resto.',triggers:[
   {b:'Ancore o cuidado completo',t:'Não é só a cirurgia: é a equipe, os exames, a técnica e o acompanhamento de 6 meses.'},
   {b:'Custo de adiar',t:'Cada mês parado é mais tempo com a doença progredindo e a qualidade de vida caindo.'},
   {b:'Comece agora',t:'"Posso já abrir sua jornada e a equipe marca o primeiro exame essa semana?"'}]},
 {layout:'objections',kicker:'Fechamento com empatia',title:'Acolhe, esclarece, encaminha.',items:[
   {o:'"Vou pensar."',r:'Faz sentido. Sua dúvida é sobre o procedimento, o valor ou o momento? A maioria acha que depois resolve, e o problema só cresce. Vamos dar o primeiro passo com os exames?'},
   {o:'"Medo de flacidez e de tomar vitamina pra sempre."',r:'Ninguém quer trocar remédio por suplemento. Aqui é polivitamínico e whey, com nutri por 6 meses e ganho de massa magra. Cuidamos disso desde o primeiro dia.'},
   {o:'"Preciso ver o convênio / o valor."',r:'Perfeito. Muitos parcelam em até 12x e alguns têm subsídio do plano. Já deixo a documentação pronta. Enquanto isso, começamos os exames?'}]},
 {layout:'proof',kicker:'Prova social',title:'Mostre quem voltou a viver.',note:'Espaço reservado para depoimento em vídeo ou foto de um paciente do mesmo procedimento. Prova real fecha mais que qualquer argumento.'},
 {layout:'close',title:'Bem-vindo à jornada.',sub:'Quando o paciente diz sim, ele não comprou uma cirurgia. Ele decidiu reconstruir a própria vida. Comemore isso com ele.'}
];
var SLIDES=TRACK==='sdr'?SDR_SLIDES:CLOSER_SLIDES;

function R(s){
 var L=s.layout;
 if(L==='cover')return `<div class="center">
   <img src="icb-lockup.png" alt="ICBARI" class="anim d1" style="height:74px;margin-bottom:6px">
   <div class="anim d2 kick">${s.kicker}</div>
   <h1 class="big anim d3">${s.title}</h1>
   <p class="lead anim d4 mt24">${s.sub}</p>
   <div class="anim d5 mt34 pill">${arrow()} ${s.foot}</div></div>`;
 if(L==='big')return `<div><div class="anim d1 kick">${s.kicker}</div><h1 class="big anim d2">${s.title}</h1><p class="lead anim d3 mt24">${s.sub}</p></div>`;
 if(L==='pain')return `<div><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2>
   <div class="cards">${s.points.map(function(p,i){return `<div class="card anim d${i+3}"><span class="edge"></span><div class="ico">${ic(p.ic)}</div><h3>${p.h}</h3><p>${p.p}</p></div>`;}).join('')}</div></div>`;
 if(L==='stats')return `<div><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2>
   <div class="stats">${s.stats.map(function(x,i){return `<div class="stat anim d${i+3}"><b class="grad">${x.n}</b><span>${x.t}</span></div>`;}).join('')}</div>
   <p class="anim d6" style="margin-top:30px;font-size:12px;color:var(--dim)">Fonte: playbook e avaliações públicas da ICBARI. Números para uso interno, confirme antes de publicar.</p></div>`;
 if(L==='journey')return `<div><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2>
   <div class="jrn anim d3">${s.steps.map(function(n,i){return `<div class="jnode"><div class="jdot">${icDot(n.ic)}</div><b>${i+1}. ${n.label}</b><span>${n.desc}</span></div>`;}).join('')}</div></div>`;
 if(L==='cards')return `<div><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2>
   <div class="cards">${s.cards.map(function(c,i){return `<div class="card anim d${Math.min(i+3,7)}"><div class="ico">${ic(c.ic)}</div><h3>${c.h}</h3><p>${c.p}</p></div>`;}).join('')}</div></div>`;
 if(L==='contrast')return `<div><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2>
   <div class="cmp"><div class="side bad anim d3"><h4>${s.left.h}</h4><ul style="margin:0;padding:0">${s.left.items.map(function(x){return `<li>${x}</li>`;}).join('')}</ul></div>
   <div class="side good anim d4"><h4>${s.right.h}</h4><ul style="margin:0;padding:0">${s.right.items.map(function(x){return `<li>${x}</li>`;}).join('')}</ul></div></div></div>`;
 if(L==='vstack')return `<div><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2>
   <div class="vstack">${s.items.map(function(v,i){return `<div class="vi anim d${Math.min(i+3,7)}"><span class="ck"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg></span><p><b>${v.b}</b> <span>${v.s}</span></p></div>`;}).join('')}</div></div>`;
 if(L==='system')return `<div class="row"><div class="col"><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2><p class="lead anim d3 mt16">${s.body}</p></div>
   <div class="col anim d4"><div class="sys"><div class="bar"><i></i><i></i><i></i><b>Jornada do Paciente · ICBARI</b></div>
     <div class="body">${s.checklist.map(function(c){return `<div class="chk ${c.on?'on':''}"><span class="bx">${c.on?'<svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>':''}</span><span>${c.t}</span><span class="tag">${c.tag}</span></div>`;}).join('')}</div></div></div></div>`;
 if(L==='offer')return `<div><div class="anim d1 kick">${s.kicker}</div><h1 class="big anim d2">${s.title}</h1><p class="lead anim d3 mt16">${s.sub}</p>
   <div class="trig anim d4">${s.triggers.map(function(t){return `<div><b>${t.b}</b>${t.t}</div>`;}).join('')}</div></div>`;
 if(L==='objections')return `<div><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2>
   <div class="cards" style="grid-template-columns:1fr">${s.items.map(function(it,i){return `<div class="card anim d${i+3}" style="padding:18px 20px"><h3 style="color:var(--gold2)">${it.o}</h3><p style="font-size:15px;color:var(--ink);opacity:.92">${it.r}</p></div>`;}).join('')}</div></div>`;
 if(L==='proof')return `<div class="center"><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2>
   <div class="proof anim d3 mt24" style="max-width:760px"><div style="display:flex;gap:14px;align-items:center;justify-content:center;opacity:.5"><div style="width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" style="width:26px;height:26px;stroke:var(--dim);stroke-width:1.6;fill:none"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div><div style="text-align:left"><div style="height:9px;width:120px;background:var(--line2);border-radius:6px"></div><div style="height:8px;width:80px;background:var(--line);border-radius:6px;margin-top:7px"></div></div></div><p class="ph mt16">${s.note}</p></div></div>`;
 if(L==='close')return `<div class="center"><img src="icb-lockup.png" alt="ICBARI" class="anim d1" style="height:56px;margin-bottom:20px;opacity:.9"><h1 class="big anim d2">${s.title}</h1><p class="lead anim d3 mt24">${s.sub}</p></div>`;
 return '<div><h2 class="t">'+(s.title||'')+'</h2></div>';
}
function arrow(){return '<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:var(--gold2);stroke-width:1.8;fill:none"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';}

var i=0,dotsEl=document.getElementById('dots');
dotsEl.innerHTML=SLIDES.map(function(_,k){return '<span class="dot" onclick="goTo('+k+')"></span>';}).join('');
var dots=[].slice.call(document.querySelectorAll('.dot'));
function render(){
 document.getElementById('stage').innerHTML='<div class="slide on">'+R(SLIDES[i])+'</div>';
 document.getElementById('count').textContent=String(i+1).padStart(2,'0')+' / '+String(SLIDES.length).padStart(2,'0');
 document.getElementById('bar').style.width=(i/(SLIDES.length-1)*100)+'%';
 dots.forEach(function(d,k){d.classList.toggle('on',k===i);});
}
function next(){if(i<SLIDES.length-1){i++;render();}}
function prev(){if(i>0){i--;render();}}
function goTo(k){i=k;render();}
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){next();e.preventDefault();}else if(e.key==='ArrowLeft'||e.key==='PageUp'){prev();e.preventDefault();}else if(e.key==='Home'){goTo(0);}else if(e.key==='End'){goTo(SLIDES.length-1);}});
document.getElementById('stage').addEventListener('click',function(e){if(e.target.closest('a,button'))return;var r=window.innerWidth;if(e.clientX<r*0.28)prev();else next();});
render();
</script>
</body>
</html>
