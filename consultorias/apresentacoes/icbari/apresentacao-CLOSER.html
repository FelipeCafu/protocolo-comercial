<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apresentação Closer · ICBARI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d12; --bg2:#0e131a; --panel:#141a22; --panel2:#171e28;
  --line:rgba(140,180,240,.16); --line2:rgba(140,180,240,.28);
  --ink:#eef3f9; --mut:#9aa8bd; --dim:#6f7d92;
  --blue:#3f8ef0; --blue2:#69abff; --cyan:#49d6d0; --mint:#5fe6bf; --amber:#ffb267; --rose:#ff7a9c;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
/* backdrop */
#bgwrap{position:fixed;inset:0;z-index:0;overflow:hidden;background:
   radial-gradient(1200px 700px at 78% -8%, rgba(63,142,240,.20), transparent 60%),
   radial-gradient(900px 600px at 8% 108%, rgba(73,214,208,.12), transparent 55%),
   linear-gradient(160deg,#0a0d12,#0e131a 60%,#0b0f15)}
#bgwrap::after{content:"";position:absolute;inset:0;opacity:.5;
   background-image:linear-gradient(rgba(140,180,240,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(140,180,240,.05) 1px,transparent 1px);
   background-size:54px 54px;-webkit-mask-image:radial-gradient(120% 120% at 50% 0%,#000 40%,transparent 78%)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;pointer-events:none}
.orb.a{width:480px;height:480px;top:-140px;right:-80px;background:radial-gradient(circle,rgba(63,142,240,.55),transparent 70%)}
.orb.b{width:420px;height:420px;bottom:-160px;left:-120px;background:radial-gradient(circle,rgba(73,214,208,.4),transparent 70%)}
#stage{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;padding:6vh 6vw}
.slide{display:none;width:min(1120px,94vw);max-height:90vh;overflow:auto;scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}
.slide.on{display:block}
.anim{opacity:0;transform:translateY(18px);animation:up .7s cubic-bezier(.2,.75,.25,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.d1{animation-delay:.06s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}.d4{animation-delay:.36s}.d5{animation-delay:.48s}.d6{animation-delay:.6s}.d7{animation-delay:.72s}
/* type */
.kick{display:inline-flex;align-items:center;gap:10px;font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--blue2)}
.kick::before{content:"";width:26px;height:1.5px;background:linear-gradient(90deg,var(--blue),transparent)}
h1.big{font-family:var(--serif);font-weight:600;font-size:clamp(34px,6.2vw,78px);line-height:1.02;letter-spacing:-.5px;margin:18px 0 0}
h2.t{font-family:var(--serif);font-weight:600;font-size:clamp(26px,4.2vw,50px);line-height:1.08;letter-spacing:-.3px;margin:14px 0 0}
.lead{font-size:clamp(15px,1.7vw,20px);line-height:1.6;color:var(--mut);max-width:60ch}
.grad{background:linear-gradient(100deg,var(--blue2),var(--cyan) 60%,var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.warm{color:var(--amber)}
.em{color:var(--ink);font-weight:600}
/* layout helpers */
.row{display:flex;gap:34px;align-items:center;flex-wrap:wrap}
.col{flex:1;min-width:300px}
.center{text-align:center;display:flex;flex-direction:column;align-items:center}
.center .lead{margin-left:auto;margin-right:auto}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt34{margin-top:34px}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:30px}
.card{position:relative;border:1px solid var(--line);border-radius:18px;padding:22px 20px;background:linear-gradient(180deg,rgba(23,30,40,.75),rgba(18,23,31,.6));backdrop-filter:blur(6px);overflow:hidden}
.card .ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(63,142,240,.22),rgba(73,214,208,.12));border:1px solid var(--line2);margin-bottom:14px}
.card h3{font-family:var(--sans);font-size:17px;font-weight:600;margin:0 0 6px}
.card p{font-size:13.5px;line-height:1.55;color:var(--mut);margin:0}
.card .edge{position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--blue),var(--cyan))}
svg.i{width:24px;height:24px;stroke:var(--blue2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* journey */
.jrn{position:relative;margin-top:44px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.jrn::before{content:"";position:absolute;left:6%;right:6%;top:26px;height:2px;background:linear-gradient(90deg,var(--blue),var(--cyan),var(--mint))}
.jnode{position:relative;text-align:center;padding:0 4px}
.jdot{width:54px;height:54px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 30%,#1b2530,#10151c);border:1.5px solid var(--line2);box-shadow:0 8px 26px rgba(0,0,0,.5),0 0 0 6px rgba(10,13,18,.9)}
.jdot svg{width:24px;height:24px;stroke:var(--blue2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.jnode b{display:block;margin-top:14px;font-size:14px;font-weight:600}
.jnode span{display:block;margin-top:4px;font-size:12px;color:var(--mut);line-height:1.45}
@media(max-width:820px){.jrn{grid-template-columns:1fr 1fr;gap:22px}.jrn::before{display:none}}
/* contrast */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px}
.cmp .side{border:1px solid var(--line);border-radius:18px;padding:22px}
.cmp .bad{background:linear-gradient(180deg,rgba(255,122,156,.08),transparent)}
.cmp .good{background:linear-gradient(180deg,rgba(73,214,208,.10),transparent);border-color:var(--line2)}
.cmp h4{margin:0 0 12px;font-size:14px;letter-spacing:.5px;text-transform:uppercase;font-weight:600}
.cmp .bad h4{color:var(--rose)}.cmp .good h4{color:var(--mint)}
.cmp li{list-style:none;padding:8px 0 8px 28px;position:relative;font-size:14px;line-height:1.5;color:var(--mut);border-top:1px solid var(--line)}
.cmp li:first-child{border-top:0}
.cmp li::before{position:absolute;left:0;top:7px;font-size:14px}
.cmp .bad li::before{content:"✕";color:var(--rose)}
.cmp .good li::before{content:"✓";color:var(--mint)}
@media(max-width:760px){.cmp,.jrn{grid-template-columns:1fr}}
/* stat */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:18px;margin-top:34px}
.stat b{font-family:var(--serif);font-size:clamp(34px,5vw,60px);font-weight:600;line-height:1;display:block}
.stat span{display:block;margin-top:8px;font-size:13.5px;color:var(--mut);line-height:1.4}
/* system mock */
.sys{border:1px solid var(--line2);border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#121821,#0e131a);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.sys .bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.sys .bar i{width:10px;height:10px;border-radius:50%;background:#2a3441;display:block}
.sys .bar b{margin-left:10px;font-size:12.5px;color:var(--mut);font-weight:500}
.sys .body{padding:18px 20px}
.chk{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.chk:last-child{border-bottom:0}
.chk .bx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:none}
.chk.on .bx{background:linear-gradient(135deg,var(--blue),var(--cyan));border-color:transparent}
.chk.on .bx svg{width:12px;height:12px;stroke:#04121f;stroke-width:2.4;fill:none}
.chk .tag{margin-left:auto;font-size:11px;padding:2px 10px;border-radius:20px;border:1px solid var(--line2);color:var(--mut)}
.chk.on .tag{color:var(--mint);border-color:rgba(95,230,191,.4)}
/* proof */
.proof{border:1px dashed var(--line2);border-radius:18px;padding:30px;text-align:center;background:radial-gradient(500px 200px at 50% 0,rgba(63,142,240,.08),transparent)}
.proof .ph{font-size:13px;color:var(--dim);letter-spacing:.4px}
.qt{font-family:var(--serif);font-size:clamp(22px,3.2vw,38px);line-height:1.25;font-weight:500;max-width:22ch}
/* offer */
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:15px 26px;border-radius:40px;font-weight:600;font-size:16px;color:#04121f;background:linear-gradient(100deg,var(--blue2),var(--cyan));box-shadow:0 16px 40px rgba(63,142,240,.35)}
.trig{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.trig div{border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:13.5px;color:var(--mut);background:rgba(255,255,255,.02);flex:1;min-width:180px}
.trig div b{color:var(--ink);display:block;margin-bottom:3px;font-size:13.5px}
.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line2);border-radius:30px;padding:7px 15px;font-size:13px;color:var(--mut)}
.note{margin-top:22px;font-size:12.5px;color:var(--dim)}
/* chrome */
#bar{position:fixed;left:0;top:0;height:3px;z-index:6;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan),var(--mint));transition:width .45s cubic-bezier(.4,0,.2,1)}
#brand{position:fixed;top:16px;left:22px;z-index:6;display:flex;align-items:center;gap:10px}
#brand .mk{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center}
#brand .mk svg{width:15px;height:15px;stroke:var(--blue2);stroke-width:2;fill:none}
#brand b{font-family:var(--serif);font-size:15px;letter-spacing:.5px}
#brand span{font-size:10.5px;color:var(--dim);letter-spacing:2px;text-transform:uppercase}
#count{position:fixed;top:18px;right:22px;z-index:6;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:1px}
#nav{position:fixed;bottom:20px;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:center;gap:8px}
#dots{display:flex;gap:7px;margin:0 12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line2);cursor:pointer;transition:.3s}
.dot.on{background:var(--blue2);width:22px;border-radius:6px}
.navb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:rgba(20,26,34,.7);color:var(--ink);font-size:17px;cursor:pointer;backdrop-filter:blur(6px);transition:.2s}
.navb:hover{border-color:var(--blue2);background:rgba(63,142,240,.18)}
.kbd{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
@media(max-width:640px){#brand span{display:none}.trig div{min-width:140px}}
</style>
</head>
<body>

<div id="bar"></div>
<div id="brand"><div class="mk"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg></div><div><b>ICBARI</b><br><span>Cirurgia Digestiva</span></div></div>
<div id="count"></div>
<div id="stage"></div>
<div id="nav"><button class="navb" onclick="prev()">‹</button><div id="dots"></div><button class="navb" onclick="next()">›</button></div>
<script>

/* ---------- icon set ---------- */

/* ---------- SLIDES ---------- */

 {layout:'cover',kicker:'Apresentação Comercial · SDR',title:'Antes da cirurgia,<br>vem o <span class="grad">cuidado</span>.',sub:'A ICBARI existe pra tirar a pessoa do medo e da dúvida, e colocar ela no caminho certo. O seu papel começa aqui: transformar um contato numa consulta.',foot:'Use ‹ › ou as setas do teclado'},

 {layout:'cards',kicker:'Por que confiar na ICBARI',title:'O que dá segurança pra pessoa dizer sim à consulta.',cards:[

 {layout:'offer',kicker:'A hora da decisão',title:'O próximo passo concreto:<br><span class="grad">começar os exames</span>.',sub:'Você não pede uma assinatura no escuro. Você convida o paciente a dar o primeiro passo do tratamento, e a clínica cuida do resto.',triggers:[
   {b:'Ancore o cuidado completo',t:'Não é só a cirurgia: é a condução, os exames, a técnica e o pós.'},
   {b:'Custo de adiar',t:'Cada mês parado é mais tempo convivendo com o problema.'},
   {b:'Comece agora',t:'"Posso já abrir sua jornada e a equipe marca o primeiro exame essa semana?"'}]},
 {layout:'objections',kicker:'Fechamento com empatia',title:'Acolhe, esclarece, encaminha.',items:[
   {o:'"Vou pensar."',r:'Faz sentido. Sua dúvida é sobre o procedimento, o valor ou o momento? Assim eu te ajudo a decidir com clareza.'},
   {o:'"Tenho medo da cirurgia."',r:'É natural. Por isso a gente conduz passo a passo e usa técnica minimamente invasiva. O que mais te assusta?'},
   {o:'"Preciso ver o convênio."',r:'Perfeito, já deixo a documentação pronta pra autorização. Enquanto isso, começamos os exames?'}]},
 {layout:'proof',kicker:'Prova social',title:'Mostre quem já passou por isso e voltou a viver.',note:'Espaço reservado para depoimento em vídeo ou foto de um paciente do mesmo procedimento. Prova real fecha mais que qualquer argumento.'},
 {layout:'close',title:'Bem-vindo à jornada.',sub:'Quando o paciente diz sim, ele não comprou uma cirurgia. Ele decidiu cuidar da própria saúde. Comemore isso com ele.'}
];
var SLIDES=TRACK==='sdr'?SDR_SLIDES:CLOSER_SLIDES;

/* ---------- renderers ---------- */
function R(s){
 var L=s.layout;
 if(L==='cover')return `<div class="center">
   <div class="anim d1 kick">${s.kicker}</div>
   <h1 class="big anim d2">${s.title}</h1>
   <p class="lead anim d3 mt24">${s.sub}</p>
   <div class="anim d4 mt34 pill">${icDotBtn()} ${s.foot}</div></div>`;
 if(L==='big')return `<div>
   <div class="anim d1 kick">${s.kicker}</div>
   <h1 class="big anim d2">${s.title}</h1>
   <p class="lead anim d3 mt24">${s.sub}</p></div>`;
 if(L==='pain')return `<div>
   <div class="anim d1 kick">${s.kicker}</div>
   <h2 class="t anim d2">${s.title}</h2>
   <div class="cards">${s.points.map(function(p,i){return `<div class="card anim d${i+3}"><span class="edge"></span><div class="ico">${ic(p.ic)}</div><h3>${p.h}</h3><p>${p.p}</p></div>`;}).join('')}</div></div>`;
 if(L==='journey')return `<div>
   <div class="anim d1 kick">${s.kicker}</div>
   <h2 class="t anim d2">${s.title}</h2>
   <div class="jrn anim d3">${s.steps.map(function(n,i){return `<div class="jnode"><div class="jdot">${icDot(n.ic)}</div><b>${i+1}. ${n.label}</b><span>${n.desc}</span></div>`;}).join('')}</div></div>`;
 if(L==='cards')return `<div>
   <div class="anim d1 kick">${s.kicker}</div>
   <h2 class="t anim d2">${s.title}</h2>
   <div class="cards">${s.cards.map(function(c,i){return `<div class="card anim d${Math.min(i+3,7)}"><div class="ico">${ic(c.ic)}</div><h3>${c.h}</h3><p>${c.p}</p></div>`;}).join('')}</div></div>`;
 if(L==='contrast')return `<div>
   <div class="anim d1 kick">${s.kicker}</div>
   <h2 class="t anim d2">${s.title}</h2>
   <div class="cmp">
     <div class="side bad anim d3"><h4>${s.left.h}</h4><ul style="margin:0;padding:0">${s.left.items.map(function(x){return `<li>${x}</li>`;}).join('')}</ul></div>
     <div class="side good anim d4"><h4>${s.right.h}</h4><ul style="margin:0;padding:0">${s.right.items.map(function(x){return `<li>${x}</li>`;}).join('')}</ul></div>
   </div></div>`;
 if(L==='system')return `<div class="row">
   <div class="col"><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2><p class="lead anim d3 mt16">${s.body}</p></div>
   <div class="col anim d4"><div class="sys"><div class="bar"><i></i><i></i><i></i><b>Jornada do Paciente · ICBARI</b></div>
     <div class="body">${s.checklist.map(function(c){return `<div class="chk ${c.on?'on':''}"><span class="bx">${c.on?'<svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>':''}</span><span>${c.t}</span><span class="tag">${c.tag}</span></div>`;}).join('')}</div></div></div></div>`;
 if(L==='offer')return `<div>
   <div class="anim d1 kick">${s.kicker}</div>
   <h1 class="big anim d2">${s.title}</h1>
   <p class="lead anim d3 mt16">${s.sub}</p>
   <div class="trig anim d4">${s.triggers.map(function(t){return `<div><b>${t.b}</b>${t.t}</div>`;}).join('')}</div></div>`;
 if(L==='objections')return `<div>
   <div class="anim d1 kick">${s.kicker}</div>
   <h2 class="t anim d2">${s.title}</h2>
   <div class="cards" style="grid-template-columns:1fr">${s.items.map(function(it,i){return `<div class="card anim d${i+3}" style="padding:18px 20px"><h3 style="color:var(--blue2)">${it.o}</h3><p style="font-size:15px;color:var(--ink);opacity:.92">${it.r}</p></div>`;}).join('')}</div></div>`;
 if(L==='proof')return `<div class="center">
   <div class="anim d1 kick">${s.kicker}</div>
   <h2 class="t anim d2">${s.title}</h2>
   <div class="proof anim d3 mt24" style="max-width:760px"><div style="display:flex;gap:14px;align-items:center;justify-content:center;opacity:.5">${icAvatar()}<div style="text-align:left"><div style="height:9px;width:120px;background:var(--line2);border-radius:6px"></div><div style="height:8px;width:80px;background:var(--line);border-radius:6px;margin-top:7px"></div></div></div><p class="ph mt16">${s.note}</p></div></div>`;
 if(L==='close')return `<div class="center">
   <h1 class="big anim d1">${s.title}</h1>
   <p class="lead anim d2 mt24">${s.sub}</p>
   <div class="anim d3 mt34" style="display:flex;align-items:center;gap:10px"><div style="width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:var(--blue2);stroke-width:2;fill:none"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg></div><b style="font-family:var(--serif);letter-spacing:.5px">ICBARI</b><span style="color:var(--dim);font-size:12px">Cirurgia Digestiva, Bariátrica e Metabólica</span></div></div>`;
 return '<div><h2 class="t">'+(s.title||'')+'</h2></div>';
}
function icAvatar(){return '<div style="width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" style="width:26px;height:26px;stroke:var(--dim);stroke-width:1.6;fill:none"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div>';}
function icDotBtn(){return '<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:var(--blue2);stroke-width:1.8;fill:none"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';}

/* ---------- engine ---------- */
var i=0;
var dotsEl=document.getElementById('dots');
dotsEl.innerHTML=SLIDES.map(function(_,k){return '<span class="dot" onclick="goTo('+k+')"></span>';}).join('');
var dots=[].slice.call(document.querySelectorAll('.dot'));
function render(){
 document.getElementById('stage').innerHTML='<div class="slide on">'+R(SLIDES[i])+'</div>';
 document.getElementById('count').textContent=String(i+1).padStart(2,'0')+' / '+String(SLIDES.length).padStart(2,'0');
 document.getElementById('bar').style.width=(i/(SLIDES.length-1)*100)+'%';
 dots.forEach(function(d,k){d.classList.toggle('on',k===i);});
}
function next(){if(i<SLIDES.length-1){i++;render();}}
function prev(){if(i>0){i--;render();}}
function goTo(k){i=k;render();}
document.addEventListener('keydown',function(e){
 if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){next();e.preventDefault();}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){prev();e.preventDefault();}
 else if(e.key==='Home'){goTo(0);}else if(e.key==='End'){goTo(SLIDES.length-1);}
});
document.getElementById('stage').addEventListener('click',function(e){if(e.target.closest('a,button'))return;var r=window.innerWidth;if(e.clientX<r*0.28)prev();else next();});
render();
</script>
</body>
</html>
