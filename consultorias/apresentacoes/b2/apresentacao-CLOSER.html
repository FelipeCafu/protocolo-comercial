<style>
:root{--bg:#002333;--bg2:#013243;--panel:#06394c;--panel2:#042f3e;--line:rgba(21,154,156,.20);--line2:rgba(21,154,156,.40);

*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
#bgwrap{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(1200px 720px at 80% -10%,rgba(21,154,156,.20),transparent 60%),radial-gradient(900px 620px at 6% 110%,rgba(56,198,180,.10),transparent 55%),linear-gradient(160deg,#002333,#013243 60%,#08141a)}

.orb{position:absolute;border-radius:50%;filter:blur(64px);opacity:.5;pointer-events:none}

.orb.b{width:420px;height:420px;bottom:-160px;left:-120px;background:radial-gradient(circle,rgba(56,198,180,.3),transparent 70%)}

.slide{display:none;width:min(1140px,94vw);max-height:90vh;overflow:auto;scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}.slide.on{display:block}
.anim{opacity:0;transform:translateY(16px);animation:up .6s cubic-bezier(.2,.75,.25,1) forwards}

.d1{animation-delay:.05s}.d2{animation-delay:.13s}.d3{animation-delay:.22s}.d4{animation-delay:.32s}.d5{animation-delay:.43s}.d6{animation-delay:.55s}.d7{animation-delay:.67s}
.kick{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold2)}

.gtag{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#04201c;background:linear-gradient(100deg,var(--gold2),var(--champ));padding:5px 12px;border-radius:30px}

.warmx{color:var(--warm)}
.row{display:flex;gap:30px;align-items:center;flex-wrap:wrap}.col{flex:1;min-width:290px}
.center{text-align:center;display:flex;flex-direction:column;align-items:center}.center .lead{margin-left:auto;margin-right:auto}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt30{margin-top:30px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-top:26px}
.card{position:relative;border:1px solid var(--line);border-radius:16px;padding:20px 18px;background:linear-gradient(180deg,rgba(16,42,48,.8),rgba(13,35,41,.6));overflow:hidden}
.card .ico{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(21,154,156,.24),rgba(56,198,180,.1));border:1px solid var(--line2);margin-bottom:12px}
.card h3{font-size:16px;font-weight:600;margin:0 0 6px}.card p{font-size:13.5px;line-height:1.55;color:var(--mut);margin:0}

svg.i{width:22px;height:22px;stroke:var(--gold2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.flowhead{display:flex;align-items:center;gap:14px;margin-top:14px}.fnum{font-family:var(--serif);font-size:40px;font-weight:600;color:var(--gold2);line-height:1;min-width:54px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.blk h4{margin:0 0 8px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}

.ask{list-style:none;margin:0;padding:0}.ask li{position:relative;padding:8px 0 8px 22px;font-size:14px;line-height:1.5;color:var(--mut);border-top:1px solid var(--line)}.ask li:first-child{border-top:0}.ask li::before{content:"?";position:absolute;left:0;top:8px;color:var(--gold2);font-weight:700}
.chkrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.chip2{border:1px solid var(--line2);border-radius:30px;padding:6px 13px;font-size:12.5px;color:var(--mut)}

.rotl .sn{width:24px;height:24px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--gold2),var(--champ));color:#04201c;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.rotl .sl div{font-size:14.5px;line-height:1.55}.rotl .sl b{color:var(--ink)}.rotl .sl i{color:var(--gold2);font-style:normal;font-size:13px}
.docrows{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:720px){.docrows{grid-template-columns:1fr}}
.docrow{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:14px;background:linear-gradient(180deg,rgba(16,42,48,.6),rgba(13,35,41,.4))}

.docrow .rtx{flex:1;min-width:0}
.docrow .rtx b{font-size:16px;display:block;color:var(--ink);line-height:1.15}
.docrow .rtx>span{font-size:11.5px;color:var(--gold2);display:block;margin:3px 0 7px;letter-spacing:.2px}
.docrow .rtx .dbio{font-size:12px;color:var(--mut);line-height:1.45;margin:0}
.objbtn{margin-top:16px;display:inline-flex;align-items:center;gap:9px;cursor:pointer;border:1px solid var(--line2);background:rgba(21,154,156,.10);color:var(--gold2);font-family:var(--sans);font-size:14px;font-weight:600;padding:11px 18px;border-radius:30px}

.objmore{margin-top:14px}
.qasks{margin-top:22px;display:flex;flex-direction:column;gap:10px;max-width:660px;margin-left:auto;margin-right:auto}
.qasks div{border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-size:15px;line-height:1.45;color:var(--ink);background:rgba(21,154,156,.06);text-align:left}
.dbio{font-size:11.5px;color:var(--mut);line-height:1.4;margin:6px 0 0}
.prox{margin-top:16px;display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--gold2)}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}@media(max-width:760px){.quad{grid-template-columns:1fr}}
.qbox{border:1px solid var(--line);border-radius:16px;padding:18px;background:linear-gradient(180deg,rgba(16,42,48,.75),rgba(13,35,41,.55))}
.qbox .k{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:19px;color:#04201c;background:linear-gradient(135deg,var(--gold2),var(--champ));margin-bottom:10px}
.qbox h4{margin:0 0 6px;font-size:15px}.qbox p{margin:0;font-size:13.5px;line-height:1.5;color:var(--mut)}.qbox p.qq{color:var(--ink);margin-top:8px;font-style:italic}

.jrn::before{content:"";position:absolute;left:6%;right:6%;top:26px;height:2px;background:linear-gradient(90deg,var(--gold),var(--champ),var(--gold2))}
.jnode{position:relative;text-align:center;padding:0 4px}
.jdot{width:54px;height:54px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 30%,#123038,#0b2026);border:1.5px solid var(--line2);box-shadow:0 8px 26px rgba(0,0,0,.5),0 0 0 6px rgba(10,23,28,.92)}
.jdot svg{width:24px;height:24px;stroke:var(--gold2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.jnode b{display:block;margin-top:14px;font-size:14px;font-weight:600}.jnode span{display:block;margin-top:4px;font-size:12px;color:var(--mut);line-height:1.45}
@media(max-width:820px){.jrn{grid-template-columns:1fr 1fr;gap:22px}.jrn::before{display:none}}
.docgrid{display:flex;gap:16px;flex-wrap:wrap;margin-top:22px;align-items:flex-start}
.docp{flex:1;min-width:150px;max-width:220px}
.docp .ph{aspect-ratio:3/4;border-radius:16px;overflow:hidden;border:1px solid var(--line2);background:#0f272d;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.docp .ph img{width:100%;height:100%;object-fit:cover;object-position:center 12%;display:block}
.docp b{display:block;margin-top:10px;font-size:14px}.docp span{font-size:12px;color:var(--mut)}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.badge{border:1px solid var(--line2);border-radius:12px;padding:9px 14px;font-size:13px;color:var(--mut)}.badge b{color:var(--gold2)}
.hosp{display:flex;gap:16px;flex-wrap:wrap;margin-top:28px}.hosp .hc{background:#f4f2ee;border-radius:14px;padding:16px 22px;min-width:180px;flex:1;display:flex;align-items:center;justify-content:center;min-height:96px}.hosp .hc img{max-width:100%;max-height:64px;display:block}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}.cmp .side{border:1px solid var(--line);border-radius:16px;padding:20px}

.cmp h4{margin:0 0 12px;font-size:13px;letter-spacing:.5px;text-transform:uppercase;font-weight:600}.cmp .bad h4{color:var(--rose)}.cmp .good h4{color:var(--gold2)}
.cmp li{list-style:none;padding:8px 0 8px 26px;position:relative;font-size:13.5px;line-height:1.5;color:var(--mut);border-top:1px solid var(--line)}.cmp li:first-child{border-top:0}
.cmp li::before{position:absolute;left:0;top:7px}.cmp .bad li::before{content:"✕";color:var(--rose)}.cmp .good li::before{content:"✓";color:var(--gold2)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px;margin-top:34px}
.stat b{font-family:var(--serif);font-size:clamp(36px,5vw,62px);font-weight:600;line-height:1;display:block}.stat span{display:block;margin-top:9px;font-size:13px;color:var(--mut);line-height:1.4}
.vstack{margin-top:22px}.vstack .vi{display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}.vstack .vi:first-child{border-top:0}
.vstack .vi .ck{width:26px;height:26px;border-radius:8px;flex:none;background:linear-gradient(135deg,rgba(21,154,156,.25),rgba(56,198,180,.1));border:1px solid var(--line2);display:flex;align-items:center;justify-content:center}
.vstack .vi .ck svg{width:14px;height:14px;stroke:var(--gold2);stroke-width:2;fill:none}.vstack .vi p{margin:0;font-size:14.5px;line-height:1.5}.vstack .vi p b{color:var(--ink)}.vstack .vi p span{color:var(--mut)}
.sys{border:1px solid var(--line2);border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#0f272d,#0a1e23);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.sys .bar{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}.sys .bar i{width:9px;height:9px;border-radius:50%;background:#2a3b3a;display:block}.sys .bar b{margin-left:10px;font-size:12px;color:var(--mut);font-weight:500}
.sys .body{padding:16px 18px}.chk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}.chk:last-child{border-bottom:0}
.chk .bx{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:none}.chk.on .bx{background:linear-gradient(135deg,var(--gold),var(--champ));border-color:transparent}.chk.on .bx svg{width:11px;height:11px;stroke:#04201c;stroke-width:2.6;fill:none}
.chk .tag{margin-left:auto;font-size:10.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--mut)}.chk.on .tag{color:var(--gold2);border-color:rgba(56,198,180,.5)}
.trig{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.trig div{border:1px solid var(--line);border-radius:12px;padding:12px 15px;font-size:13.5px;color:var(--mut);background:rgba(255,255,255,.02);flex:1;min-width:180px}.trig div b{color:var(--ink);display:block;margin-bottom:3px}
.proof{border:1px dashed var(--line2);border-radius:16px;padding:26px;text-align:center;background:radial-gradient(500px 200px at 50% 0,rgba(21,154,156,.1),transparent)}.proof .ph{font-size:13px;color:var(--dim)}
.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line2);border-radius:30px;padding:7px 15px;font-size:13px;color:var(--mut)}
#bar{position:fixed;left:0;top:0;height:3px;z-index:6;width:0;background:linear-gradient(90deg,var(--gold),var(--champ),var(--gold2));transition:width .45s cubic-bezier(.4,0,.2,1)}
#brand{position:fixed;top:14px;left:22px;z-index:6}#brand img{height:28px;display:block;opacity:.96}
#count{position:fixed;top:18px;right:22px;z-index:6;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:1px}
#nav{position:fixed;bottom:18px;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:center;gap:8px}
#dots{display:flex;gap:6px;margin:0 12px;flex-wrap:wrap;max-width:60vw;justify-content:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line2);cursor:pointer;transition:.3s}.dot.on{background:var(--gold2);width:20px;border-radius:6px}
.navb{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:rgba(16,42,48,.7);color:var(--ink);font-size:16px;cursor:pointer;backdrop-filter:blur(6px)}.navb:hover{border-color:var(--gold2);background:rgba(21,154,156,.2)}

</style>
</head>

 if(L==='flow')return `<div><div class="anim d1"><span class="gtag">${s.tag}</span></div><div class="flowhead anim d2"><div class="fnum">${s.n}</div><h2 class="t" style="margin:0">${s.title}</h2></div><div class="obj anim d2"><b>Objetivo:</b> ${s.obj}</div><div class="two"><div class="blk anim d3"><h4>Diga</h4>${s.diga.map(function(x){return `<div class="say">${x}</div>`;}).join('')}</div><div class="blk anim d4">${s.pergunte?`<h4>Pergunte</h4><ul class="ask">${s.pergunte.map(function(x){return `<li>${x}</li>`;}).join('')}</ul>`:''}${s.checar?`<h4 style="margin-top:${s.pergunte?'16px':'0'}">Confira</h4><div class="chkrow">${s.checar.map(function(x){return `<span class="chip2">✓ ${x}</span>`;}).join('')}</div>`:''}</div></div>${s.prox?`<div class="prox anim d5">${arrow()} ${s.prox}</div>`:''}</div>`;
 if(L==='spin'||L==='bant')return `<div><div class="anim d1"><span class="gtag">${s.tag}</span></div><h2 class="t anim d2">${s.title}</h2><p class="lead anim d2 mt8">${s.sub}</p><div class="quad">${s.items.map(function(q,i){return `<div class="qbox anim d${Math.min(i+3,6)}"><div class="k">${q.k}</div><h4>${q.t}</h4><p class="qq">${q.q}</p></div>`;}).join('')}</div></div>`;
 if(L==='doctors')return `<div><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2>${s.body?`<p class="lead anim d3 mt16">${s.body}</p>`:''}<div class="docrows">${s.docs.map(function(dc,i){return `<div class="docrow anim d${Math.min(i+4,7)}"><div class="rph"><img src="${dc.img}" alt="${dc.name}"></div><div class="rtx"><b>${dc.name}</b><span>${dc.role}</span>${dc.bio?'<p class="dbio">'+dc.bio+'</p>':''}</div></div>`;}).join('')}</div>${s.badges?`<div class="badges anim d6" style="margin-top:14px">${s.badges.map(function(b){return '<div class="badge"><b>'+b.b+'</b> '+b.t+'</div>';}).join('')}</div>`:''}${s.nota?`<p class="anim d7" style="margin-top:12px;font-size:12px;color:var(--dim)">${s.nota}</p>`:''}</div>`;
 if(L==='hospitals')return `<div><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2><p class="lead anim d2 mt16">${s.body}</p><div class="hosp">${s.logos.map(function(l,i){return `<div class="hc anim d${i+3}"><img src="${l.src}" alt="${l.alt}"></div>`;}).join('')}</div>${s.note?`<p class="anim d5" style="margin-top:14px;font-size:12px;color:var(--dim)">${s.note}</p>`:''}</div>`;
 if(L==='contrast')return `<div><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2><div class="cmp"><div class="side bad anim d3"><h4>${s.left.h}</h4><ul style="margin:0;padding:0">${s.left.items.map(function(x){return `<li>${x}</li>`;}).join('')}</ul></div><div class="side good anim d4"><h4>${s.right.h}</h4><ul style="margin:0;padding:0">${s.right.items.map(function(x){return `<li>${x}</li>`;}).join('')}</ul></div></div></div>`;
 if(L==='journey')return `<div><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2><div class="jrn anim d3">${s.steps.map(function(n,i){return `<div class="jnode"><div class="jdot">${icDot(n.ic)}</div><b>${i+1}. ${n.label}</b><span>${n.desc}</span></div>`;}).join('')}</div></div>`;
 if(L==='vstack')return `<div><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2><div class="vstack">${s.items.map(function(v,i){return `<div class="vi anim d${Math.min(i+3,7)}"><span class="ck"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg></span><p><b>${v.b}</b> <span>${v.s}</span></p></div>`;}).join('')}</div></div>`;
 if(L==='system')return `<div class="row"><div class="col"><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2><p class="lead anim d3 mt16">${s.body}</p></div><div class="col anim d4"><div class="sys"><div class="bar"><i></i><i></i><i></i><b>Jornada Financeira · B2</b></div><div class="body">${s.checklist.map(function(c){return `<div class="chk ${c.on?'on':''}"><span class="bx">${c.on?'<svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>':''}</span><span>${c.t}</span><span class="tag">${c.tag}</span></div>`;}).join('')}</div></div></div></div>`;
 if(L==='stats')return `<div><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2><div class="stats">${s.stats.map(function(x,i){return `<div class="stat anim d${i+3}"><b class="grad">${x.n}</b><span>${x.t}</span></div>`;}).join('')}</div><p class="anim d6" style="margin-top:30px;font-size:12px;color:var(--dim)">Números da B2 para uso comercial. Confirme antes de publicar.</p></div>`;
 if(L==='offer')return `<div><div class="anim d1 kick">${s.kicker}</div><h1 class="big anim d2">${s.title}</h1><p class="lead anim d3 mt16">${s.sub}</p><div class="trig anim d4">${s.triggers.map(function(t){return `<div><b>${t.b}</b>${t.t}</div>`;}).join('')}</div></div>`;
 if(L==='objections')return `<div><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2><div class="cards" style="grid-template-columns:1fr 1fr">${s.items.map(function(it,i){return `<div class="card anim d${Math.min(i+3,7)}" style="padding:15px 17px"><h3 style="color:var(--gold2);font-size:15px">${it.o}</h3><p style="font-size:14px;color:var(--ink);opacity:.92;margin-top:6px">${it.r}</p></div>`;}).join('')}</div>${s.more?`<button class="objbtn" data-open="− Esconder as demais objeções" data-closed="＋ Ver TODAS as objeções que ela ainda pode trazer" onclick="toggleObjMore(this)">＋ Ver TODAS as objeções que ela ainda pode trazer</button><div id="objMore" class="objmore" style="display:none"><div class="cards" style="grid-template-columns:1fr 1fr">${s.more.map(function(it){return `<div class="card" style="padding:15px 17px"><h3 style="color:var(--gold2);font-size:15px">${it.o}</h3><p style="font-size:14px;color:var(--ink);opacity:.92;margin-top:6px">${it.r}</p></div>`;}).join('')}</div></div>`:''}</div>`;
 if(L==='reviews')return `<div><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2><div class="cards" style="grid-template-columns:1fr 1fr">${s.items.map(function(it,i){return `<div class="card anim d${Math.min(i+3,7)}" style="padding:16px 18px;text-align:left"><div style="color:#f5b301;font-size:15px;letter-spacing:3px">★★★★★</div><p style="font-size:14px;color:var(--ink);opacity:.95;margin:9px 0 11px;line-height:1.5">“${it.q}”</p><div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap"><span style="font-weight:700;font-size:13px;color:var(--ink)">${it.a}</span><span style="font-size:11px;color:var(--dim)">· Google · ${it.d}</span></div></div>`;}).join('')}</div>${s.foot?`<p class="anim d7" style="margin-top:22px;font-size:12px;color:var(--dim);text-align:center">${s.foot}</p>`:''}</div>`;
 if(L==='proof')return `<div class="center"><div class="anim d1 kick">${s.kicker}</div><h2 class="t anim d2">${s.title}</h2><div class="proof anim d3 mt24" style="max-width:760px"><div style="display:flex;gap:14px;align-items:center;justify-content:center;opacity:.5"><div style="width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" style="width:26px;height:26px;stroke:var(--dim);stroke-width:1.6;fill:none"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div><div style="text-align:left"><div style="height:9px;width:120px;background:var(--line2);border-radius:6px"></div><div style="height:8px;width:80px;background:var(--line);border-radius:6px;margin-top:7px"></div></div></div><p class="ph mt16">${s.note}</p></div></div>`;
 if(L==='close')return `<div class="center"><span style="font-family:Poppins,sans-serif;font-weight:800;font-size:26px;letter-spacing:.5px;color:#4fd1c5">B2 <span style="font-weight:400;opacity:.75;font-size:14px">Inteligência Financeira</span></span><h1 class="big anim d2">${s.title}</h1><p class="lead anim d3 mt24">${s.sub}</p></div>`;
 return '<div><h2 class="t">'+(s.title||'')+'</h2></div>';
}
function toggleObjMore(btn){var m=document.getElementById('objMore');if(!m)return;var open=m.style.display!=='none';m.style.display=open?'none':'block';btn.textContent=open?btn.dataset.closed:btn.dataset.open;}
function arrow(){return '<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:var(--gold2);stroke-width:1.8;fill:none;vertical-align:middle"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';}
var i=0,dotsEl=document.getElementById('dots'),dots=[];
initDots();
function render(){document.getElementById('stage').innerHTML='<div class="slide on">'+R(SLIDES[i])+'</div>';document.getElementById('count').textContent=String(i+1).padStart(2,'0')+' / '+String(SLIDES.length).padStart(2,'0');document.getElementById('bar').style.width=(i/(SLIDES.length-1)*100)+'%';dots.forEach(function(d,k){d.classList.toggle('on',k===i);});}
function next(){if(i<SLIDES.length-1){i++;render();}}function prev(){if(i>0){i--;render();}}function goTo(k){i=k;render();}
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){next();e.preventDefault();}else if(e.key==='ArrowLeft'||e.key==='PageUp'){prev();e.preventDefault();}else if(e.key==='Home'){goTo(0);}else if(e.key==='End'){goTo(SLIDES.length-1);}});
document.getElementById('stage').addEventListener('click',function(e){if(e.target.closest('a,button,#origbar'))return;var r=window.innerWidth;if(e.clientX<r*0.26)prev();else next();});
render();renderOrigBar();
</script>
</body>
</html>
