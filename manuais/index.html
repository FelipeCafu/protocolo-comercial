<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protocolo 2026 · Central de Manuais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0C0C0C; --bg2:#131211; --panel:#1a1917; --panel2:#211f1c; --line:#332f2a;
  --text:#F0EDE8; --muted:#9a938a; --primary:#FF6B2B; --primary2:#ff8a52; --accent:#e7b53c;
  --ok:#37c98a; --bad:#f0596b; --radius:14px; --font:"Kanit","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-weight:400;-webkit-font-smoothing:antialiased}
a{color:var(--primary2);text-decoration:none}
button{font-family:inherit;cursor:pointer}
::selection{background:rgba(255,107,43,.32)}
/* ===== LOGIN ===== */
#login{position:fixed;inset:0;display:grid;place-items:center;z-index:50;
  background:radial-gradient(1200px 700px at 70% -10%,rgba(255,107,43,.18),transparent 60%),var(--bg)}
.login-card{width:min(400px,92vw);background:linear-gradient(180deg,var(--panel),var(--bg2));
  border:1px solid var(--line);border-radius:20px;padding:38px 34px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.login-card .mark{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.login-card .mark img{height:42px;width:auto}
.login-card h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:18px 0 2px}
.login-card h2{font-size:26px;font-weight:700;margin:0 0 22px;line-height:1.1}
.login-card h2 b{color:var(--primary)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;letter-spacing:.04em}
.field input{width:100%;padding:13px 15px;background:var(--bg);border:1px solid var(--line);border-radius:12px;
  color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:.15s}
.field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,107,43,.15)}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#160b04;font-weight:700;font-size:15px;letter-spacing:.02em;transition:.15s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.login-err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px;text-align:center}
.login-hint{margin-top:16px;text-align:center;color:var(--muted);font-size:12px}
/* ===== APP ===== */
#app{display:none;height:100vh;grid-template-columns:320px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"top top" "side main"}
.topbar{grid-area:top;display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--bg2),var(--bg));position:sticky;top:0;z-index:20}
.topbar img{height:30px}
.topbar .sub{color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.topbar .grow{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 13px;width:min(420px,42vw)}
.search input{background:none;border:0;outline:0;color:var(--text);font-family:inherit;font-size:14px;width:100%}
.search svg{opacity:.6;flex:none}
.topbtn{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:9px 13px;font-size:13px}
.topbtn:hover{color:var(--text);border-color:var(--primary)}
/* sidebar */
.side{grid-area:side;overflow-y:auto;border-right:1px solid var(--line);background:var(--bg2);padding:12px 10px 40px}
.side::-webkit-scrollbar,.content::-webkit-scrollbar,.list::-webkit-scrollbar{width:9px}
.side::-webkit-scrollbar-thumb,.content::-webkit-scrollbar-thumb,.list::-webkit-scrollbar-thumb{background:#2a2723;border-radius:6px}
.grp-title{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:16px 12px 6px;font-weight:600}
.sec{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--text);font-size:14.5px;transition:.12s}
.sec:hover{background:var(--panel)}
.sec.active{background:linear-gradient(90deg,rgba(255,107,43,.16),transparent);color:#fff;box-shadow:inset 3px 0 0 var(--primary)}
.sec .ic{width:20px;text-align:center;opacity:.9}
.sec .nm{flex:1}
.sec .ct{font-size:11px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);padding:1px 8px;border-radius:20px}
.sec.active .ct{color:var(--primary);border-color:rgba(255,107,43,.4)}
/* main */
.main{grid-area:main;display:grid;grid-template-columns:340px 1fr;overflow:hidden}
.list{overflow-y:auto;border-right:1px solid var(--line);background:var(--bg);padding:10px}
.list .lhead{padding:10px 12px 12px;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line);margin-bottom:6px}
.item{padding:11px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:.12s}
.item:hover{background:var(--panel)}
.item.active{background:var(--panel);border-color:var(--line)}
.item .t{font-size:14px;font-weight:500;line-height:1.25;color:var(--text)}
.item .m{display:flex;gap:8px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:10.5px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);padding:1px 8px;border-radius:20px}
.tag.code{color:var(--accent)}
.content{overflow-y:auto;padding:34px 46px 90px}
.crumbs{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.doc-title{font-size:32px;font-weight:700;line-height:1.12;margin:0 0 8px}
.doc-meta{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px}
.doc-body{max-width:820px;font-size:15.5px;line-height:1.72;color:#e7e2da}
.doc-body h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin:30px 0 8px;font-weight:600}
.doc-body h3{font-size:18px;margin:24px 0 8px;color:#fff}
.doc-body p{margin:0 0 13px;white-space:pre-wrap}
.doc-body ul{margin:0 0 14px;padding-left:20px}
.doc-body li{margin:4px 0}
.doc-body blockquote{border-left:3px solid var(--primary);margin:14px 0;padding:6px 16px;color:var(--muted);background:var(--panel)}
.doc-actions{position:sticky;top:0;display:flex;gap:10px;justify-content:flex-end;margin-bottom:-10px}
.abtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500}
.abtn:hover{border-color:var(--primary);color:#fff}
.abtn.save{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#160b04;border:0;font-weight:700}
.editarea{width:100%;min-height:60vh;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--text);
  font-family:var(--mono,ui-monospace,Menlo,monospace);font-size:14px;line-height:1.6;padding:16px;outline:none}
.edit-title{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:#fff;font-size:22px;font-weight:700;padding:10px 14px;font-family:inherit;margin-bottom:12px;outline:none}
.empty{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:40px}
.empty .big{font-size:52px;margin-bottom:14px;opacity:.5}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ok);color:#04120a;padding:11px 20px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.toast.err{background:var(--bad);color:#fff}
.loading{display:grid;place-items:center;height:100%;color:var(--muted)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:14px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:1100px){#app{grid-template-columns:270px 1fr}.main{grid-template-columns:300px 1fr}}
@media(max-width:860px){#app{grid-template-columns:1fr}.side{display:none}.main{grid-template-columns:1fr}.list{display:none}.content{padding:24px}}
</style>
</head>

<script>
/* ===== CONFIG ===== */
const SB_URL="https://peqwcrkcgzbpfvrwcwlo.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlcXdjcmtjZ3picGZ2cndjd2xvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMjczOTUsImV4cCI6MjA5NjgwMzM5NX0.ub2cInuad6_27oGPrUtq14hgvuYo8mAF7nAdOnVYVpE";
const PASSWORD="Protocolo 2026";
let sb=null;
try{ sb=supabase.createClient(SB_URL,SB_KEY); }catch(e){ console.warn(e); }

/* ===== Ordem e ícones das seções ===== */
const GROUPS=[
  {doc:'swipe-file', label:'Protocolo · Swipe File', secs:[
    ['Narrativa','📖'],['Job Descriptions','👤'],['Playbooks','📘'],['Protocolos','🧩'],['Processos','⚙️'],['Vídeos','🎬'],
  ]},
  {doc:'modelo-clientes', label:'Modelo para Clientes (template)', secs:[
    ['Template: BD_job_description','🗂️'],['Template: BD_processo','🗂️'],['Template: BD_protocolo','🗂️'],
    ['Template: BD_playbook','🗂️'],['Template: BD_produto','🗂️'],['Template: BD_videos','🗂️'],
    ['Template: BD_departamento','🗂️'],['Template: BD_status','🗂️'],
  ]},
];

let INDEX=[];      // itens leves (sem content)
let curSec=null, curItem=null, editing=false;

/* ===== LOGIN ===== */
function doLogin(){
  const v=document.getElementById('pw').value.trim();
  if(v.toLowerCase()===PASSWORD.toLowerCase()){
    sessionStorage.setItem('pc_manuais_auth','1'); enter();
  } else {
    document.getElementById('loginErr').textContent='Senha incorreta. Tente novamente.';
    document.getElementById('pw').select();
  }
}
function logout(){ sessionStorage.removeItem('pc_manuais_auth'); location.reload(); }
function enter(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='grid';
  loadIndex();
}
if(sessionStorage.getItem('pc_manuais_auth')==='1'){ enter(); }
window.addEventListener('load',()=>{ const p=document.getElementById('pw'); if(p) p.focus(); });

/* ===== DADOS ===== */
async function loadIndex(){
  if(!sb){ toast('Supabase indisponível',true); return; }
  let all=[], from=0, step=1000;
  while(true){
    const {data,error}=await sb.from('manuais_fss')
      .select('id,doc,section,code,title,dept,ord')
      .order('ord',{ascending:true}).range(from,from+step-1);
    if(error){ toast('Erro ao carregar: '+error.message,true); break; }
    all=all.concat(data||[]);
    if(!data||data.length<step) break;
    from+=step;
  }
  INDEX=all;
  buildSidebar();
  // abre a primeira seção com itens
  const first=GROUPS.flatMap(g=>g.secs.map(s=>s[0])).find(s=>INDEX.some(i=>i.section===s));
  if(first) selectSection(first);
}

function countSec(sec){ return INDEX.filter(i=>i.section===sec).length; }

function buildSidebar(){
  const side=document.getElementById('side'); side.innerHTML='';
  for(const g of GROUPS){
    const anyRows=g.secs.some(s=>countSec(s[0])>0);
    if(!anyRows) continue;
    const gt=document.createElement('div'); gt.className='grp-title'; gt.textContent=g.label; side.appendChild(gt);
    for(const [name,ic] of g.secs){
      const n=countSec(name); if(!n) continue;
      const el=document.createElement('div'); el.className='sec'; el.dataset.sec=name;
      const disp=name.replace('Template: BD_','').replace(/_/g,' ');
      el.innerHTML=`<span class="ic">${ic}</span><span class="nm">${cap(disp)}</span><span class="ct">${n}</span>`;
      el.onclick=()=>selectSection(name);
      side.appendChild(el);
    }
  }
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function selectSection(sec){
  curSec=sec; document.getElementById('q').value='';
  document.querySelectorAll('.sec').forEach(e=>e.classList.toggle('active',e.dataset.sec===sec));
  renderList(INDEX.filter(i=>i.section===sec), sec);
}

function renderList(items, heading){
  const list=document.getElementById('list');
  const disp = heading.startsWith('Template:') ? heading.replace('Template: BD_','Template · ').replace(/_/g,' ') : heading;
  let h=`<div class="lhead">${cap(disp)} · ${items.length}</div>`;
  if(!items.length){ h+='<div style="padding:20px;color:var(--muted)">Nenhum item.</div>'; }
  list.innerHTML=h;
  for(const it of items){
    const el=document.createElement('div'); el.className='item'; el.dataset.id=it.id;
    let tags='';
    if(it.code) tags+=`<span class="tag code">${esc(it.code)}</span>`;
    if(it.dept) tags+=`<span class="tag">${esc(it.dept)}</span>`;
    el.innerHTML=`<div class="t">${esc(it.title||'(sem título)')}</div>${tags?`<div class="m">${tags}</div>`:''}`;
    el.onclick=()=>openItem(it.id, el);
    list.appendChild(el);
  }
}

async function openItem(id, el){
  document.querySelectorAll('.item').forEach(e=>e.classList.remove('active'));
  if(el) el.classList.add('active');
  editing=false;
  const content=document.getElementById('content');
  content.innerHTML='<div class="loading"><div><div class="spin"></div>Abrindo…</div></div>';
  const {data,error}=await sb.from('manuais_fss').select('*').eq('id',id).single();
  if(error){ content.innerHTML='<div class="empty">Erro ao abrir.</div>'; return; }
  curItem=data; renderItem();
}

function renderItem(){
  const it=curItem, c=document.getElementById('content');
  const secDisp = it.section.startsWith('Template:') ? it.section.replace('Template: BD_','Modelo · ').replace(/_/g,' ') : it.section;
  let meta='';
  if(it.code) meta+=`<span class="tag code">${esc(it.code)}</span>`;
  if(it.dept) meta+=`<span class="tag">${esc(it.dept)}</span>`;
  if(editing){
    c.innerHTML=`
      <div class="doc-actions">
        <button class="abtn" onclick="renderItem()">Cancelar</button>
        <button class="abtn save" onclick="saveItem()">Salvar na nuvem</button>
      </div>
      <div class="crumbs">${esc(secDisp)}</div>
      <input class="edit-title" id="eTitle" value="${esc(it.title||'')}">
      <textarea class="editarea" id="eBody" spellcheck="false">${esc(it.content||'')}</textarea>`;
  } else {
    c.innerHTML=`
      <div class="doc-actions"><button class="abtn" onclick="startEdit()">✎ Editar</button></div>
      <div class="crumbs">${esc(secDisp)}</div>
      <h1 class="doc-title">${esc(it.title||'(sem título)')}</h1>
      <div class="doc-meta">${meta}</div>
      <div class="doc-body">${mdToHtml(it.content||'')}</div>`;
  }
}
function startEdit(){ editing=true; renderItem(); }

async function saveItem(){
  const title=document.getElementById('eTitle').value;
  const body=document.getElementById('eBody').value;
  const {error}=await sb.from('manuais_fss').update({title,content:body,updated_at:new Date().toISOString()}).eq('id',curItem.id);
  if(error){ toast('Erro ao salvar: '+error.message,true); return; }
  curItem.title=title; curItem.content=body; editing=false; renderItem();
  // atualiza índice/lista
  const ix=INDEX.find(i=>i.id===curItem.id); if(ix){ ix.title=title; }
  if(curSec) renderList(INDEX.filter(i=>i.section===curSec),curSec);
  toast('Salvo na nuvem ✓');
}

/* ===== BUSCA ===== */
let searchT=null;
function onSearch(v){
  clearTimeout(searchT);
  searchT=setTimeout(()=>{
    v=v.trim().toLowerCase();
    if(!v){ if(curSec) selectSection(curSec); return; }
    document.querySelectorAll('.sec').forEach(e=>e.classList.remove('active'));
    const res=INDEX.filter(i=>((i.title||'')+' '+(i.code||'')+' '+(i.dept||'')+' '+i.section).toLowerCase().includes(v));
    renderList(res.slice(0,300), `Busca: “${v}” (${res.length})`);
  },160);
}

/* ===== UTIL ===== */
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function mdToHtml(md){
  const lines=String(md).split('\n'); let html='', inList=false;
  const closeList=()=>{ if(inList){ html+='</ul>'; inList=false; } };
  for(let raw of lines){
    let l=raw.replace(/\r/g,'');
    if(/^##\s+/.test(l)){ closeList(); html+='<h2>'+inline(l.replace(/^##\s+/,''))+'</h2>'; continue; }
    if(/^#\s+/.test(l)){ closeList(); html+='<h3>'+inline(l.replace(/^#\s+/,''))+'</h3>'; continue; }
    if(/^>\s?/.test(l)){ closeList(); html+='<blockquote>'+inline(l.replace(/^>\s?/,''))+'</blockquote>'; continue; }
    if(/^\s*[-•]\s+/.test(l)){ if(!inList){ html+='<ul>'; inList=true; } html+='<li>'+inline(l.replace(/^\s*[-•]\s+/,''))+'</li>'; continue; }
    if(/^\s*\d+[.)]\s+/.test(l)){ if(!inList){ html+='<ul>'; inList=true; } html+='<li>'+inline(l.replace(/^\s*\d+[.)]\s+/,''))+'</li>'; continue; }
    if(l.trim()===''){ closeList(); continue; }
    closeList(); html+='<p>'+inline(l)+'</p>';
  }
  closeList(); return html||'<p style="color:var(--muted)">(vazio)</p>';
}
function inline(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
function toast(msg,err){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); setTimeout(()=>t.className='toast',2600); }
</script>
