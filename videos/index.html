<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Protocolo 2026 · Central de Vídeos</title>
<link rel="icon" href="../favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0C0C; --bg2:#131211; --panel:#1a1917; --panel2:#211f1c; --line:#332f2a;
  --text:#F0EDE8; --muted:#9a938a; --primary:#FF6B2B; --primary2:#ff8a52; --accent:#e7b53c;
  --ok:#37c98a; --bad:#f0596b; --radius:14px; --font:"Kanit","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-weight:400;-webkit-font-smoothing:antialiased}
a{color:var(--primary2);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:rgba(255,107,43,.32)}
img{max-width:100%}

/* LOGIN */
#login{position:fixed;inset:0;display:grid;place-items:center;z-index:50;
  background:radial-gradient(1200px 700px at 70% -10%,rgba(255,107,43,.18),transparent 60%),var(--bg)}
.login-card{width:min(400px,92vw);background:linear-gradient(180deg,var(--panel),var(--bg2));
  border:1px solid var(--line);border-radius:20px;padding:38px 34px;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center}
.login-card img{height:46px;margin-bottom:12px}
.login-card h1{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 0 2px}
.login-card h2{font-size:22px;font-weight:700;margin-bottom:22px}
.login-card label{display:block;text-align:left;font-size:12px;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.08em}
.login-card input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;font-family:inherit}
.login-card input:focus{outline:none;border-color:var(--primary)}
.login-card button{width:100%;margin-top:16px;padding:13px;border-radius:12px;background:linear-gradient(180deg,var(--primary2),var(--primary));color:#1a0e07;font-weight:700;font-size:15px}
.login-card .err{color:var(--bad);font-size:13px;margin-top:12px;min-height:16px}

/* SHELL */
#app{display:none;min-height:100%;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px 22px;
  background:rgba(12,12,12,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .brand{display:flex;align-items:center;gap:11px}
.topbar .brand img{height:30px}
.topbar .brand b{font-weight:700;font-size:15px;letter-spacing:.02em}
.topbar .brand span{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.nav{display:flex;gap:6px;margin-left:8px}
.nav a{padding:7px 13px;border-radius:9px;font-size:13.5px;color:var(--muted);border:1px solid transparent}
.nav a:hover{color:var(--text);background:var(--panel)}
.nav a.active{color:var(--primary);border-color:var(--line);background:var(--panel)}
.search{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 13px;width:min(340px,40vw)}
.search input{border:none;background:none;color:var(--text);font-size:14px;width:100%;font-family:inherit}
.search input:focus{outline:none}
.search svg{opacity:.6;flex:none}
.logout{padding:8px 13px;border-radius:9px;border:1px solid var(--line);color:var(--muted);font-size:13px}
.logout:hover{color:var(--bad);border-color:var(--bad)}

.wrap{padding:26px 26px 80px;max-width:1400px;margin:0 auto;width:100%}
.hero{margin-bottom:26px}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
.hero p{color:var(--muted);margin-top:6px;font-size:14.5px}
.hero .stats{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--muted)}
.chip b{color:var(--text)}

/* NÍVEL 1 — grade de cursos (vários por linha) */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.ccard{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column;text-align:left;width:100%}
.ccard:hover{border-color:var(--primary);transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.5)}
.ccard .cover{aspect-ratio:16/9;position:relative;display:grid;place-items:center;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(12,12,12,.28),rgba(12,12,12,.74)),url("../felipe%20avatar.jpg") center 20%/cover}
.ccard .cover .play{width:50px;height:50px;border-radius:50%;background:rgba(255,107,43,.92);display:grid;place-items:center;box-shadow:0 6px 20px rgba(255,107,43,.45);transition:.18s}
.ccard:hover .cover .play{transform:scale(1.1)}
.ccard .cover .badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.66);border:1px solid var(--line);color:var(--text);font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px}
.ccard .cbody{padding:14px 15px 16px;flex:1;display:flex;flex-direction:column;gap:6px}
.ccard .cbody b{font-size:15.5px;font-weight:600;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.ccard .cbody small{color:var(--muted);font-size:12.5px}
.ccard .cbody .go{margin-top:6px;color:var(--primary);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px}

/* NÍVEL 2 — curso aberto */
.crumb{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.backbtn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:13.5px;background:var(--panel)}
.backbtn:hover{border-color:var(--primary);color:var(--primary)}
.crumb .ctitle{font-size:20px;font-weight:700}
.crumb .ccount{color:var(--muted);font-size:13px}

/* grade de vídeos (nível 2 e busca) */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column}
.card:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.thumb{aspect-ratio:16/9;display:grid;place-items:center;position:relative;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(12,12,12,.12),rgba(12,12,12,.7)),url("../felipe%20avatar.jpg") center 20%/cover}
.thumb .play{width:46px;height:46px;border-radius:50%;background:rgba(255,107,43,.92);display:grid;place-items:center;box-shadow:0 6px 20px rgba(255,107,43,.4);transition:.18s}
.card:hover .thumb .play{transform:scale(1.12)}
.thumb .num{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);border:1px solid var(--line);color:var(--muted);font-size:11px;padding:2px 8px;border-radius:7px;font-weight:600}
.card .cap{padding:11px 13px 13px;font-size:13px;line-height:1.35;color:var(--text);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:58px}
.card .cap .clab{color:var(--primary);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);text-align:center;padding:60px 20px}

/* PLAYER MODAL */
#modal{position:fixed;inset:0;z-index:60;display:none;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);padding:3vh 3vw}
#modal.on{display:grid;place-items:center}
.player{width:min(1100px,96vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.7)}
.player-head{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line)}
.player-head b{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-head small{color:var(--muted);font-size:12px}
.player-head .x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);color:var(--muted);font-size:20px;display:grid;place-items:center;flex:none}
.player-head .x:hover{color:var(--bad);border-color:var(--bad)}
.player .frame{aspect-ratio:16/9;background:#000}
.player iframe{width:100%;height:100%;border:0}
.pfoot{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--line);align-items:center}
.pfoot .nv{padding:8px 14px;border:1px solid var(--line);border-radius:9px;font-size:13px;color:var(--muted)}
.pfoot .nv:hover{color:var(--text);border-color:var(--primary)}
.pfoot a.dl{margin-left:auto;font-size:12.5px;color:var(--muted)}
@media(max-width:640px){.wrap{padding:18px 14px 70px}.search{width:auto;flex:1}.nav span.lbl{display:none}.hero h1{font-size:23px}}
</style>
</head>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <img src="../logo.png" alt="O Protocolo" onerror="this.style.display='none'">
    <h1>O Protocolo Comercial</h1>
    <h2>Central de Vídeos</h2>
    <label>Senha de acesso</label>
    <input id="pw" type="password" placeholder="••••••••••" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Entrar</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="brand">
      <img src="../logo.png" alt="" onerror="this.style.display='none'">
      <div><b>Protocolo 2026</b> <span>· Vídeos</span></div>
    </div>
    <nav class="nav">
      <a href="../">Início</a>
      <a href="../manuais/">Manuais</a>
      <a class="active" href="./">Vídeos</a>
    </nav>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="Buscar curso ou aula..." oninput="render()">
    </div>
    <button class="logout" onclick="logout()">Sair</button>
  </div>

  <div class="wrap">
    <div class="hero">
      <h1>Central de Vídeos</h1>
      <p>Todo o acervo de treinamentos do Full Sales System — transmitido direto do Drive.</p>
      <div class="stats" id="stats"></div>
    </div>
    <div id="list"></div>
  </div>
</div>

<!-- PLAYER -->
<div id="modal" onclick="if(event.target.id==='modal')closePlayer()">
  <div class="player">
    <div class="player-head">
      <div style="flex:1;min-width:0"><b id="pTitle">—</b><br><small id="pCourse"></small></div>
      <button class="x" onclick="closePlayer()">×</button>
    </div>
    <div class="frame"><iframe id="pFrame" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>
    <div class="pfoot">
      <button class="nv" onclick="nav(-1)">‹ Anterior</button>
      <button class="nv" onclick="nav(1)">Próxima ›</button>
      <a class="dl" id="pOpen" href="#" target="_blank" rel="noopener">Abrir no Google Drive ↗</a>
    </div>
  </div>
</div>

const PASSWORD="Protocolo 2026";
function enter(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';history.replaceState({v:'grid'},'');render();}
function doLogin(){
  const v=document.getElementById('pw').value.trim();
  if(v.toLowerCase()===PASSWORD.toLowerCase()){sessionStorage.setItem('pc_videos_auth','1');enter();}
  else{document.getElementById('loginErr').textContent='Senha incorreta. Tente novamente.';}
}
function logout(){sessionStorage.removeItem('pc_videos_auth');location.reload();}

// estado do player (lista plana filtrada atual pra navegação)
let curFlat=[], curIdx=-1;
// nível de navegação: -1 = grade de cursos, >=0 = curso aberto
let curCourse=-1;

function stats(){
  const el=document.getElementById('stats');
  el.innerHTML=`<span class="chip"><b>${CATALOG.total}</b> vídeos</span>
    <span class="chip"><b>${CATALOG.courses.length}</b> cursos</span>
    <span class="chip">Streaming direto do Google Drive</span>`;
}

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function courseIcon(){return '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#FF6B2B" stroke-width="1.7"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m10 9 5 3-5 3z" fill="#FF6B2B" stroke="none"/></svg>';}
function playIcon(){return '<span class="play"><svg width="20" height="20" viewBox="0 0 24 24" fill="#1a0e07"><path d="M8 5v14l11-7z"/></svg></span>';}
function videoCard(ci,v,courseLabel){
  return `<div class="card" onclick='play(${ci},"${v.id}")'>
      <div class="thumb"><span class="num">${esc(v.n||'')}</span>${playIcon()}</div>
      <div class="cap">${courseLabel?`<span class="clab">${esc(courseLabel)}</span>`:''}${esc(v.title)}</div>
    </div>`;
}

function render(){
  stats();
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const list=document.getElementById('list');

  // BUSCA — resultados planos de vídeos (de todos os cursos)
  if(q){
    let html='<div class="vgrid">',n=0;
    CATALOG.courses.forEach((c,ci)=>{
      c.videos.forEach(v=>{
        if(c.course.toLowerCase().includes(q)||v.title.toLowerCase().includes(q)){
          n++; html+=videoCard(ci,v,c.course);
        }
      });
    });
    html+='</div>';
    list.innerHTML = n ? html : '<div class="empty">Nenhum vídeo encontrado para essa busca.</div>';
    return;
  }

  // NÍVEL 2 — curso aberto
  if(curCourse>=0){ renderCourse(curCourse); return; }

  // NÍVEL 1 — grade de cursos
  let html='<div class="cgrid">';
  CATALOG.courses.forEach((c,ci)=>{
    html+=`<button class="ccard" onclick="openCourse(${ci})">
      <div class="cover"><span class="badge">${c.count} vídeos</span>${playIcon()}</div>
      <div class="cbody">
        <b>${esc(c.course)}</b>
        <small>${c.count} aula${c.count>1?'s':''}</small>
        <span class="go">Assistir <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></span>
      </div>
    </button>`;
  });
  html+='</div>';
  list.innerHTML=html;
}

function renderCourse(ci){
  const c=CATALOG.courses[ci];
  let html=`<div class="crumb">
      <button class="backbtn" onclick="backToCourses()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg> Cursos</button>
      <span class="ctitle">${esc(c.course)}</span><span class="ccount">· ${c.count} vídeos</span>
    </div><div class="vgrid">`;
  c.videos.forEach(v=>{ html+=videoCard(ci,v,''); });
  html+='</div>';
  document.getElementById('list').innerHTML=html;
}

function openCourse(ci){curCourse=ci;const s=document.getElementById('q');if(s)s.value='';history.pushState({v:'course',ci:ci},'');window.scrollTo({top:0,behavior:'smooth'});render();}
function backToCourses(){history.back();}

function play(ci,id){
  const c=CATALOG.courses[ci];
  curFlat=c.videos; curIdx=c.videos.findIndex(v=>v.id===id);
  history.pushState({v:'player',ci:ci,idx:curIdx},'');
  openIdx();
}
function openIdx(){
  const v=curFlat[curIdx]; if(!v)return;
  document.getElementById('pFrame').src=`https://drive.google.com/file/d/${v.id}/preview`;
  document.getElementById('pTitle').textContent=(v.n?v.n+'. ':'')+v.title;
  document.getElementById('pOpen').href=`https://drive.google.com/file/d/${v.id}/view`;
  document.getElementById('modal').classList.add('on');
  document.body.style.overflow='hidden';
}
function nav(d){ if(curIdx+d>=0 && curIdx+d<curFlat.length){curIdx+=d;openIdx();if(history.state&&history.state.v==='player'){history.replaceState({v:'player',ci:history.state.ci,idx:curIdx},'');}} }
function hidePlayer(){document.getElementById('modal').classList.remove('on');document.getElementById('pFrame').src='';document.body.style.overflow='';}
function closePlayer(){ if(history.state&&history.state.v==='player'){history.back();} else {hidePlayer();} }
window.addEventListener('popstate',function(e){
  const st=e.state||{v:'grid'};
  if(st.v==='player'){ curCourse=st.ci; render(); curFlat=CATALOG.courses[st.ci].videos; curIdx=st.idx; openIdx(); }
  else if(st.v==='course'){ hidePlayer(); curCourse=st.ci; render(); }
  else { hidePlayer(); curCourse=-1; render(); }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePlayer();});
if(sessionStorage.getItem('pc_videos_auth')==='1'){enter();}
